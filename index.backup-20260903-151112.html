        <p class="nota" id="decRisNota"></p>
      </div>
      <div id="confBox"></div>
      <div class="sim-chips">
        <div class="sim-chip"><div class="k">Capitale di partenza</div><div class="v" id="decChipIniziale">—</div></div>
        <div class="sim-chip"><div class="k" id="decChipPrelevatoEt">Totale prelevato</div><div class="v" id="decChipPrelevato">—</div></div>
        <div class="sim-chip verde"><div class="k">Interessi maturati</div><div class="v" id="decChipInteressi">—</div></div>
        <div class="sim-chip arancio" id="decChipFiscBox" style="display:none"><div class="k">Imposta stimata</div><div class="v" id="decChipFisc">—</div></div>
      </div>
      <div class="card">
        <div class="sim-chart-testa">
          <div class="sim-chart-tit">Andamento del capitale</div>
          <div class="sim-legenda"><span><i class="sim-sw" style="background:var(--verde)"></i>Saldo residuo</span><span id="simLegConfronto" style="display:none"><i class="sim-sw confronto"></i>Scenario bloccato</span></div>
        </div>
        <div class="sim-chart-box" id="simChartBox">
          <svg id="simChart" viewBox="0 0 760 330" preserveAspectRatio="none"></svg>
          <div class="sim-tip" id="simTip"><div class="tt" id="simTipTit"></div><div class="tv" id="simTipVal"></div></div>
        </div>
      </div>
      <div class="card">
        <button class="sim-tab-toggle" onclick="simToggleTabella()">Piano di prelievo dettagliato
          <span class="hint"><svg class="sim-chev" id="simChev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <div class="sim-tab-corpo" id="simTabCorpo">
          <div class="sim-tab-scroll">
            <table class="sim-tabella">
              <thead><tr><th>Periodo</th><th>Prelievo</th><th>Interessi</th><th>Saldo residuo</th></tr></thead>
              <tbody id="simRighe"></tbody>
            </table>
          </div>
        </div>
      </div>
      <p class="sim-piede">Simulazione indicativa basata su un rendimento annuo costante e prelievi a fine periodo. Il tasso periodico è ricavato dal tasso annuo in modo coerente con la frequenza dei prelievi. Il calcolo non considera imposte, costi di gestione, commissioni o inflazione e non costituisce consulenza finanziaria.</p>
    </div>
  </div>`;
}
function decLeggiInput(){
  decStato.capitale = Math.max(0, parseFloat(document.getElementById('decCapitale').value) || 0);
  const nec = document.getElementById('decNecessita'); if(nec) decStato.necessita = Math.max(0, parseFloat(nec.value) || 0);
  const an = document.getElementById('decAnni'); if(an) decStato.anni = parseInt(an.value, 10);
  decStato.tasso = parseFloat(document.getElementById('decTasso').value);
}
function decCambiaModo(m){
  decStato.modo = m;
  document.getElementById('decModoOr').classList.toggle('on', m==='orizzonte');
  document.getElementById('decModoNec').classList.toggle('on', m==='necessita');
  document.getElementById('decCampoAnni').classList.toggle('chiuso', m!=='orizzonte');
  document.getElementById('decCampoNec').classList.toggle('chiuso', m!=='necessita');
  document.getElementById('decModoSpiega').textContent = m==='orizzonte'
    ? 'Imposti per quanti anni deve durare: ti dico quanto puoi prelevare ogni anno.'
    : 'Imposti quanto ti serve ogni anno: ti dico per quanti anni durerà il capitale.';
  decAggiorna();
}
function decCambiaFreq(k){
  decStato.freq = k;
  pillAttiva('decFreq', v=>Number(v)===k);
  decAggiorna();
}
function decCambiaFisc(k){
  decStato.fiscale = k;
  pillAttiva('decFisc', v=>v===k);
  decAggiorna();
}
function decBloccaScenario(){
  const d = decCalcola(), s = decStato;
  const desc = s.modo==='orizzonte'
    ? `${simEuro(s.capitale)} · ${simPct(s.tasso)}% · ${simAnniTesto(s.anni)}`
    : `${simEuro(s.capitale)} · ${simPct(s.tasso)}% · ${simEuro(s.necessita)}/anno`;
  decScenario = { stato:{...decStato}, periodi:d.periodi, prelievoAnnuo:d.prelievoAnnuo, prelievoP:d.prelievoP,
    nPeriodi:d.nPeriodi, freq:s.freq, perpetuo:d.perpetuo, oltre:d.oltre,
    totPrelevato:d.totPrelevato, interessi:d.interessi, testo:desc };
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('decumulo');
  decAggiorna();
  toast('Scenario bloccato: muovi i parametri per confrontare');
}
function decTogliScenario(){
  decScenario = null;
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('decumulo');
  decAggiorna();
}
function decCalcola(){
  const s = decStato;
  const r = s.tasso/100, k = s.freq;
  const i = r===0 ? 0 : Math.pow(1+r, 1/k)-1;
  const C = s.capitale;
  let P = 0, perpetuo = false, necessitaZero = false;
  if(s.modo==='orizzonte'){
    const n = Math.max(1, Math.round(s.anni*k));
    if(C<=0) P = 0;
    else if(i===0) P = C/n;
    else P = C*i/(1-Math.pow(1+i, -n));
  } else {
    if(s.necessita<=0) necessitaZero = true;
    P = Math.max(0, s.necessita)/k;
    perpetuo = C>0 && P>0 && i>0 && P <= C*i + 1e-9;
  }
  const periodi = [{t:0, saldo:C}];
  let saldo = C, totPrelevato = 0, interessi = 0, p = 0, oltre = false;
  if(C>0 && P>0){
    const maxP = 100*k;
    const limite = perpetuo ? 40*k : (s.modo==='orizzonte' ? Math.max(1, Math.round(s.anni*k)) : maxP);
    while(p < limite){
      p++;
      const interesse = saldo*i;
      let prelievo = P;
      if(!perpetuo && saldo + interesse - P < 0.005) prelievo = saldo + interesse;   // ultimo prelievo: svuota il conto
      saldo = saldo + interesse - prelievo;
      totPrelevato += prelievo; interessi += interesse;
      periodi.push({t:p/k, saldo:Math.max(0,saldo), prelievo, interesse, indice:p});
      if(!perpetuo && saldo <= 0.005){ saldo = 0; break; }
    }
    oltre = !perpetuo && s.modo==='necessita' && p>=maxP && saldo>0;
  }
  return {periodi, nPeriodi:p, perpetuo, oltre, necessitaZero,
    prelievoP:P, prelievoAnnuo:P*k, totPrelevato, interessi, saldoFinale:saldo};
}
function decDurataTesto(nPeriodi, k){
  const tot = nPeriodi/k;
  let anni = Math.floor(tot + 1e-9), mesi = Math.round((tot - anni)*12);
  if(mesi===12){ anni++; mesi = 0; }
  const pAnni = anni + (anni===1 ? ' anno' : ' anni');
  const pMesi = mesi + (mesi===1 ? ' mese' : ' mesi');
  if(anni<=0) return pMesi;
  if(mesi===0) return pAnni;
  return pAnni + ' e ' + pMesi;
}
function decAggiorna(){
  if(simPagina!=='decumulo' || !document.getElementById('simChart')) return;
  const s = decStato;
  const anVal = document.getElementById('decAnniVal'); if(anVal) anVal.textContent = simAnniTesto(s.anni);
  document.getElementById('decTassoVal').textContent = simPct(s.tasso)+'%';
  document.getElementById('decCapitaleEco').textContent = s.capitale>0 ? simEuro(s.capitale) : '';
  const necEco = document.getElementById('decNecessitaEco'); if(necEco) necEco.textContent = s.necessita>0 ? simEuro(s.necessita) + " all'anno" : '';
  document.getElementById('decHeroTag').textContent = 'Prelievo ' + SIM_FREQ_NOMI[s.freq].toLowerCase();
  const d = decCalcola();
  const et = document.getElementById('decRisEt'), cifra = document.getElementById('decRisCifra'), nota = document.getElementById('decRisNota');
  cifra.classList.remove('testo');
  const perParola = SIM_FREQ_PAROLA[s.freq];
  const aliq = FISC_ALIQ[s.fiscale] || 0;
  const imposta = Math.max(0, d.interessi) * aliq;
  let risTesto = '—', animaPrelievo = false;
  if(s.capitale<=0){
    et.textContent = 'Manca il capitale di partenza';
    cifra.textContent = '—';
    nota.textContent = 'Inserisci il capitale esistente (il montante) per vedere la simulazione.';
  } else if(s.modo==='orizzonte'){
    et.textContent = 'Puoi prelevare ogni anno';
    animaPrelievo = true; risTesto = simEuro(d.prelievoAnnuo);
    nota.innerHTML = (s.freq===1 ? '' : `Pari a <b>${simEuro(d.prelievoP)}</b> al ${perParola}. `) +
      `Partendo da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale dura <b>${simAnniTesto(s.anni)}</b> e si esaurisce alla fine.`;
  } else if(d.necessitaZero){
    et.textContent = 'Indica la necessità annua';
    cifra.textContent = '—';
    nota.textContent = 'Scrivi quanto ti serve prelevare ogni anno: calcolo io per quanti anni basterà il capitale.';
  } else if(d.perpetuo){
    et.textContent = 'Il capitale non si esaurisce';
    cifra.textContent = risTesto = 'Per sempre'; cifra.classList.add('testo');
    nota.innerHTML = `I rendimenti coprono i prelievi: prelevando <b>${simEuro(s.necessita)}</b> all'anno da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale non scende mai. Dopo 40 anni ne avresti ancora <b>${simEuro(d.saldoFinale)}</b>.`;
  } else if(d.oltre){
    et.textContent = 'Il capitale ti dura';
    cifra.textContent = risTesto = 'Oltre 100 anni'; cifra.classList.add('testo');
    nota.innerHTML = `Prelevando <b>${simEuro(s.necessita)}</b> all'anno da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale dura più di 100 anni.`;
  } else {
    et.textContent = 'Il capitale ti dura';
    cifra.textContent = risTesto = decDurataTesto(d.nPeriodi, s.freq); cifra.classList.add('testo');
    nota.innerHTML = `Prelevando <b>${simEuro(s.necessita)}</b> all'anno${s.freq===1 ? '' : ` (<b>${simEuro(d.prelievoP)}</b> al ${perParola})`} da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale si esaurisce dopo <b>${decDurataTesto(d.nPeriodi, s.freq)}</b>.`;
  }
  if(animaPrelievo) animaCifra(cifra, d.prelievoAnnuo, simEuro); else delete cifra.dataset.v;
  if(s.capitale>0 && aliq>0 && imposta>0)
    nota.innerHTML += ` L'imposta del ${simPct(aliq*100)}% sulla quota di guadagno vale circa <b>−${simEuro(imposta)}</b> sull'intero periodo${animaPrelievo ? `: il prelievo annuo equivale a <b>${simEuro(Math.max(0, d.prelievoAnnuo - imposta/Math.max(1,(d.nPeriodi/s.freq))))}</b> netti` : ''}.`;
  animaCifra(document.getElementById('decChipIniziale'), s.capitale, simEuro);
  document.getElementById('decChipPrelevatoEt').textContent = d.perpetuo ? 'Prelevato in 40 anni' : 'Totale prelevato';
  animaCifra(document.getElementById('decChipPrelevato'), d.totPrelevato, simEuro);
  animaCifra(document.getElementById('decChipInteressi'), d.interessi, simEuro);
  const fiscBox = document.getElementById('decChipFiscBox');
  if(fiscBox){
    fiscBox.style.display = (aliq>0 && s.capitale>0) ? '' : 'none';
    if(aliq>0) animaCifra(document.getElementById('decChipFisc'), imposta, simEuro);
  }
  risBarAggiorna(et.textContent, risTesto, 'var(--verde-txt)');
  const fineT = d.periodi[d.periodi.length-1].t;
  const leg = document.getElementById('simLegConfronto');
  if(leg) leg.style.display = decScenario ? '' : 'none';
  confAggiornaSblocca(!!decScenario);
  const confBox = document.getElementById('confBox');
  if(confBox){
    if(decScenario && decScenario.stato){
      const b = decScenario, bs = b.stato;
      const MODI = {orizzonte:'Quanto prelevo', necessita:'Quanto dura'};
      const durTesto = x => x.perpetuo ? 'Per sempre' : (x.oltre ? 'Oltre 100 anni' : decDurataTesto(x.nPeriodi, x.freq));
      const righe = [
        {eti:'Cosa calcolo', blocco:MODI[bs.modo], ora:MODI[s.modo], diff:confDiffTesto(bs.modo, s.modo, 'cambiato')},
        {eti:'Capitale esistente', blocco:simEuro(bs.capitale), ora:simEuro(s.capitale), diff:confDiffNum(bs.capitale, s.capitale, simEuro)}
      ];
      if(bs.modo==='necessita' && s.modo==='necessita')
        righe.push({eti:'Necessità annua', blocco:simEuro(bs.necessita), ora:simEuro(s.necessita), diff:confDiffNum(bs.necessita, s.necessita, simEuro)});
      if(bs.modo==='orizzonte' && s.modo==='orizzonte')
        righe.push({eti:'Orizzonte', blocco:simAnniTesto(bs.anni), ora:simAnniTesto(s.anni), diff:confDiffNum(bs.anni, s.anni, v=>simAnniTesto(Math.round(v)))});
      righe.push({eti:'Rendimento atteso', blocco:confPct(bs.tasso), ora:confPct(s.tasso), diff:confDiffNum(bs.tasso, s.tasso, confPct)});
      righe.push({eti:'Frequenza prelievi', blocco:SIM_FREQ_NOMI[bs.freq], ora:SIM_FREQ_NOMI[s.freq], diff:confDiffTesto(bs.freq, s.freq, 'cambiata')});
      righe.push({eti:'Regime fiscale', blocco:FISC_NOMI[bs.fiscale], ora:FISC_NOMI[s.fiscale], diff:confDiffTesto(bs.fiscale, s.fiscale, 'cambiato')});
      if(bs.modo==='orizzonte' && s.modo==='orizzonte')
        righe.push({eti:'Prelievo annuo possibile', forte:true, blocco:simEuro(b.prelievoAnnuo), ora:simEuro(d.prelievoAnnuo), diff:confDiffNum(b.prelievoAnnuo, d.prelievoAnnuo, simEuro, 'su')});
      if(bs.modo==='necessita' && s.modo==='necessita'){
        const durB = {perpetuo:b.perpetuo, oltre:b.oltre, nPeriodi:b.nPeriodi, freq:b.freq};
        const durO = {perpetuo:d.perpetuo, oltre:d.oltre, nPeriodi:d.nPeriodi, freq:s.freq};
        righe.push({eti:'Durata del capitale', forte:true, blocco:durTesto(durB), ora:durTesto(durO), diff:confDiffDurata(durB, durO)});
      }
      righe.push({eti:'Totale prelevato', blocco:simEuro(b.totPrelevato), ora:simEuro(d.totPrelevato), diff:confDiffNum(b.totPrelevato, d.totPrelevato, simEuro)});
      righe.push({eti:'Interessi maturati', blocco:simEuro(b.interessi), ora:simEuro(d.interessi), diff:confDiffNum(b.interessi, d.interessi, simEuro, 'su')});
      confBox.innerHTML = confCardHtml('decumulo', righe);
    } else confBox.innerHTML = '';
  }
  simDisegnaGrafico({periodi:d.periodi, anni:Math.max(fineT, 1), obiettivo:0, capitale:s.capitale, colore:'var(--verde)', confronto: decScenario ? decScenario.periodi : null});
  decTabella(d);
}
function decTabella(d){
  if(tabellaRimandata(d, decTabella)) return;
  const righe = d.periodi.filter(p=>p.indice!==undefined).map(p=>{
    const anno = Math.floor((p.indice-1)/decStato.freq)+1, dentro = ((p.indice-1)%decStato.freq)+1;
    const eti = decStato.freq===1 ? 'Anno '+anno : `Anno ${anno} · n.${dentro}`;
    return `<tr><td>${eti}</td><td>${simEuro(p.prelievo)}</td><td>${simEuro(p.interesse)}</td><td>${simEuro(p.saldo)}</td></tr>`;
  });
  righe.unshift(`<tr><td>Oggi</td><td>—</td><td>—</td><td>${simEuro(decStato.capitale)}</td></tr>`);
  document.getElementById('simRighe').innerHTML = righe.join('');
}

function uniCalcola(){
  const s = uniStato;
  const citta = UNI_CITTA.find(c=>c.k===s.citta) || UNI_CITTA[0];
  const ind = UNI_INDIRIZZI.find(i=>i.k===s.indirizzo) || UNI_INDIRIZZI[0];
  const corso = UNI_CORSI.find(c=>c.k===s.corso) || UNI_CORSI[0];
  const anniTot = corso.anni + s.fuoriCorso;
  const tasse = s.tipoAteneo==='statale' ? uniTasseStatali(s.isee) : s.retta;
  let alloggio = 0, vitto = 0, trasporti = 0;
  if(s.sistemazione==='famiglia'){
    if(s.km>0) trasporti = s.mezzo==='pubblico'
      ? (25 + 0.85*s.km) * UNI_MESI                 // abbonamento mensile stimato dalla distanza
      : s.km*2*22*0.35 * UNI_MESI;                  // 0,35 €/km (costo pieno auto), 22 giorni al mese
  } else {
    alloggio = s.sistemazione==='affitto' ? citta.affitto*12 : citta.affitto*1.7*UNI_MESI;   // collegio: retta ~70% sopra l'affitto, 10 mensilità
    vitto = (s.vitto==='mensa' ? 160 : 280) * UNI_MESI;
    trasporti = 25*UNI_MESI + 400;                  // abbonamento urbano + rientri a casa
  }
  const materiale = ind.materiale;
  const annuoOggi = tasse + alloggio + vitto + trasporti + materiale;
  const infl = s.inflazione/100;
  const annoCorrente = new Date().getFullYear();
  const anni = [];
  let totale = 0;
  for(let j=0; j<anniTot; j++){
    const f = Math.pow(1+infl, s.anniMancanti + j);
    const a = { n:j+1, solare: annoCorrente + s.anniMancanti + j, fuoriCorso: j>=corso.anni,
      tasse:tasse*f, alloggio:alloggio*f, vitto:vitto*f, trasporti:trasporti*f, materiale:materiale*f };
    a.totale = a.tasse + a.alloggio + a.vitto + a.trasporti + a.materiale;
    totale += a.totale;
    anni.push(a);
  }
  const cat = {tasse:0, alloggio:0, vitto:0, trasporti:0, materiale:0};
  anni.forEach(a=>{ UNI_CAT.forEach(c=>{ cat[c.k] += a[c.k]; }); });
  return { anni, anniTot, totale, totaleOggi:annuoOggi*anniTot, annuoOggi, cat,
    tasseAnno:tasse, citta, ind, corso };
}
function uniAggiorna(){
  if(simPagina!=='universita' || !document.getElementById('uniChart')) return;
  const s = uniStato, d = uniCalcola();
  const el = id => document.getElementById(id);
  el('uniAnniMancantiVal').textContent = s.anniMancanti===0 ? 'Inizia ora' : simAnniTesto(s.anniMancanti);
  el('uniInflazioneVal').textContent = simPct(s.inflazione)+'%';
  const iseeEco = el('uniIseeEco');
  if(iseeEco) iseeEco.textContent = s.tipoAteneo==='statale'
    ? (s.isee<=22500 ? 'Sotto la no-tax area: solo tassa regionale e bollo (~'+simEuro(uniTasseStatali(s.isee))+')' : 'Tasse stimate: '+simEuro(uniTasseStatali(s.isee))+" all'anno")
    : '';
  const rettaEco = el('uniRettaEco');
  if(rettaEco) rettaEco.textContent = s.tipoAteneo!=='statale' ? 'Puoi modificarla: le rette variano molto da ateneo ad ateneo' : '';
  const cittaEco = el('uniCittaEco');
  if(cittaEco) cittaEco.textContent = s.sistemazione!=='famiglia' ? 'Stanza singola: circa '+simEuro(d.citta.affitto)+' al mese oggi' : '';
  el('uniHeroTag').textContent = d.anniTot + ' anni di studi';
  el('uniRisEt').textContent = 'Capitale complessivo necessario';
  animaCifra(el('uniRisCifra'), d.totale, simEuro);
  risBarAggiorna('Capitale necessario', simEuro(d.totale), 'var(--viola-txt)');
  const chi = s.studente ? 'per <b>'+esc(s.studente)+'</b>' : 'per lo studente';
  const quando = s.anniMancanti===0 ? 'con inizio immediato' : 'con inizio tra <b>'+simAnniTesto(s.anniMancanti)+'</b>';
  el('uniRisNota').innerHTML = `Stima ${chi}: ${d.corso.nome.toLowerCase()}${s.fuoriCorso?' più '+simAnniTesto(s.fuoriCorso)+' fuori corso':''}, ${quando}. Ai prezzi di oggi servirebbero <b>${simEuro(d.annuoOggi)}</b> all'anno; la cifra qui sopra è già rivalutata al ${simPct(s.inflazione)}% annuo fino a ciascun anno di corso.`;
  animaCifra(el('uniChipAnnuo'), d.annuoOggi, simEuro);
  animaCifra(el('uniChipOggi'), d.totaleOggi, simEuro);
  animaCifra(el('uniChipInflazione'), Math.max(0, d.totale - d.totaleOggi), v=>'+' + simEuro(v));
  // composizione della spesa
  const comp = el('uniComp'), leg = el('uniLeg');
  const tot = d.totale || 1;

}
function uniDisegnaGrafico(d){
  const W=760, H=330, padL=70, padR=16, padT=26, padB=38;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const maxVal = Math.max(...d.anni.map(a=>a.totale))*1.12 || 1;
  const passo = simPassoBello(maxVal/5);
  const yTicks = [];
  for(let v=0; v<=maxVal; v+=passo) yTicks.push(v);
  if(yTicks[yTicks.length-1] < maxVal) yTicks.push(yTicks[yTicks.length-1] + passo);
  const yMax = yTicks[yTicks.length-1] || 1;
  const yPerV = v => padT + (1 - v/yMax)*innerH;
  let svg = '';
  yTicks.forEach(v=>{
    const y = yPerV(v).toFixed(1);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bordo)" stroke-width="1"/>`;
    svg += `<text x="${padL-10}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="13" fill="var(--muto)">€ ${simCompatto(v)}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  const n = d.anni.length;
  const slot = innerW/n;
  const barW = Math.min(64, slot*0.62);
  d.anni.forEach((a,idx)=>{
    const x = padL + slot*idx + (slot-barW)/2;
    const y = yPerV(a.totale);
    const colore = a.fuoriCorso ? 'var(--arancio)' : 'var(--viola)';
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,(H-padB-y)).toFixed(1)}" rx="6" fill="${colore}" opacity="0.9"/>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="650" fill="var(--muto)">€ ${simCompatto(a.totale)}</text>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="12.5" fill="var(--muto)">${n>7 ? a.solare : a.n+'º · '+a.solare}</text>`;
  });
  document.getElementById('uniChart').innerHTML = svg;
}
function uniTabella(d){
  if(tabellaRimandata(d, uniTabella)) return;
  const righe = d.anni.map(a=>`<tr>
    <td>${a.n}º anno · ${a.solare}${a.fuoriCorso?' <span class="muto">(fuori corso)</span>':''}</td>
    <td>${simEuro(a.tasse)}</td><td>${simEuro(a.alloggio)}</td><td>${simEuro(a.vitto)}</td>
    <td>${simEuro(a.trasporti)}</td><td>${simEuro(a.materiale)}</td><td><b>${simEuro(a.totale)}</b></td>
  </tr>`).join('');

  document.getElementById('uniRighe').innerHTML = righe + totRiga;
}

const SUC_OPZIONI = [

];
const SUC_DESIGNAZIONI = [
  {k:'nominativi',   nome:'Indicati per nome'},
  {k:'legittimi',    nome:'Eredi legittimi'},
  {k:'testamentari', nome:'Eredi testamentari'}
];
const SUC_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.4" r="2.3"/><path d="M12 6.7v2.6M4.6 9.3h14.8M4.6 9.3v2.6M12 9.3v2.6M19.4 9.3v2.6"/><circle cx="4.6" cy="14.5" r="2.3"/><circle cx="12" cy="14.5" r="2.3"/><circle cx="19.4" cy="14.5" r="2.3"/></svg>';

let sucScenario = null;                                    // scenario bloccato per il confronto
let sucSezioni = {altri:false, patr:true, imm:true, pol:false, dis:false};   // sezioni aperte nel pannello
let sucStato = {
  /* patrimonio che entra nella massa ereditaria */
  liquidita:150000,
  titoliInvestito:200000, titoli:250000,              // capitale investito e montante attuale
  titoliStatoInvestito:95000, titoliStato:100000,

  opzioni:{beniMobili:false, altriBeni:false, passivita:false, disabili:false},
  immobili:[
    {id:'im1', tipo:'appartamento', nome:'Abitazione principale', indirizzo:'', valore:400000, primaCasa:true},
    {id:'im2', tipo:'appartamento', nome:'Seconda casa',          indirizzo:'', valore:180000, primaCasa:false}
  ],
  /* capitali fuori successione */
  polizza:    {attiva:true,  capitale:150000, versato:0, designazione:'nominativi',
               beneficiari:[{id:'bp1', nome:'', quota:100}]},
  tcm:        {attiva:false, capitale:200000, versato:0, designazione:'legittimi',  beneficiari:[]},
  previdenza: {attiva:false, capitale:80000,  versato:60000, designazione:'legittimi', beneficiari:[]},
  /* situazione familiare */

  /* tipo di successione */
  modo:'legittima',                      // 'legittima' | 'testamentaria'
  quote:{}                               // key erede -> quota % del testamento
};

/* ---------- formattazione ---------- */
function sucPct(f){ return (isFinite(f)?f*100:0).toLocaleString('it-IT',{minimumFractionDigits:0, maximumFractionDigits:2}) + '%'; }
function sucFrazione(f){
  const noti = [[1,'intero'],[1/2,'1/2'],[1/3,'1/3'],[2/3,'2/3'],[1/4,'1/4'],[3/4,'3/4'],[1/6,'1/6'],[1/12,'1/12'],[1/8,'1/8']];
  for(const [v,t] of noti) if(Math.abs(f-v)<0.0005) return t;
  return '';
}
function sucNomeTipoImmobile(k){ const t = SUC_TIPI_IMMOBILE.find(x=>x.k===k); return t ? t.nome : 'Immobile'; }
function sucEtichettaImmobile(i){ return (i.nome||'').trim() || sucNomeTipoImmobile(i.tipo); }

/* ---------- quote della successione legittima (senza testamento) ----------
   Figli: escludono ascendenti e fratelli (artt. 566, 581 c.c.).
   Coniuge: 1/2 con un figlio, 1/3 con due o più figli (art. 581).
   Senza figli: coniuge 2/3, il restante 1/3 ad ascendenti e fratelli con riserva
   di 1/4 dell'eredità agli ascendenti (art. 582); senza coniuge, ascendenti e fratelli
   concorrono per capi con almeno la metà agli ascendenti (art. 571). */
function sucQuoteLegge(coniuge, nFigli, nAsc, nFra){
  const z = {coniuge:0, figli:0, ascendenti:0, fratelli:0};
  if(nFigli>0){
    if(coniuge) return nFigli===1 ? {...z, coniuge:1/2, figli:1/2} : {...z, coniuge:1/3, figli:2/3};
    return {...z, figli:1};
  }
  const asc = nAsc>0, fra = nFra>0;
  if(coniuge){
    if(!asc && !fra) return {...z, coniuge:1};
    if(asc && fra){
      let qa = (1/3) * (nAsc/(nAsc+nFra));
      if(qa < 1/4) qa = 1/4;                       // riserva minima agli ascendenti
      return {...z, coniuge:2/3, ascendenti:qa, fratelli:1/3 - qa};
    }
    if(asc) return {...z, coniuge:2/3, ascendenti:1/3};
    return {...z, coniuge:2/3, fratelli:1/3};
  }
  if(asc && fra){
    let qa = nAsc/(nAsc+nFra);
    if(qa < 1/2) qa = 1/2;                         // agli ascendenti almeno la metà
    return {...z, ascendenti:qa, fratelli:1-qa};
  }
  if(asc) return {...z, ascendenti:1};
  if(fra) return {...z, fratelli:1};
  return z;                                        // nessun erede legittimo prossimo
}

/* ---------- quote di legittima (riservate ai legittimari, artt. 536-542 c.c.) ---------- */
function sucQuoteRiservate(coniuge, nFigli, nAsc){
  const asc = nAsc>0;
  if(coniuge && nFigli===1)  return {coniuge:1/3,  figli:1/3, ascendenti:0};
  if(coniuge && nFigli>=2)   return {coniuge:1/4,  figli:1/2, ascendenti:0};
  if(coniuge && asc)         return {coniuge:1/2,  figli:0,   ascendenti:1/4};
  if(coniuge)                return {coniuge:1/2,  figli:0,   ascendenti:0};
  if(nFigli===1)             return {coniuge:0,    figli:1/2, ascendenti:0};
  if(nFigli>=2)              return {coniuge:0,    figli:2/3, ascendenti:0};
  if(asc)                    return {coniuge:0,    figli:0,   ascendenti:1/3};
  return {coniuge:0, figli:0, ascendenti:0};
}

/* ---------- elenco degli eredi/beneficiari ---------- */
function sucEredi(){
  const s = sucStato, l = [];
  if(s.coniuge) l.push({key:'coniuge', nome:'Coniuge', breve:'Coniuge', gruppo:'coniuge', classe:'retta'});
  for(let i=0;i<s.figli;i++)      l.push({key:'figlio'+i, nome:'Figlio '+(i+1),  breve:'Figlio '+(i+1), gruppo:'figli', classe:'retta'});
  for(let i=0;i<s.ascendenti;i++) l.push({key:'asc'+i,    nome:'Ascendente '+(i+1), breve:'Asc. '+(i+1), gruppo:'ascendenti', classe:'retta'});
  for(let i=0;i<s.fratelli;i++)   l.push({key:'fra'+i,    nome:'Fratello/sorella '+(i+1), breve:'Fr. '+(i+1), gruppo:'fratelli', classe:'fratelli'});
  s.altri.forEach((a,i)=> l.push({key:a.id, nome:a.nome || ('Beneficiario '+(i+1)), breve:(a.nome || ('Ben. '+(i+1))).split(' ')[0], gruppo:'altri', classe:a.classe||'altri', custom:true}));
  l.forEach(e=> e.disabile = !!s.disabili[e.key]);
  return l;
}
function sucQuoteIndividualiLegge(eredi){
  const s = sucStato, g = sucQuoteLegge(s.coniuge, s.figli, s.ascendenti, s.fratelli), m = {};
  const altri = eredi.filter(e=>e.gruppo==='altri');
  const nessunProssimo = !s.coniuge && !s.figli && !s.ascendenti && !s.fratelli;
  eredi.forEach(e=>{
    if(e.gruppo==='coniuge')         m[e.key] = g.coniuge;
    else if(e.gruppo==='figli')      m[e.key] = g.figli/s.figli;
    else if(e.gruppo==='ascendenti') m[e.key] = g.ascendenti/s.ascendenti;
    else if(e.gruppo==='fratelli')   m[e.key] = g.fratelli/s.fratelli;
    else                             m[e.key] = (nessunProssimo && altri.length) ? 1/altri.length : 0;
  });
  return m;
}
function sucQuoteIndividualiTestamento(eredi){
  const s = sucStato, m = {};
  let somma = 0;
  eredi.forEach(e=> somma += Math.max(0, Number(s.quote[e.key])||0)/100);
  const fattore = somma > 1.0000001 ? 1/somma : 1;
  eredi.forEach(e=> m[e.key] = (Math.max(0, Number(s.quote[e.key])||0)/100) * fattore);
  return {mappa:m, somma};
}
/* Allinea l'oggetto delle quote testamentarie agli eredi presenti (azzerando le voci scomparse). */
function sucAllineaQuote(reimposta){
  const eredi = sucEredi(), legge = sucQuoteIndividualiLegge(eredi), nuovo = {};
  eredi.forEach(e=>{
    nuovo[e.key] = (!reimposta && sucStato.quote[e.key]!=null)
      ? sucStato.quote[e.key]
      : Math.round(legge[e.key]*10000)/100;
  });
  sucStato.quote = nuovo;
}
/* Minimo e massimo assegnabili a ciascun beneficiario per testamento.
   Il minimo è la riserva di legge del legittimario; il massimo è quanto resta
   una volta garantite le riserve di tutti gli altri legittimari. */
function sucLimitiQuote(){
  const s = sucStato, eredi = sucEredi();
  const ris = sucQuoteRiservate(s.coniuge, s.figli, s.ascendenti);
  const minimi = {};
  eredi.forEach(e=>{
    minimi[e.key] =
      e.gruppo==='coniuge'    ? ris.coniuge :
      e.gruppo==='figli'      ? (s.figli>0 ? ris.figli/s.figli : 0) :
      e.gruppo==='ascendenti' ? (s.ascendenti>0 ? ris.ascendenti/s.ascendenti : 0) : 0;
  });
  const sommaMin = Object.values(minimi).reduce((a,b)=>a+b, 0);
  const limiti = {};
  eredi.forEach(e=>{
    const altrui = sommaMin - minimi[e.key];
    limiti[e.key] = {min:minimi[e.key]*100, max:Math.max(0, (1-altrui)*100)};
  });
  return {limiti, minimi, sommaMin, eredi};
}
/* Massimo effettivo: oltre alla riserva altrui, il totale non può superare il 100%.
   Restituisce anche quale dei due vincoli sta mordendo, per dare il messaggio giusto. */
function sucMassimoEffettivo(key){
  const {limiti, eredi} = sucLimitiQuote();
  if(!limiti[key]) return {massimo:100, vincolo:'nessuno', restante:100};
  const altri = eredi.reduce((a,e)=> e.key===key ? a : a + Math.max(0, Number(sucStato.quote[e.key])||0), 0);
  const perLegge = limiti[key].max, restante = 100 - altri;
  const massimo = Math.max(limiti[key].min, Math.min(perLegge, restante));
  return {massimo, restante, vincolo: restante < perLegge ? 'totale' : 'legittima'};
}
/* Percentuali per gruppo familiare, secondo la legge o secondo il testamento */
function sucQuotePerGruppo(){
  const eredi = sucEredi();
  const base = sucStato.modo==='testamentaria'
    ? sucQuoteIndividualiTestamento(eredi).mappa
    : sucQuoteIndividualiLegge(eredi);
  const g = {coniuge:0, figli:0, ascendenti:0, fratelli:0, altri:0};
  eredi.forEach(e=> g[e.gruppo] += base[e.key]||0);
  return g;
}

/* ---------- ripartizione dei capitali fuori successione ----------
   Le polizze caso morte e la previdenza complementare si liquidano ai beneficiari
   designati: per nome, oppure agli eredi legittimi o testamentari secondo le quote
   della successione (qui riproporzionate al 100% del capitale). */
function sucRipartoFuori(prod, eredi, quoteLegge, quoteTest){
  if(!prod || !prod.attiva) return {voci:[], capitale:0, problema:''};
  const capitale = Math.max(0, Number(prod.capitale)||0);
  if(capitale<=0) return {voci:[], capitale:0, problema:''};
  if(prod.designazione==='nominativi'){
    const lista = prod.beneficiari || [];
    if(!lista.length) return {voci:[], capitale, problema:'Nessun beneficiario indicato: il capitale seguirebbe le regole di polizza o del fondo.'};
    const somma = lista.reduce((a,b)=>a + Math.max(0, Number(b.quota)||0), 0);
    if(somma<=0) return {voci:lista.map((b,i)=>({nome:b.nome || ('Beneficiario '+(i+1)), quota:0, importo:0})), capitale,
      problema:'Quote dei beneficiari tutte a zero: assegna almeno una percentuale.'};
    return {voci:lista.map((b,i)=>{
      const q = Math.max(0, Number(b.quota)||0)/somma;
      return {nome:b.nome || ('Beneficiario '+(i+1)), quota:q, importo:capitale*q};
    }), capitale, problema: Math.abs(somma-100)>0.01 ? 'Le quote indicate sommano a ' + somma.toLocaleString('it-IT',{maximumFractionDigits:2}) + '%: vengono riproporzionate a 100%.' : ''};
  }
  let base = prod.designazione==='testamentari' ? quoteTest : quoteLegge;
  let somma = eredi.reduce((a,e)=>a + (base[e.key]||0), 0);
  let nota = '';
  /* Designazione «eredi testamentari» senza testamento (o con quote non assegnate):
     il capitale si liquida a chi eredita per legge. */
  if(prod.designazione==='testamentari' && somma<=0){
    base = quoteLegge;
    somma = eredi.reduce((a,e)=>a + (base[e.key]||0), 0);
    nota = 'Non ci sono quote testamentarie: il capitale è attribuito agli eredi legittimi.';
  }
  if(somma<=0) return {voci:[], capitale, problema:'Nessun erede a cui attribuire il capitale: verifica la situazione familiare o le quote del testamento.'};
  return {voci:eredi.filter(e=>(base[e.key]||0)>0).map(e=>{
    const q = (base[e.key]||0)/somma;
    return {nome:e.nome, quota:q, importo:capitale*q};
  }), capitale, problema:nota};
}

/* ---------- motore di calcolo ---------- */
function sucCalcola(){
  const s = sucStato;
  const immobiliTot = s.immobili.reduce((a,i)=>a + (Number(i.valore)||0), 0);
  const comp = {
    liquidita:s.liquidita, titoli:s.titoli, titoliStato:s.titoliStato, immobili:immobiliTot,
    partecipazioni:s.partecipazioni, crediti:s.crediti, beniMobili:s.beniMobili, altriBeni:s.altriBeni
  };
  const lordo = SUC_CAT.reduce((a,c)=>a + (comp[c.k]||0), 0);
  const passivita = s.opzioni.passivita ? (s.mutui + s.altrePassivita) : 0;
  const netto = Math.max(0, lordo - passivita);                // asse ereditario netto
  const esente = s.titoliStato + (s.partEsenti ? s.partecipazioni : 0);
  const imponibileGlobale = Math.max(0, netto - esente);
  const investito = s.titoliInvestito + s.titoliStatoInvestito;
  const plusvalenza = (s.titoli + s.titoliStato) - investito;

  const eredi = sucEredi();
  const quoteLegge = sucQuoteIndividualiLegge(eredi);
  const test = sucQuoteIndividualiTestamento(eredi);
  const quote = s.modo==='testamentaria' ? test.mappa : quoteLegge;
  const riproporzionate = s.modo==='testamentaria' && test.somma > 1.0000001;
  const residuo = s.modo==='testamentaria'
    ? Math.max(0, 1 - test.somma)
    : Math.max(0, 1 - eredi.reduce((a,e)=>a + quoteLegge[e.key], 0));

  const righe = eredi.map(e=>{
    const q = quote[e.key] || 0;
    const ricevuto = netto * q;
    const parteEsente = esente * q;
    const imponibile = imponibileGlobale * q;
    const cl = SUC_CLASSI[e.classe] || SUC_CLASSI.altri;
    const franchigia = e.disabile ? SUC_FRANCHIGIA_DISABILE : cl.franchigia;
    const base = Math.max(0, imponibile - franchigia);
    const imposta = base * cl.aliq;
    return {...e, quota:q, ricevuto, parteEsente, imponibile, franchigia, base, aliquota:cl.aliq, imposta, netto:ricevuto - imposta};
  });
  const impostaSuccessione = righe.reduce((a,r)=>a + r.imposta, 0);

  const immobili = s.immobili.map(i=>{
    const val = Math.max(0, Number(i.valore)||0);
    const ipo = i.primaCasa ? SUC_FISSA_PRIMA_CASA : val*SUC_ALIQ_IPOTECARIA;
    const cat = i.primaCasa ? SUC_FISSA_PRIMA_CASA : val*SUC_ALIQ_CATASTALE;
    return {...i, valore:val, ipo, cat, totale:ipo+cat};
  });
  const impostaImmobili = immobili.reduce((a,i)=>a + i.totale, 0);
  const impostaTotale = impostaSuccessione + impostaImmobili;

  /* capitali fuori successione, prodotto per prodotto */
  const prodotti = SUC_PRODOTTI.map(p=>{
    const st = s[p.k] || {};
    const r = sucRipartoFuori(st, eredi, quoteLegge, s.modo==='testamentaria' ? test.mappa : {});
    return {...p, attivo:!!st.attiva, designazione:st.designazione||'nominativi',
      versatoVal:Math.max(0, Number(st.versato)||0), ...r};
  });
  const prodottiAttivi = prodotti.filter(p=>p.attivo && p.capitale>0);
  const fuori = prodottiAttivi.reduce((a,p)=>a + p.capitale, 0);

  /* legittima: confronto fra quota riservata e quota effettivamente assegnata */
  const ris = sucQuoteRiservate(s.coniuge, s.figli, s.ascendenti);
  const assegnato = {coniuge:0, figli:0, ascendenti:0};
  righe.forEach(r=>{ if(assegnato[r.gruppo]!=null) assegnato[r.gruppo] += r.quota; });
  const legittimari = [];
  if(s.coniuge)       legittimari.push({k:'coniuge',    eti:'Coniuge'});
  if(s.figli>0)       legittimari.push({k:'figli',      eti: s.figli===1 ? 'Figlio' : 'Figli ('+s.figli+')'});
  if(s.figli===0 && s.ascendenti>0) legittimari.push({k:'ascendenti', eti:'Ascendenti ('+s.ascendenti+')'});
  const verifiche = legittimari.map(g=>{
    const mancante = Math.max(0, ris[g.k] - assegnato[g.k]);
    return {eti:g.eti, riservato:ris[g.k], assegnato:assegnato[g.k], leso:mancante>0.0001, mancante, importoMancante:mancante*netto};
  });
  const disponibile = Math.max(0, 1 - ris.coniuge - ris.figli - ris.ascendenti);
  const lesione = verifiche.some(v=>v.leso);

  return {
    comp, lordo, passivita, netto, esente, imponibileGlobale, immobiliTot, investito, plusvalenza,
    eredi:righe, quote, quoteLegge, quoteTest:test.mappa, sommaTest:test.somma, residuo, riproporzionate,
    impostaSuccessione, immobili, impostaImmobili, impostaTotale,
    nettoEredi: Math.max(0, netto - impostaTotale),
    prodotti, prodottiAttivi, fuori,
    riservate:ris, verifiche, disponibile, lesione,
    haLegittimari: legittimari.length>0
  };
}

/* Alla conferma del campo: si tiene la quota richiesta e si liberano i punti
   percentuali mancanti riducendo le altre quote in proporzione, senza mai
   scendere sotto la riserva di legge di ciascun legittimario. */
function sucQuotaCommit(key){
  const {limiti, eredi} = sucLimitiQuote();
  const lim = limiti[key]; if(!lim) return;
  const q = k => Math.max(0, Number(sucStato.quote[k])||0);
  const chiesta = q(key);
  const voluta = Math.min(Math.max(chiesta, lim.min), lim.max);   // entro la riserva propria e quella altrui
  const altri = eredi.filter(e=>e.key!==key);
  let eccesso = voluta + altri.reduce((a,e)=>a + q(e.key), 0) - 100;

  const ridotti = [];
  if(eccesso > 0.005){
    /* capacità di riduzione: quanto ciascuno può cedere restando sopra la propria riserva */
    const capacita = altri.map(e=>({e, spazio:Math.max(0, q(e.key) - limiti[e.key].min)}));
    const totale = capacita.reduce((a,c)=>a + c.spazio, 0);
    const preleva = Math.min(eccesso, totale);
    if(preleva > 0.005){
      capacita.forEach(c=>{
        if(c.spazio<=0) return;
        const giu = preleva * (c.spazio/totale);
        sucStato.quote[c.e.key] = Math.round((q(c.e.key) - giu)*100)/100;
        ridotti.push(c.e.nome);
      });
    }
    eccesso -= preleva;
  }
  /* se anche azzerando lo spazio disponibile non basta, la quota si ferma al massimo di legge */
  const finale = Math.round(Math.max(lim.min, voluta - Math.max(0, eccesso))*100)/100;
  sucStato.quote[key] = finale;

  /* pareggio degli arrotondamenti sulla quota altrui più capiente */
  const somma = eredi.reduce((a,e)=>a + q(e.key), 0);
  if(Math.abs(somma-100) > 0.001 && altri.length){
    const cand = altri.map(e=>({e, spazio:q(e.key) - limiti[e.key].min}))
                      .sort((a,b)=>b.spazio-a.spazio)[0];
    if(cand && cand.spazio > (somma-100)) sucStato.quote[cand.e.key] = Math.round((q(cand.e.key) - (somma-100))*100)/100;
  }
  eredi.forEach(e=>{
    const inp = document.getElementById('sucQuotaInp_'+e.key);
    if(inp) inp.value = sucStato.quote[e.key];
  });
  if(chiesta > finale + 0.005){
    toast('Massimo assegnabile ' + sucPct(finale/100) + ': gli altri sono già alla riserva di legge');
  } else if(ridotti.length){
    toast(ridotti.length===1
      ? 'Ridotta la quota di ' + ridotti[0] + ' per fare spazio'
      : 'Ridotte in proporzione le quote di ' + ridotti.slice(0,-1).join(', ') + ' e ' + ridotti[ridotti.length-1]);
  }
  sucAggiorna();
}
/* Chi può ancora cedere quota, e quanta: serve per spiegare cosa ridurre */
function sucCedibili(key){
  const {limiti, eredi} = sucLimitiQuote();
  return eredi.filter(e=>e.key!==key)
    .map(e=>({nome:e.nome, spazio:Math.max(0, (Number(sucStato.quote[e.key])||0) - limiti[e.key].min)}))
    .filter(x=>x.spazio > 0.005);
}
/* Messaggio sotto ogni quota: verde/neutro se a posto, arancio se serve liberare
   spazio (verrà fatto alla conferma), rosso se il limite di legge è invalicabile. */
function sucAggiornaValidazioneQuote(){
  if(sucStato.modo!=='testamentaria') return;
  const {limiti, eredi} = sucLimitiQuote();
  const q = k => Math.max(0, Number(sucStato.quote[k])||0);
  const somma = eredi.reduce((a,e)=>a + q(e.key), 0);
  eredi.forEach(e=>{
    const box = document.getElementById('sucQuotaBox_'+e.key);
    const hint = document.getElementById('sucQuotaHint_'+e.key);
    if(!box || !hint) return;
    const lim = limiti[e.key], v = q(e.key);
    const oltreLegge = v > lim.max + 0.005;
    const sottoRiserva = v < lim.min - 0.005;
    const serveSpazio = !oltreLegge && somma > 100.005;
    box.classList.toggle('errore', oltreLegge || sottoRiserva);
    box.classList.toggle('avviso', serveSpazio && !oltreLegge && !sottoRiserva);
    hint.classList.toggle('errore', oltreLegge || sottoRiserva);
    hint.classList.toggle('avviso', serveSpazio && !oltreLegge && !sottoRiserva);
    if(oltreLegge){
      const bloccati = eredi.filter(x=>x.key!==e.key && limiti[x.key].min>0)
                            .map(x=>x.nome + ' ' + sucPct(limiti[x.key].min/100));
      hint.textContent = 'Massimo ' + sucPct(lim.max/100) + ': la legittima riservata agli altri non si può toccare'
        + (bloccati.length ? ' (' + bloccati.join(', ') + ')' : '');
    } else if(sottoRiserva){
      hint.textContent = 'Riserva di legge: minimo ' + sucPct(lim.min/100);
    } else if(serveSpazio){
      const manca = somma - 100;
      const cedibili = sucCedibili(e.key);
      hint.textContent = cedibili.length
        ? 'Servono altri ' + sucPct(manca/100) + ': alla conferma li tolgo da ' +
          (cedibili.length===1 ? cedibili[0].nome
            : cedibili.map(c=>c.nome).slice(0,-1).join(', ') + ' e ' + cedibili[cedibili.length-1].nome) +
          ' in proporzione'
        : 'Servono altri ' + sucPct(manca/100) + ', ma le altre quote sono già alla riserva minima';
    } else {
      const cedibili = sucCedibili(e.key);
      const spazio = Math.max(0, Math.min(lim.max - v, 100 - somma + 0));
      hint.textContent = (lim.min>0 ? 'Riserva ' + sucPct(lim.min/100) + ' · ' : '')
        + (v < lim.max - 0.005
            ? 'puoi salire fino a ' + sucPct(lim.max/100) +
              (cedibili.length && spazio < lim.max - v - 0.005 ? ' riducendo le altre quote' : '')
            : 'sei al massimo consentito');
    }
  });
}

  const desc = `${simEuro(d.netto)} · ${s.modo==='legittima'?'senza testamento':'con testamento'} · imposte ${simEuro(d.impostaTotale)}`;
  sucScenario = { stato:JSON.parse(JSON.stringify(sucStato)), netto:d.netto, lordo:d.lordo, passivita:d.passivita,
    impostaSuccessione:d.impostaSuccessione, impostaImmobili:d.impostaImmobili, impostaTotale:d.impostaTotale,
    nettoEredi:d.nettoEredi, nEredi:d.eredi.length, lesione:d.lesione, fuori:d.fuori, modo:s.modo, testo:desc };
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('successione');
  sucAggiorna();
  toast('Scenario bloccato: muovi i parametri per confrontare');
}
function sucTogliScenario(){
  sucScenario = null;
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('successione');
  sucAggiorna();
}

/* ---------- aggiornamento della dashboard ---------- */
function sucAggiorna(){
  if(simPagina!=='successione' || !document.getElementById('sucChart')) return;
  const s = sucStato, d = sucCalcola(), el = id => document.getElementById(id);
  const g = sucQuotePerGruppo();
  const perLegge = s.modo==='legittima';

  /* pannello: conteggi, percentuali per gruppo, note */
  el('sucFigliVal').textContent = s.figli;
  el('sucAscendentiVal').textContent = s.ascendenti;
  el('sucFratelliVal').textContent = s.fratelli;
  el('sucModoDesc').textContent = perLegge
    ? 'Le quote sono ripartite dal codice civile fra coniuge, figli, ascendenti e fratelli.'
    : 'Assegni tu le quote: il simulatore verifica che le quote di legittima siano rispettate.';
  const badge = (id, presente, quota) => {
    const e = el(id); if(!e) return;
    e.textContent = presente ? sucPct(quota) : '—';
    e.className = 'suc-quota' + (presente && quota>0 ? ' attiva' : '');
  };
  badge('sucQConiuge', s.coniuge, g.coniuge);
  badge('sucQFigli', s.figli>0, g.figli);
  badge('sucQAscendenti', s.ascendenti>0, g.ascendenti);
  badge('sucQFratelli', s.fratelli>0, g.fratelli);
  const ciascuno = (n, quota) => n>1 ? ' · ' + sucPct(quota/n) + ' a testa' : '';
  el('sucFigliEco').textContent = s.figli>0
    ? simEuro(g.figli*d.netto) + ciascuno(s.figli, g.figli)
    : 'Nessun figlio';
  el('sucAscEco').textContent = s.ascendenti===0 ? 'Nessun ascendente in vita'
    : (perLegge && s.figli>0 ? 'Esclusi dalla successione: ci sono figli'
      : simEuro(g.ascendenti*d.netto) + ciascuno(s.ascendenti, g.ascendenti));
  el('sucFraEco').textContent = s.fratelli===0 ? 'Nessun fratello o sorella'
    : (perLegge && s.figli>0 ? 'Esclusi dalla successione: ci sono figli'
      : (perLegge && g.fratelli===0 ? 'Esclusi: ereditano coniuge e ascendenti'
        : simEuro(g.fratelli*d.netto) + ciascuno(s.fratelli, g.fratelli)));
  const plus = (v, inv) => {
    if(inv<=0) return '';
    const dlt = v - inv;
    return dlt>=0 ? 'Plusvalenza latente: +' + simEuro(dlt) : 'Minusvalenza latente: −' + simEuro(-dlt);
  };
  el('sucTitoliEco').textContent = plus(s.titoli, s.titoliInvestito);
  el('sucTitoliStatoEco').textContent = (plus(s.titoliStato, s.titoliStatoInvestito) + ' · Esenti da imposta di successione').replace(/^ · /,'');
  sucAggiornaValidazioneQuote();
  const qEco = el('sucQuoteEco');
  if(qEco){
    const tot = d.sommaTest*100;
    qEco.textContent = 'Assegnato ' + tot.toLocaleString('it-IT',{maximumFractionDigits:2}) + '%' +
      (tot < 99.995 ? ' · residuo ' + (100-tot).toLocaleString('it-IT',{maximumFractionDigits:2}) + '%' : (tot > 100.005 ? ' · oltre il 100%' : ' · quote complete'));
  }
  const prevEco = el('sucProdEco_previdenza');
  if(prevEco){
    const st = s.previdenza, dlt = st.capitale - st.versato;
    prevEco.textContent = st.versato>0 ? (dlt>=0 ? 'Rendimento maturato: +' + simEuro(dlt) : 'Perdita: −' + simEuro(-dlt)) : '';
  }
  /* totali nelle intestazioni delle sezioni richiudibili */
  const sezVal = (k, testo) => { const e = el('sucSezVal_'+k); if(e) e.textContent = testo; };
  sezVal('altri', s.altri.length ? s.altri.length + (s.altri.length===1?' persona':' persone') : 'nessuno');
  sezVal('patr', simEuro(d.lordo - d.immobiliTot));
  sezVal('imm', s.immobili.length ? s.immobili.length + ' · ' + simEuro(d.immobiliTot) : 'nessuno');
  sezVal('pol', d.fuori>0 ? simEuro(d.fuori) : 'nessuna');
  if(s.opzioni.passivita) sezVal('pass', simEuro(d.passivita));
  if(s.opzioni.disabili){
    const nDis = Object.values(s.disabili).filter(Boolean).length;
    sezVal('dis', nDis ? nDis + (nDis===1?' persona':' persone') : 'nessuno');
  }

  /* hero */
  el('sucHeroTag').textContent = perLegge ? 'Senza testamento' : 'Con testamento';
  el('sucRisEt').textContent = 'Totale imposte della successione';
  animaCifra(el('sucRisCifra'), d.impostaTotale, simEuro);
  risBarAggiorna('Totale imposte', simEuro(d.impostaTotale), 'var(--teal-txt)');
  const incidenza = d.netto>0 ? d.impostaTotale/d.netto : 0;
  el('sucRisNota').innerHTML = `Su un asse ereditario di <b>${simEuro(d.netto)}</b> le imposte pesano il <b>${sucPct(incidenza)}</b>: ` +
    `<b>${simEuro(d.impostaSuccessione)}</b> di imposta di successione e <b>${simEuro(d.impostaImmobili)}</b> di ipotecaria e catastale. ` +
    `Agli eredi restano <b>${simEuro(d.nettoEredi)}</b>` +
    (d.fuori>0 ? `, oltre a <b>${simEuro(d.fuori)}</b> di polizze e previdenza che vanno direttamente ai beneficiari designati, esenti da imposta.` : '.');

  /* avvisi */
  const avvisi = [];
  if(!d.eredi.length) avvisi.push({t:'rosso', txt:'Nessun erede indicato: imposta la situazione familiare o aggiungi altri beneficiari. In mancanza di parenti entro il 6º grado l\'eredità è devoluta allo Stato.'});
  if(d.lesione) avvisi.push({t:'rosso', txt:'Le quote assegnate ledono la legittima: i legittimari lesi possono esperire l\'azione di riduzione entro 10 anni dall\'apertura della successione.'});
  if(d.riproporzionate) avvisi.push({t:'arancio', txt:'Le quote del testamento superano il 100%: il calcolo le riproporziona a 100%.'});
  else if(d.residuo > 0.0001 && !perLegge) avvisi.push({t:'arancio', txt:'Quota non assegnata: ' + sucPct(d.residuo) + ' del patrimonio (' + simEuro(d.residuo*d.netto) + ') resta senza destinatario e si devolve secondo le regole della successione legittima.'});
  if(perLegge && d.residuo > 0.0001 && d.eredi.length) avvisi.push({t:'arancio', txt:'Solo ' + sucPct(1-d.residuo) + ' del patrimonio trova un erede fra quelli indicati: il resto spetta ad altri parenti entro il 6º grado o allo Stato.'});
  d.prodottiAttivi.forEach(p=>{ if(p.problema) avvisi.push({t:'arancio', txt:p.nome + ' — ' + p.problema}); });
  if(s.partEsenti && s.partecipazioni>0) avvisi.push({t:'info', txt:'Partecipazioni escluse dall\'imposta per ' + simEuro(s.partecipazioni) + ': l\'esenzione decade se gli eredi non proseguono l\'attività per almeno 5 anni.'});
  el('sucAvvisi').innerHTML = avvisi.map(a=>`<div class="suc-avviso ${a.t}">${a.txt}</div>`).join('');

  /* chip */
  animaCifra(el('sucChipAsse'), d.netto, simEuro);
  animaCifra(el('sucChipSucc'), d.impostaSuccessione, simEuro);
  animaCifra(el('sucChipImm'), d.impostaImmobili, simEuro);
  animaCifra(el('sucChipNetto'), d.nettoEredi, simEuro);
  el('sucChipFuoriBox').style.display = d.fuori>0 ? '' : 'none';
  if(d.fuori>0) animaCifra(el('sucChipFuori'), d.fuori, simEuro);

  /* riepilogo delle percentuali per gruppo, sopra il grafico */
  const gruppi = [
    {eti:'Coniuge',    n:s.coniuge?1:0,    q:g.coniuge,    col:'var(--teal)'},
    {eti:'Figli',      n:s.figli,          q:g.figli,      col:'var(--accento)'},
    {eti:'Ascendenti', n:s.ascendenti,     q:g.ascendenti, col:'var(--viola)'},
    {eti:'Fratelli',   n:s.fratelli,       q:g.fratelli,   col:'var(--arancio)'},
    {eti:'Altri',      n:s.altri.length,   q:g.altri,      col:'var(--muto)'}
  ].filter(x=>x.n>0);
  el('sucGruppiBox').innerHTML = gruppi.length ? `
    <div class="uni-comp">${gruppi.filter(x=>x.q>0).map(x=>`<span style="width:${(x.q*100).toFixed(2)}%;background:${x.col}"></span>`).join('')}${d.residuo>0.0001?`<span style="width:${(d.residuo*100).toFixed(2)}%;background:var(--fill-forte)"></span>`:''}</div>
    <div class="suc-gruppi">${gruppi.map(x=>`<div class="suc-gruppo">
        <span class="pallino" style="background:${x.col}"></span>
        <span class="eti">${x.eti}${x.n>1?' <span class="muto">×'+x.n+'</span>':''}</span>
        <span class="pct">${sucPct(x.q)}</span>
        <span class="imp">${simEuro(x.q*d.netto)}</span>
      </div>`).join('') + (d.residuo>0.0001 ? `<div class="suc-gruppo">
        <span class="pallino" style="background:var(--fill-forte)"></span>
        <span class="eti muto">Non assegnato</span>
        <span class="pct">${sucPct(d.residuo)}</span>
        <span class="imp">${simEuro(d.residuo*d.netto)}</span>
      </div>` : '')}</div>` : '';

  /* composizione del patrimonio */
  const tot = d.lordo || 1;
  el('sucComp').innerHTML = SUC_CAT.filter(c=>d.comp[c.k]>0).map(c=>`<span style="width:${(d.comp[c.k]/tot*100).toFixed(2)}%;background:${c.colore}"></span>`).join('');
  el('sucLeg').innerHTML = SUC_CAT.filter(c=>d.comp[c.k]>0).map(c=>`<div class="r"><span class="pallino" style="background:${c.colore}"></span>${c.nome}<span class="imp">${simEuro(d.comp[c.k])}</span><span class="pct">${(d.comp[c.k]/tot*100).toFixed(0)}%</span></div>`).join('')
    || '<div class="r muto">Nessun bene inserito</div>';
  const righeMassa = d.passivita>0
    ? [['Patrimonio lordo', simEuro(d.lordo), false],
       ['Mutui ancora da pagare', '− ' + simEuro(s.mutui), false],
       ['Altre passività', '− ' + simEuro(s.altrePassivita), false],
       ['Asse ereditario netto', simEuro(d.netto), true]]
    : [['Asse ereditario', simEuro(d.netto), true]];
  el('sucMassaBox').innerHTML = `<div class="suc-massa">${righeMassa.map(r=>`<div class="riga-massa${r[2]?' forte':''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>` +
    (d.investito>0 ? `<p class="suc-nota">Sul portafoglio titoli sono stati investiti ${simEuro(d.investito)} e il montante alla data del decesso è ${simEuro(s.titoli + s.titoliStato)}: ${d.plusvalenza>=0 ? 'una plusvalenza latente di ' + simEuro(d.plusvalenza) : 'una minusvalenza di ' + simEuro(-d.plusvalenza)}. Nell'asse ereditario entra il montante.</p>` : '');

  /* polizze e previdenza: a chi vanno */
  const cardF = el('sucCardFuori');
  if(!d.prodottiAttivi.length){ cardF.style.display = 'none'; }
  else {
    cardF.style.display = '';
    el('sucFuoriBox').innerHTML = d.prodottiAttivi.map(p=>{
      const dz = (SUC_DESIGNAZIONI.find(x=>x.k===p.designazione)||{}).nome || '';
      const righe = p.voci.length
        ? p.voci.map(v=>`<tr><td>${esc(v.nome)}</td><td>${sucPct(v.quota)}</td><td><b>${simEuro(v.importo)}</b></td></tr>`).join('')
        : `<tr><td colspan="3" class="muto">Nessun beneficiario determinato</td></tr>`;
      return `<div class="suc-prod-blocco">
        <div class="suc-prod-riga"><span class="suc-prod-nome">${p.nome}</span><span class="suc-badge teal">${dz}</span><b>${simEuro(p.capitale)}</b></div>
        ${p.versato ? `<div class="suc-nota" style="margin:0 0 9px">Capitale versato ${simEuro(p.versatoVal)} · montante ${simEuro(p.capitale)}</div>` : ''}
        <div class="conf-scroll">
          <table class="conf-tab suc-tab suc-tab-stretta">
            <thead><tr><th>Beneficiario</th><th>Quota</th><th>Importo</th></tr></thead>
            <tbody>${righe}</tbody>
          </table>
        </div>
      </div>`;
    }).join('') +
    `<div class="suc-massa"><div class="riga-massa forte"><span>Totale fuori successione</span><b>${simEuro(d.fuori)}</b></div></div>
     <p class="suc-nota">Capitali liquidati ai beneficiari designati per diritto proprio: non concorrono all'asse ereditario, non rilevano per le quote di legittima e sono esenti dall'imposta di successione. Se però la designazione è fatta in frode ai legittimari, i premi versati possono essere aggrediti con l'azione di riduzione.</p>`;
  }

  /* quote ereditarie */
  el('sucQuoteRighe').innerHTML = d.eredi.length
    ? d.eredi.map(e=>{
        const fr = sucFrazione(e.quota);
        return `<tr><td>${esc(e.nome)}${e.disabile?' <span class="suc-badge">L. 104</span>':''}</td>
          <td>${sucPct(e.quota)}${fr?' <span class="muto">('+fr+')</span>':''}</td>
          <td>${simEuro(e.ricevuto)}</td>
          <td>${e.imposta>0?simEuro(e.imposta):'<span class="conf-diff-muto">esente</span>'}</td>
          <td><b>${simEuro(e.netto)}</b></td></tr>`;
      }).join('') + (d.residuo>0.0001 ? `<tr><td class="muto">Quota non assegnata</td><td>${sucPct(d.residuo)}</td><td>${simEuro(d.residuo*d.netto)}</td><td>—</td><td>—</td></tr>` : '')
    : '<tr><td colspan="5" class="muto">Nessun erede indicato</td></tr>';

  /* verifica della legittima */
  const boxL = el('sucLegittimaBox');
  if(!d.haLegittimari){
    boxL.innerHTML = `<p class="suc-nota" style="margin-top:0">Non ci sono legittimari (coniuge, figli o, in loro mancanza, ascendenti): il testatore può disporre liberamente dell'intero patrimonio. Fratelli e sorelle non sono legittimari e non hanno una quota riservata.</p>`;
  } else {
    const righe = d.verifiche.map(v=>`<tr${v.leso?' class="forte"':''}>
        <td>${v.eti}</td>
        <td>${sucPct(v.riservato)}${sucFrazione(v.riservato)?' <span class="muto">('+sucFrazione(v.riservato)+')</span>':''} · ${simEuro(v.riservato*d.netto)}</td>
        <td>${sucPct(v.assegnato)} · ${simEuro(v.assegnato*d.netto)}</td>
        <td>${v.leso ? '<span class="conf-diff-rosso">Lesa di '+simEuro(v.importoMancante)+'</span>' : '<span class="conf-diff-verde">Rispettata</span>'}</td>
      </tr>`).join('');
    boxL.innerHTML = `<div class="conf-scroll">
        <table class="conf-tab suc-tab">
          <thead><tr><th>Legittimario</th><th>Riservato per legge</th><th>Assegnato</th><th>Esito</th></tr></thead>
          <tbody>${righe}
            <tr><td>Quota disponibile</td><td>${sucPct(d.disponibile)}${sucFrazione(d.disponibile)?' <span class="muto">('+sucFrazione(d.disponibile)+')</span>':''} · ${simEuro(d.disponibile*d.netto)}</td><td colspan="2" class="muto">Di cui il testatore può disporre liberamente</td></tr>
          </tbody>
        </table>
      </div>
      <p class="suc-nota">${d.lesione
        ? 'La quota assegnata a uno o più legittimari è inferiore alla riserva di legge: il testamento è valido ma impugnabile con l\'azione di riduzione entro 10 anni dall\'apertura della successione.'
        : 'Tutte le quote riservate dalla legge sono rispettate. Al coniuge spettano inoltre il diritto di abitazione sulla casa familiare e l\'uso dei mobili che la corredano (art. 540 c.c.), qui non valorizzati.'}</p>`;
  }

  /* immobili */
  const cardImm = el('sucCardImmobili');
  if(!d.immobili.length){ cardImm.style.display = 'none'; }
  else {
    cardImm.style.display = '';
    el('sucImmobiliRighe').innerHTML = d.immobili.map(i=>`<tr>
        <td><b>${esc(sucEtichettaImmobile(i))}</b>${i.primaCasa?' <span class="suc-badge verde">prima casa</span>':''}
          <div class="suc-sotto">${esc(sucNomeTipoImmobile(i.tipo))}${i.indirizzo?' · '+esc(i.indirizzo):''}</div></td>
        <td>${simEuro(i.valore)}</td>
        <td>${i.primaCasa ? simEuro2(SUC_FISSA_PRIMA_CASA) : simEuro(i.ipo)}</td>
        <td>${i.primaCasa ? simEuro2(SUC_FISSA_PRIMA_CASA) : simEuro(i.cat)}</td>
        <td><b>${simEuro(i.totale)}</b></td>
      </tr>`).join('') +
      `<tr class="forte"><td><b>Totale</b></td><td><b>${simEuro(d.immobiliTot)}</b></td><td colspan="2"></td><td><b>${simEuro(d.impostaImmobili)}</b></td></tr>`;
  }

  sucDisegnaGrafico(d);
  sucTabella(d);

  /* confronto con lo scenario bloccato */
  confAggiornaSblocca(!!sucScenario);
  const confBox = el('confBox');
  if(confBox){
    if(sucScenario){
      const b = sucScenario;
      const modoTxt = m => m==='legittima' ? 'Senza testamento' : 'Con testamento';
      const righe = [
        {eti:'Tipo di successione', blocco:modoTxt(b.modo), ora:modoTxt(s.modo), diff:confDiffTesto(b.modo, s.modo, 'cambiato')},
        {eti:'Patrimonio lordo', blocco:simEuro(b.lordo||b.netto), ora:simEuro(d.lordo), diff:confDiffNum(b.lordo||b.netto, d.lordo, simEuro)},
        {eti:'Passività', blocco:simEuro(b.passivita||0), ora:simEuro(d.passivita), diff:confDiffNum(b.passivita||0, d.passivita, simEuro, 'giu')},
        {eti:'Asse ereditario netto', blocco:simEuro(b.netto), ora:simEuro(d.netto), diff:confDiffNum(b.netto, d.netto, simEuro)},
        {eti:'Numero di eredi', blocco:String(b.nEredi), ora:String(d.eredi.length), diff:confDiffNum(b.nEredi, d.eredi.length, v=>String(Math.round(v)))},
        {eti:'Imposta di successione', blocco:simEuro(b.impostaSuccessione), ora:simEuro(d.impostaSuccessione), diff:confDiffNum(b.impostaSuccessione, d.impostaSuccessione, simEuro, 'giu')},
        {eti:'Ipotecaria e catastale', blocco:simEuro(b.impostaImmobili), ora:simEuro(d.impostaImmobili), diff:confDiffNum(b.impostaImmobili, d.impostaImmobili, simEuro, 'giu')},
        {eti:'Polizze e previdenza', blocco:simEuro(b.fuori||0), ora:simEuro(d.fuori), diff:confDiffNum(b.fuori||0, d.fuori, simEuro, 'su')},
        {eti:'Legittima', blocco:b.lesione?'Lesa':'Rispettata', ora:d.lesione?'Lesa':'Rispettata', diff:confDiffTesto(b.lesione, d.lesione, 'cambiata')},
        {eti:'Totale imposte', forte:true, blocco:simEuro(b.impostaTotale), ora:simEuro(d.impostaTotale), diff:confDiffNum(b.impostaTotale, d.impostaTotale, simEuro, 'giu')},
        {eti:'Netto agli eredi', forte:true, blocco:simEuro(b.nettoEredi), ora:simEuro(d.nettoEredi), diff:confDiffNum(b.nettoEredi, d.nettoEredi, simEuro, 'su')}
      ];
      confBox.innerHTML = confCardHtml('successione', righe);
    } else confBox.innerHTML = '';
  }
}

function sucDisegnaGrafico(d){
  const W=760, H=330, padL=76, padR=16, padT=26, padB=42;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const dati = d.eredi.filter(e=>e.ricevuto>0);
  if(!dati.length){
    document.getElementById('sucChart').innerHTML =
      `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="15" fill="var(--muto)">Nessuna quota da rappresentare</text>`;
    return;
  }
  const maxVal = Math.max(...dati.map(e=>e.ricevuto))*1.14 || 1;
  const passo = simPassoBello(maxVal/5);
  const yTicks = [];
  for(let v=0; v<=maxVal; v+=passo) yTicks.push(v);
  if(yTicks[yTicks.length-1] < maxVal) yTicks.push(yTicks[yTicks.length-1] + passo);
  const yMax = yTicks[yTicks.length-1] || 1;
  const yPerV = v => padT + (1 - v/yMax)*innerH;
  let svg = '';
  yTicks.forEach(v=>{
    const y = yPerV(v).toFixed(1);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bordo)" stroke-width="1"/>`;
    svg += `<text x="${padL-10}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="13" fill="var(--muto)">€ ${simCompatto(v)}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  const n = dati.length, slot = innerW/n, barW = Math.min(70, slot*0.62), etichette = n<=9;
  dati.forEach((e,idx)=>{
    const x = padL + slot*idx + (slot-barW)/2;
    const yTop = yPerV(e.ricevuto), yImposta = yPerV(e.netto);
    const hNetto = Math.max(1, (H-padB) - yImposta), hImposta = Math.max(0, yImposta - yTop);
    svg += `<rect x="${x.toFixed(1)}" y="${yImposta.toFixed(1)}" width="${barW.toFixed(1)}" height="${hNetto.toFixed(1)}" rx="6" fill="var(--teal)" opacity="0.92"/>`;
    if(hImposta > 0.8) svg += `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${hImposta.toFixed(1)}" rx="4" fill="var(--rosso)" opacity="0.9"/>`;
    if(etichette) svg += `<text x="${(x+barW/2).toFixed(1)}" y="${(yTop-8).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="650" fill="var(--muto)">€ ${simCompatto(e.ricevuto)}</text>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-24}" text-anchor="middle" font-size="12.5" fill="var(--muto)">${esc(n>6 ? e.breve : e.nome)}</text>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--testo-3)">${sucPct(e.quota)}</text>`;
  });
  document.getElementById('sucChart').innerHTML = svg;
}

}

/* Riporta uno stato salvato (anche in formato precedente) alla struttura corrente. */
function sucNormalizzaStato(d){
  const prodotto = (vecchioImporto, nuovo, versato) => {
    if(nuovo && typeof nuovo==='object'){
      return {attiva:!!nuovo.attiva, capitale:Math.max(0, Number(nuovo.capitale)||0),
        versato:Math.max(0, Number(nuovo.versato)||0),
        designazione:nuovo.designazione||'legittimi',
        beneficiari:(nuovo.beneficiari||[]).map(b=>({id:b.id||('b'+nuovoId()), nome:b.nome||'', quota:Math.max(0, Number(b.quota)||0)}))};
    }
    const imp = Math.max(0, Number(vecchioImporto)||0);
    return {attiva:imp>0, capitale:imp, versato:Math.max(0, Number(versato)||0), designazione:'legittimi', beneficiari:[]};
  };
  return {
    liquidita:Math.max(0, Number(d.liquidita)||0),
    titoliInvestito:Math.max(0, Number(d.titoliInvestito)||0),
    titoli:Math.max(0, Number(d.titoli)||0),
    titoliStatoInvestito:Math.max(0, Number(d.titoliStatoInvestito)||0),
    titoliStato:Math.max(0, Number(d.titoliStato)||0),
    partecipazioni:Math.max(0, Number(d.partecipazioni)||0), partEsenti:!!d.partEsenti,
    crediti:Math.max(0, Number(d.crediti)||0), beniMobili:Math.max(0, Number(d.beniMobili)||0),
    altriBeni:Math.max(0, Number(d.altriBeni)||0),
    mutui:Math.max(0, Number(d.mutui != null ? d.mutui : d.debiti)||0),
    altrePassivita:Math.max(0, Number(d.altrePassivita)||0),
    opzioni:{
      beniMobili: d.opzioni ? !!d.opzioni.beniMobili : (Number(d.beniMobili)||0)>0,
      altriBeni:  d.opzioni ? !!d.opzioni.altriBeni  : (Number(d.altriBeni)||0)>0,
      passivita:  d.opzioni ? !!d.opzioni.passivita  : ((Number(d.mutui)||0)+(Number(d.altrePassivita)||0)+(Number(d.debiti)||0))>0,
      disabili:   d.opzioni ? !!d.opzioni.disabili   : Object.values(d.disabili||{}).some(Boolean)
    },
    immobili:(d.immobili||[]).map(i=>({id:i.id||('im'+nuovoId()), tipo:i.tipo||'appartamento', nome:i.nome||'',
      indirizzo:i.indirizzo||'', valore:Math.max(0, Number(i.valore)||0), primaCasa:!!i.primaCasa})),
    polizza:    prodotto(d.polizze, d.polizza),
    tcm:        prodotto(0, d.tcm),
    previdenza: prodotto(d.fondoPensione, d.previdenza),
    coniuge:!!d.coniuge, figli:Number(d.figli)||0, ascendenti:Number(d.ascendenti)||0, fratelli:Number(d.fratelli)||0,
    altri:JSON.parse(JSON.stringify(d.altri||[])), disabili:{...(d.disabili||{})},
    modo:d.modo||'legittima', quote:{...(d.quote||{})}
  };
}

function mutLeggiInput(){
  const v = id => document.getElementById(id);
  if(v('mutImporto')) mutStato.importo = Math.max(0, parseFloat(v('mutImporto').value) || 0);
  if(v('mutTasso')) mutStato.tasso = Math.max(0, parseFloat(v('mutTasso').value) || 0);

  if(v('mutInizio')) mutStato.inizio = v('mutInizio').value || '';
}
function mutCambiaFreq(k){
  mutStato.freq = k;
  pillAttiva('mutFreq', v=>Number(v)===k);
  mutAggiorna();
}
function mutBloccaScenario(){
  const d = mutCalcola(), s = mutStato;
  mutScenario = { stato:{...mutStato}, rata:d.rata, interessi:d.totaleInteressi, totale:d.totaleRimborso, freq:s.freq,
    testo:`${simEuro(s.importo)} · ${simPct(s.tasso)}% · ${simAnniTesto(s.anni)} · ${SIM_FREQ_NOMI[s.freq].toLowerCase()}` };
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('mutuo');
  mutAggiorna();
