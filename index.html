function sucNomeErede(key, eredi){ const e = (eredi||sucEredi()).find(x=>x.key===key); return e ? e.nome : ''; }

/* ---------- chi eredita ---------- */
function sucEredi(s){
  s = s || sucStato;
  const l = [];
  if(s.coniuge) l.push({key:'coniuge', nome:'Coniuge', breve:'Coniuge', gruppo:'coniuge', classe:'retta', legittimario:true});
  for(let i=0;i<s.figli;i++)      l.push({key:'figlio'+i, nome:'Figlio '+(i+1), breve:'Figlio '+(i+1), gruppo:'figli', classe:'retta', legittimario:true});
  for(let i=0;i<s.ascendenti;i++) l.push({key:'asc'+i, nome:'Ascendente '+(i+1), breve:'Asc. '+(i+1), gruppo:'ascendenti', classe:'retta', legittimario: s.figli===0});
  for(let i=0;i<s.fratelli;i++)   l.push({key:'fra'+i, nome:'Fratello/sorella '+(i+1), breve:'Fr. '+(i+1), gruppo:'fratelli', classe:'fratelli', legittimario:false});
  s.altri.forEach((a,i)=>{
    const r = SUC_RAPPORTI.find(x=>x.k===a.rapporto);
    const nome = (a.nome||'').trim() || ('Beneficiario '+(i+1));
    l.push({key:a.id, nome, breve:nome.split(' ')[0], gruppo:'altri', classe: r ? r.classe : (a.classe||'altri'),
      rapporto: r ? r.nome : '', legittimario:false, custom:true});
  });
  l.forEach(e=> e.disabile = !!s.disabili[e.key]);
  return l;
}

/* ---------- quote della successione legittima (senza testamento) ----------
   Figli: escludono ascendenti e fratelli (artt. 566, 581 c.c.).
   Coniuge: 1/2 con un figlio, 1/3 con due o più figli (art. 581).
   Senza figli: coniuge 2/3, il restante 1/3 ad ascendenti e fratelli con riserva
   di 1/4 dell'eredità agli ascendenti (art. 582); senza coniuge, ascendenti e fratelli
   concorrono per capi con almeno la metà agli ascendenti (art. 571). */
function sucQuoteLegge(s){
  s = s || sucStato;
  const c = s.coniuge, f = s.figli, a = s.ascendenti, fr = s.fratelli, al = s.altri.length;
  const g = {coniuge:0, figli:0, ascendenti:0, fratelli:0, altri:0}, note = {};
  const nessunFamiliare = 'Senza testamento non ereditano: ci sono coniuge, figli, ascendenti o fratelli';
  if(f>0){
    if(c){ g.coniuge = f===1 ? 1/2 : 1/3; g.figli = 1 - g.coniuge; } else g.figli = 1;
    if(a) note.ascendenti = 'Esclusi dalla successione: ci sono figli';
    if(fr) note.fratelli = 'Esclusi dalla successione: ci sono figli';
    if(al) note.altri = nessunFamiliare;
  } else if(c){
    if(a && fr){
      g.coniuge = 2/3;
      g.ascendenti = Math.max((1/3)*(a/(a+fr)), 1/4);      // riserva minima agli ascendenti
      g.fratelli = 1 - g.coniuge - g.ascendenti;
    } else if(a){ g.coniuge = 2/3; g.ascendenti = 1/3; }
    else if(fr){ g.coniuge = 2/3; g.fratelli = 1/3; }
    else g.coniuge = 1;
    if(al) note.altri = nessunFamiliare;
  } else if(a && fr){
    g.ascendenti = Math.max(a/(a+fr), 1/2);                // agli ascendenti almeno la metà
    g.fratelli = 1 - g.ascendenti;
    if(al) note.altri = nessunFamiliare;
  } else if(a){ g.ascendenti = 1; if(al) note.altri = nessunFamiliare; }
  else if(fr){ g.fratelli = 1; if(al) note.altri = nessunFamiliare; }
  else if(al){ g.altri = 1; note.altri = 'Nessun familiare stretto: ereditano loro, in parti uguali'; }
  const conta = {coniuge: c?1:0, figli:f, ascendenti:a, fratelli:fr, altri:al};
  const perErede = {};
  sucEredi(s).forEach(e=>{ perErede[e.key] = conta[e.gruppo] ? g[e.gruppo]/conta[e.gruppo] : 0; });
  const nessunErede = !c && !f && !a && !fr && !al;
  return {gruppi:g, perErede, note, conta, nessunErede};
}

/* ---------- quote di legittima (riservate ai legittimari, artt. 536-542 c.c.) ----------
   Legittimari: coniuge, figli e — solo in mancanza di figli — ascendenti.
   Fratelli, sorelle e altri eredi non sono legittimari. */
function sucQuoteRiservate(s){
  s = s || sucStato;
  const c = s.coniuge, f = s.figli, a = s.ascendenti;
  const g = {coniuge:0, figli:0, ascendenti:0};
  if(c && f>0){ if(f===1){ g.coniuge = 1/3; g.figli = 1/3; } else { g.coniuge = 1/4; g.figli = 1/2; } }
  else if(c){ g.coniuge = 1/2; if(a>0) g.ascendenti = 1/4; }
  else if(f>0){ g.figli = f===1 ? 1/2 : 2/3; }
  else if(a>0){ g.ascendenti = 1/3; }
  const conta = {coniuge: c?1:0, figli:f, ascendenti:a};
  const perErede = {};
  sucEredi(s).forEach(e=>{ perErede[e.key] = (e.legittimario && conta[e.gruppo]) ? g[e.gruppo]/conta[e.gruppo] : 0; });
  return {gruppi:g, perErede, disponibile: Math.max(0, 1 - g.coniuge - g.figli - g.ascendenti)};
}

/* ---------- massa, beni assegnati e quote del testamento ----------
   Con testamento un bene assegnato a una persona esce dalla massa e va a lei (legato).
   Il RESTO si divide secondo le quote scritte. La legittima si verifica sul totale
   ricevuto da ciascuno (bene assegnato + quota del resto), come vuole la legge. */
function sucAsse(s){
  s = s || sucStato;
  const somma = k => (s[k]||[]).reduce((t,b)=>t + sucPos(b.valore), 0);
  const comp = {
    liquidita:sucPos(s.liquidita), titoli:sucPos(s.titoli), titoliStato:sucPos(s.titoliStato),
    immobili:somma('immobili'), partecipazioni:sucPos(s.partecipazioni), crediti:sucPos(s.crediti),
    beniMobili:somma('beniMobili'), altriBeni:somma('altriBeni')
  };
  /* auto, moto e camper: nell'asse ma fuori dalla base imponibile dell'imposta di successione */
  comp.beniMobiliEsenti = (s.beniMobili||[]).filter(b=>sucTipoMobile(b.tipo).esente).reduce((t,b)=>t + sucPos(b.valore), 0);
  /* gioielli, arredi e altri beni di uso personale già elencati: coperti dal forfait del 10% */
  comp.altriBeniForfait = (s.altriBeni||[]).filter(b=>sucForfait(b)).reduce((t,b)=>t + sucPos(b.valore), 0);
  const lordo = SUC_CAT.reduce((a,c)=>a + (comp[c.k]||0), 0);
  const passivita = s.opzioni.passivita ? (sucPos(s.mutui) + sucPos(s.altrePassivita)) : 0;
  return {comp, lordo, passivita, asse: Math.max(0, lordo - passivita)};
}
/* Quanto vale ciò che ognuno riceve direttamente per testamento, e cosa resta da dividere */
function sucMassa(s){
  s = s || sucStato;
  const A = sucAsse(s), keys = new Set(sucEredi(s).map(e=>e.key));
  const legati = {}, righe = [];
  if(s.modo==='testamentaria'){
    SUC_LISTE_BENI.forEach(L=>{
      (s[L.k]||[]).forEach(b=>{
        if(!b.a || !keys.has(b.a)) return;
        const v = sucPos(b.valore);
        legati[b.a] = (legati[b.a]||0) + v;
        righe.push({lista:L.k, listaNome:L.nome, id:b.id, nome:sucBeneNome(L.k, b), valore:v, a:b.a});
      });
    });
  }
  const totLegati = Object.values(legati).reduce((a,b)=>a+b, 0);
  /* se le passività superano i beni liberi i legati si riducono in proporzione: non si può dare più dell'asse */
  const scala = (totLegati > A.asse && totLegati > 0) ? A.asse/totLegati : 1;
  if(scala < 1){ Object.keys(legati).forEach(k=> legati[k] *= scala); righe.forEach(r=> r.valore *= scala); }
  const legatiTot = Math.min(totLegati, A.asse);
  return {...A, legati, righe, legatiTot, resto: Math.max(0, A.asse - legatiTot), ridotti: scala < 1};
}
/* Minimo (in % del resto) che una quota può avere: la riserva di legge, al netto di
   quanto quella persona riceve già con i beni assegnati. */
function sucMinQuota(s, key, M, R){
  M = M || sucMassa(s); R = R || sucQuoteRiservate(s);
  const ris = R.perErede[key] || 0;
  if(ris <= 0) return 0;
  if(M.asse <= 0) return sucArr2(ris*100);
  const mancaEuro = ris*M.asse - (M.legati[key]||0);
  if(mancaEuro <= 0) return 0;
  if(M.resto <= 0) return 100;
  return Math.min(100, Math.ceil(mancaEuro/M.resto*10000)/100);   // per eccesso: la riserva va coperta tutta
}
/* Minimi di tutti insieme. Se sommano oltre 100, i beni assegnati rendono impossibile
   rispettare la legittima dividendo il resto: le quote restano libere (minimo 0) e la
   dashboard mostra la lesione con i consigli. */
function sucMinimi(s, M, R){
  s = s || sucStato;
  M = M || sucMassa(s); R = R || sucQuoteRiservate(s);
  const min = {}; let somma = 0;
  sucEredi(s).forEach(e=>{ min[e.key] = sucMinQuota(s, e.key, M, R); somma += min[e.key]; });
  const fattibile = somma <= 100.004;
  if(!fattibile) Object.keys(min).forEach(k=> min[k] = 0);
  return {min, fattibile, somma};
}
function sucRipartiPerLegge(s){
  s = s || sucStato;
  const L = sucQuoteLegge(s);
  s.quote = {};
  sucEredi(s).forEach(e=>{ s.quote[e.key] = sucArr2((L.perErede[e.key]||0)*100); });
  sucSistemaArrotondamento(s);
}
/* Quando cambia la famiglia o un bene assegnato: chi c'è già tiene la sua quota, chi
   arriva prende la quota di legge, nessuno scende sotto il suo minimo, totale ≤ 100. */
function sucRiconciliaQuote(s){
  s = s || sucStato;
  const E = sucEredi(s), L = sucQuoteLegge(s), MM = sucMinimi(s);
  const vecchie = s.quote || {}, nuove = {}, nuovi = [];
  const c_erano = Object.keys(vecchie).length > 0;
  E.forEach(e=>{
    if(vecchie[e.key] != null) nuove[e.key] = Math.max(sucPos(vecchie[e.key]), MM.min[e.key]||0);
    else { nuove[e.key] = sucArr2((L.perErede[e.key]||0)*100); nuovi.push(e.key); }
  });
  s.quote = nuove;
  if(!c_erano){ sucRipartiPerLegge(s); return; }
  sucRiequilibra(s, nuovi);
}
/* Se il totale supera 100 riduce in proporzione chi non è «fisso», mai sotto il minimo. */
function sucRiequilibra(s, fissi){
  s = s || sucStato; fissi = fissi || [];
  const MM = sucMinimi(s), keys = Object.keys(s.quote);
  const somma = keys.reduce((t,k)=>t + (s.quote[k]||0), 0);
  const eccesso = somma - 100;
  const ridotti = [];
  if(eccesso > 0.0001){
    const mobili = keys.filter(k=>!fissi.includes(k));
    const margine = k => Math.max(0, (s.quote[k]||0) - (MM.min[k]||0));
    const totMargine = mobili.reduce((t,k)=>t + margine(k), 0);
    if(totMargine > 0){
      mobili.forEach(k=>{
        const m = margine(k);
        if(m > 0){ s.quote[k] = sucArr2(s.quote[k] - Math.min(m, eccesso*m/totMargine)); ridotti.push(k); }
      });
    }
  }
  sucSistemaArrotondamento(s, fissi);
  return ridotti;
}
/* I centesimi persi negli arrotondamenti vanno a chi ha più margine, così il totale fa 100. */
function sucSistemaArrotondamento(s, fissi){
  s = s || sucStato; fissi = fissi || [];
  const MM = sucMinimi(s), keys = Object.keys(s.quote);
  const somma = keys.reduce((t,k)=>t + (s.quote[k]||0), 0);
  const delta = sucArr2(100 - somma);
  /* solo briciole di arrotondamento (99,99 → 100): sotto 100 di più non si rialza niente,
     è la quota non assegnata */
  if(Math.abs(delta) < 0.005 || delta > 0.05) return;
  const minDi = k => MM.min[k] || 0;
  const cand = keys.filter(k=>!fissi.includes(k)).sort((a,b)=>((s.quote[b]-minDi(b)) - (s.quote[a]-minDi(a))));
  for(const k of cand){
    const nuovo = sucArr2(s.quote[k] + delta);
    if(nuovo >= minDi(k)){ s.quote[k] = nuovo; return; }
  }
}
/* Minimo e massimo assegnabili a una persona, con i beni già assegnati scontati. */
function sucLimitiQuote(s, key){
  s = s || sucStato;
  const M = sucMassa(s), R = sucQuoteRiservate(s), E = sucEredi(s), MM = sucMinimi(s, M, R);
  const min = MM.min[key] || 0;
  const altriRis = E.filter(e=>e.key!==key).map(e=>({key:e.key, nome:e.nome, pct:MM.min[e.key]||0})).filter(x=>x.pct>0);
  const max = sucArr2(100 - altriRis.reduce((t,x)=>t + x.pct, 0));
  const riserva = sucArr2((R.perErede[key]||0)*100);
  const coperta = M.asse>0 ? sucArr2((M.legati[key]||0)/M.asse*100) : 0;
  return {min, max: Math.max(min, max), altriRis, riserva, coperta, conLegati: M.legatiTot > 0, fattibile: MM.fattibile};
}
/* Anteprima mentre si scrive: dice cosa succederà alla conferma. */
function sucQuotaAnteprima(s, key, val){
  s = s || sucStato;
  const lim = sucLimitiQuote(s, key), E = sucEredi(s), MM = sucMinimi(s);
  const v = sucPos(val);
  if(v < lim.min - 0.004) return {cls:'errore', testo:`Riserva di legge: minimo ${sucPctNum(lim.min)}${lim.conLegati?' del resto':''}`};
  if(v > lim.max + 0.004) return {cls:'errore', testo:`Massimo ${sucPctNum(lim.max)}: la legittima riservata agli altri non si può toccare${lim.altriRis.length?' ('+lim.altriRis.map(x=>x.nome+' '+sucPctNum(x.pct)).join(', ')+')':''}`};
  const somma = E.reduce((t,e)=> t + (e.key===key ? v : sucPos(s.quote[e.key])), 0);
  if(somma > 100.004){
    const ridotti = E.filter(e=>e.key!==key && sucPos(s.quote[e.key]) - (MM.min[e.key]||0) > 0.004).map(e=>e.nome);
    return {cls:'avviso', testo: ridotti.length
      ? `Servono altri ${sucPctNum(somma-100)}: alla conferma li tolgo da ${ridotti.join(', ')} in proporzione`
      : `Servono altri ${sucPctNum(somma-100)}, ma le altre quote sono già alla riserva minima`};
  }
  return {cls:'', testo: sucQuotaMargineTesto(lim)};
}
function sucQuotaMargineTesto(lim){
  if(!lim.fattibile) return 'Con i beni assegnati la legittima non si può rispettare dividendo il resto: le quote sono libere, guarda «Come sistemare» nella verifica';
  let t;
  if(lim.riserva > 0 && lim.conLegati){
    t = lim.min > 0
      ? `Riserva ${sucPctNum(lim.riserva)} dell'asse (${sucPctNum(lim.coperta)} già coperta dai beni assegnati): sul resto minimo ${sucPctNum(lim.min)} · `
      : `Riserva ${sucPctNum(lim.riserva)} già coperta dai beni assegnati · `;
  } else t = lim.riserva > 0 ? `Riserva ${sucPctNum(lim.riserva)} · ` : 'Nessuna riserva · ';
  return t + `puoi salire fino a ${sucPctNum(lim.max)} riducendo le altre quote`;
}
/* Conferma: la quota si ferma nei limiti, le altre scendono in proporzione (mai sotto il minimo). */
function sucQuotaConfermaCalc(s, key, val){
  s = s || sucStato;
  const lim = sucLimitiQuote(s, key);
  let v = sucPos(val), limitato = null;
  if(v < lim.min){ v = lim.min; limitato = 'min'; }
  if(v > lim.max){ v = lim.max; limitato = 'max'; }
  s.quote[key] = sucArr2(v);
  const ridotti = sucRiequilibra(s, [key]);
  return {v:s.quote[key], limitato, ridotti};
}
/* Quote effettive con testamento: beni assegnati + quota del resto (la parte di resto
   non assegnata si devolve per legge). Frazioni dell'INTERO asse. */
function sucQuoteEffettive(s){
  s = s || sucStato;
  const L = sucQuoteLegge(s), E = sucEredi(s), M = sucMassa(s);
  const somma = E.reduce((t,e)=>t + sucPos(s.quote[e.key]), 0);
  const nonAss = Math.max(0, 1 - somma/100);
  const eff = {}, pctResto = {}, daLegati = {};
  E.forEach(e=>{
    pctResto[e.key] = sucPos(s.quote[e.key])/100 + nonAss*(L.perErede[e.key]||0);
    daLegati[e.key] = M.asse > 0 ? (M.legati[e.key]||0)/M.asse : 0;
    eff[e.key] = daLegati[e.key] + (M.asse > 0 ? pctResto[e.key]*M.resto/M.asse : 0);
  });
  return {eff, pctResto, daLegati, nonAss, somma, oltre: Math.max(0, somma-100), M};
}

/* ---------- ripartizione dei capitali fuori successione ----------
   Le polizze caso morte e la previdenza complementare si liquidano ai beneficiari
   designati: per nome, oppure agli eredi legittimi o testamentari secondo le quote
   della successione (qui riproporzionate al 100% del capitale). */
function sucRipartoFuori(prod, eredi, quoteLegge, quoteTest){
  if(!prod || !prod.attiva) return {voci:[], capitale:0, problema:''};
  const capitale = sucPos(prod.capitale);
  if(capitale<=0) return {voci:[], capitale:0, problema:''};
  if(prod.designazione==='nominativi'){
    const lista = prod.beneficiari || [];
    if(!lista.length) return {voci:[], capitale, problema:'Nessun beneficiario indicato: il capitale seguirebbe le regole di polizza o del fondo.'};
    const somma = lista.reduce((a,b)=>a + sucPos(b.quota), 0);
    if(somma<=0) return {voci:lista.map((b,i)=>({nome:b.nome || ('Beneficiario '+(i+1)), quota:0, importo:0})), capitale,
      problema:'Quote dei beneficiari tutte a zero: assegna almeno una percentuale.'};
    return {voci:lista.map((b,i)=>{
      const q = sucPos(b.quota)/somma;
      return {nome:b.nome || ('Beneficiario '+(i+1)), quota:q, importo:capitale*q};
    }), capitale, problema: Math.abs(somma-100)>0.01 ? 'Le quote indicate sommano a ' + sucPctNum(somma) + ': vengono riproporzionate a 100%.' : ''};
  }
  let base = prod.designazione==='testamentari' ? quoteTest : quoteLegge;
  let somma = eredi.reduce((a,e)=>a + (base[e.key]||0), 0);
  let nota = '';
  /* Designazione «eredi testamentari» senza testamento (o senza quote): si liquida a chi eredita per legge */
  if(prod.designazione==='testamentari' && somma<=0){
    base = quoteLegge;
    somma = eredi.reduce((a,e)=>a + (base[e.key]||0), 0);
    nota = 'Non ci sono quote testamentarie: il capitale è attribuito agli eredi legittimi.';
  }
  if(somma<=0) return {voci:[], capitale, problema:'Nessun erede a cui attribuire il capitale: verifica la situazione familiare o le quote del testamento.'};
  return {voci:eredi.filter(e=>(base[e.key]||0)>0.000001).map(e=>{
    const q = (base[e.key]||0)/somma;
    return {nome:e.nome, quota:q, importo:capitale*q};
  }), capitale, problema:nota};
}

/* ---------- motore di calcolo ---------- */
function sucCalcola(s){
  s = s || sucStato;
  const test = s.modo==='testamentaria';
  const E = sucEredi(s), L = sucQuoteLegge(s), R = sucQuoteRiservate(s);
  let eff, pctResto, daLegati, nonAss = 0, oltre = 0, sommaQuote = 100, M;
  if(test){
    const q = sucQuoteEffettive(s);
    eff = q.eff; pctResto = q.pctResto; daLegati = q.daLegati; nonAss = q.nonAss; oltre = q.oltre; sommaQuote = q.somma; M = q.M;
  } else {
    M = sucMassa(s); eff = L.perErede; pctResto = L.perErede; daLegati = {};
  }
  const comp = M.comp, lordo = M.lordo, passivita = M.passivita, netto = M.asse;
  const esente = Math.min(netto, comp.titoliStato + (s.partEsenti ? comp.partecipazioni : 0) + comp.beniMobiliEsenti);
  const imponibileGlobale = Math.max(0, netto - esente);
  /* denaro, gioielli e mobilia (art. 9 c. 2 D.Lgs. 346/1990). Senza inventario analitico il
     fisco li presume pari al 10% del valore globale netto imponibile, calcolato al netto dei
     beni di uso personale già elencati: se questi valgono meno del 10% si integra la
     differenza, se valgono di più resta il valore dichiarato. Con l'inventario si aggiunge
     il valore che ne risulta. Vale solo per l'imposta: quote e legittima non cambiano. */
  const forfaitDichiarato = Math.min(imponibileGlobale, comp.altriBeniForfait);
  const baseForfait = imponibileGlobale - forfaitDichiarato;
  const presunto = s.inventario ? 0 : baseForfait*SUC_PRESUNZIONE;
  const integrazione = s.inventario ? sucPos(s.inventarioValore) : Math.max(0, presunto - forfaitDichiarato);
  const imponibileFiscale = imponibileGlobale + integrazione;
  const investito = sucPos(s.titoliInvestito) + sucPos(s.titoliStatoInvestito);
  const plusvalenza = (comp.titoli + comp.titoliStato) - investito;

  /* imposte ipotecaria e catastale, immobile per immobile: le paga chi riceve l'immobile */
  const keys = new Set(E.map(e=>e.key));
  const immobili = (s.immobili||[]).map(i=>{
    const val = sucPos(i.valore);
    const ipo = i.primaCasa ? SUC_FISSA_PRIMA_CASA : val*SUC_ALIQ_IPOTECARIA;
    const cat = i.primaCasa ? SUC_FISSA_PRIMA_CASA : val*SUC_ALIQ_CATASTALE;
    const a = (test && i.a && keys.has(i.a)) ? i.a : '';
    return {...i, valore:val, ipo, cat, totale:ipo+cat, a, aNome: a ? sucNomeErede(a, E) : ''};
  });
  const impostaImmobili = immobili.reduce((a,i)=>a + i.totale, 0);
  const ipocatAssegnati = immobili.filter(i=>i.a).reduce((t,i)=>t + i.totale, 0);
  const ipocatMassa = impostaImmobili - ipocatAssegnati;

  /* beni mobili registrati, veicolo per veicolo: esenzione dall'imposta di successione
     (auto, moto, camper) e imposta di voltura (IPT al PRA o trascrizione nel registro),
     a carico di chi riceve il mezzo */
  const veicoli = (s.beniMobili||[]).map(b=>{
    const t = sucTipoMobile(b.tipo), val = sucPos(b.valore);
    const a = (test && b.a && keys.has(b.a)) ? b.a : '';
    return {...b, valore:val, tipoNome:t.nome, esente:!!t.esente, registro:t.registro, kwUsati: t.registro==='PRA' ? (sucPos(b.kw)>0 ? sucPos(b.kw) : t.kwStima) : null,
      kwStimati: t.registro==='PRA' && !(sucPos(b.kw)>0), voltura: val>0 ? sucVoltura(b) : 0, a, aNome: a ? sucNomeErede(a, E) : ''};
  });
  const impostaVoltura = veicoli.reduce((a,v)=>a + v.voltura, 0);
  const volturaAssegnati = veicoli.filter(v=>v.a).reduce((t,v)=>t + v.voltura, 0);
  const volturaMassa = impostaVoltura - volturaAssegnati;

  const righe = E.map(e=>{
    const q = Math.max(0, eff[e.key]||0);
    const cl = SUC_CLASSI[e.classe] || SUC_CLASSI.altri;
    const ricevuto = netto*q, parteEsente = esente*q, presuntoQuota = integrazione*q, imponibile = imponibileFiscale*q;
    const franchigia = e.disabile ? SUC_FRANCHIGIA_DISABILE : cl.franchigia;
    const base = Math.max(0, imponibile - franchigia);
    const imposta = base*cl.aliq;
    const ipocatQuota = immobili.filter(i=>i.a===e.key).reduce((t,i)=>t + i.totale, 0) + ipocatMassa*(pctResto[e.key]||0);
    const volturaQuota = veicoli.filter(v=>v.a===e.key).reduce((t,v)=>t + v.voltura, 0) + volturaMassa*(pctResto[e.key]||0);
    const legati = M.legati[e.key] || 0;
    return {...e, quota:q, ricevuto, parteEsente, presuntoQuota, imponibile, franchigia, base, aliquota:cl.aliq, classeNome:cl.nome, classeBreve:cl.breve,
      imposta, ipocatQuota, volturaQuota, altreImposte: ipocatQuota + volturaQuota,
      imposteTot: imposta + ipocatQuota + volturaQuota, netto: ricevuto - imposta - ipocatQuota - volturaQuota,
      legati, pctLegati: daLegati[e.key]||0, pctResto: pctResto[e.key]||0, dalResto: ricevuto - legati,
      quotaLegge: L.perErede[e.key]||0, riserva: R.perErede[e.key]||0, quotaTest: test ? sucPos(s.quote[e.key]) : null};
  });
  const impostaSuccessione = righe.reduce((a,r)=>a + r.imposta, 0);
  const impostaTotale = impostaSuccessione + impostaImmobili + impostaVoltura;

  /* capitali fuori successione, prodotto per prodotto */
  const prodotti = SUC_PRODOTTI.map(p=>{
    const st = s[p.k] || {};
    const r = sucRipartoFuori(st, E, L.perErede, test ? eff : {});
    return {...p, attivo:!!st.attiva, designazione:st.designazione||'nominativi', versatoVal:sucPos(st.versato), ...r};
  });
  const prodottiAttivi = prodotti.filter(p=>p.attivo && p.capitale>0);
  const fuori = prodottiAttivi.reduce((a,p)=>a + p.capitale, 0);

  /* legittima: gruppo per gruppo e persona per persona */
  const assegnato = {coniuge:0, figli:0, ascendenti:0};
  righe.forEach(r=>{ if(assegnato[r.gruppo]!=null) assegnato[r.gruppo] += r.quota; });
  const verifiche = [];
  ['coniuge','figli','ascendenti'].forEach(g=>{
    if(!(R.gruppi[g] > 0)) return;
    const eti = g==='coniuge' ? 'Coniuge' : (g==='figli' ? (s.figli===1 ? 'Figlio' : 'Figli ('+s.figli+')') : 'Ascendenti ('+s.ascendenti+')');
    const mancante = Math.max(0, R.gruppi[g] - assegnato[g]);
    const leso = netto*mancante > 0.5;
    verifiche.push({k:g, eti, riservato:R.gruppi[g], assegnato:assegnato[g], leso, mancante, importoMancante:mancante*netto,
      persone: righe.filter(r=>r.gruppo===g)});
  });
  /* un figlio può essere sotto la sua riserva anche se il gruppo nel complesso è a posto */
  const lesi = righe.filter(r=>r.riserva>0 && netto*(r.riserva - r.quota) > 0.5)
                    .map(r=>({...r, mancaEuro: netto*(r.riserva - r.quota)}));
  const lesione = verifiche.some(v=>v.leso) || lesi.length>0;
  const disponibile = R.disponibile;

  const legati = {righe:M.righe.map(r=>({...r, aNome:sucNomeErede(r.a, E)})), totale:M.legatiTot, resto:M.resto, ridotti:M.ridotti};

  const d = {
    comp, lordo, passivita, netto, esente, imponibileGlobale, immobiliTot:comp.immobili, investito, plusvalenza,
    inventario:!!s.inventario, forfaitDichiarato, presunto, integrazione, imponibileFiscale,
    eredi:righe, quote:eff, quoteLegge:L.perErede, quoteTest: test ? eff : {}, legge:L, riservate:R,
    sommaQuote, residuo:nonAss, nonAss, oltre, riproporzionate:false,
    impostaSuccessione, immobili, impostaImmobili, veicoli, impostaVoltura, beniMobiliEsenti: comp.beniMobiliEsenti, impostaTotale,
    nettoEredi: Math.max(0, netto - impostaTotale),
    prodotti, prodottiAttivi, fuori,
    verifiche, disponibile, lesione, lesi, legati,
    haLegittimari: verifiche.length>0,
    nEredi: righe.filter(r=>r.quota>0).length,
    incidenza: netto>0 ? impostaTotale/netto : 0
  };
  d.consigli = lesione ? sucConsigli(s, d) : [];
  d.avvisi = sucAvvisi(s, d);
  return d;
}

/* ---------- avvisi sopra i risultati ---------- */
function sucAvvisi(s, d){
  const test = s.modo==='testamentaria', a = [];
  if(d.legge.nessunErede) a.push({t:'rosso', txt:'<b>Nessun erede indicato.</b> Senza coniuge, figli, ascendenti, fratelli né altri beneficiari il patrimonio è devoluto allo Stato.'});
  if(d.lesione){
    const dett = d.lesi.length
      ? d.lesi.map(x=>`${esc(x.nome)}: riservato ${sucPct(x.riserva)}, riceve ${sucPct(x.quota)} (mancano ${simEuro(x.mancaEuro)})`).join(' · ')
      : d.verifiche.filter(v=>v.leso).map(v=>`${v.eti}: riservato ${sucPct(v.riservato)}, assegnato ${sucPct(v.assegnato)} (mancano ${simEuro(v.importoMancante)})`).join(' · ');
    a.push({t:'rosso', txt:`<b>Legittima lesa.</b> ${dett}${d.consigli && d.consigli.length ? ' — vedi <b>Come sistemare</b> nella verifica della legittima.' : ''} L'azione di riduzione si prescrive in 10 anni dall'apertura della successione.`});
  }
  if(d.oltre > 0.004) a.push({t:'rosso', txt:`<b>Le quote del testamento superano il 100%</b> di ${sucPctNum(d.oltre)}: correggile nel pannello.`});
  if(test && d.nonAss > 0.00004 && d.legati.resto > 0 && !d.legge.nessunErede) a.push({t:'arancio', txt:`<b>Quota non assegnata: ${sucPct(d.nonAss)} del resto</b> (${simEuro(d.legati.resto*d.nonAss)}). È corretto: quella parte si devolve secondo le regole della successione legittima, e qui è già stata distribuita così.`});
  if(d.legati.ridotti) a.push({t:'arancio', txt:'<b>I beni assegnati valgono più dell\'asse</b> (le passività riducono il patrimonio): sono stati ridotti in proporzione.'});
  if(!test && d.legge.note.altri && s.altri.length) a.push({t:'info', txt:`<b>Altri eredi.</b> ${d.legge.note.altri}.`});
  if(!test && SUC_LISTE_BENI.some(L=>(s[L.k]||[]).some(b=>b.a))) a.push({t:'info', txt:'<b>Beni assegnati a persone.</b> Contano solo con testamento: passa a «Con testamento» per vederli assegnati.'});
  d.prodottiAttivi.forEach(p=>{ if(p.problema) a.push({t:'arancio', txt:`<b>${p.nome}.</b> ${p.problema}`}); });
  if(s.partEsenti && d.comp.partecipazioni>0) a.push({t:'info', txt:`<b>Partecipazioni esenti (art. 3 c. 4-ter)</b> per ${simEuro(d.comp.partecipazioni)}: vale solo se passano a discendenti o al coniuge che proseguono l'attività per almeno 5 anni.`});
  if(d.passivita > d.lordo && d.lordo > 0) a.push({t:'arancio', txt:"<b>Le passività superano il patrimonio:</b> l'asse ereditario è zero. Valuta la rinuncia o l'accettazione con beneficio d'inventario."});
  if(d.inventario && d.integrazione<=0 && d.netto>0) a.push({t:'info', txt:"<b>Inventario analitico senza importo.</b> Indica il valore di denaro, gioielli e mobilia che risulta dall'inventario: se è zero la base imponibile resta senza integrazione."});
  return a;
}

/* ---------- consigli quando la legittima è lesa ----------
   Per ogni legittimario sotto la riserva: (1) se basta alzare la sua quota del resto,
   dico a quanto; (2) altrimenti quale bene spostare su di lui, scelto fra quelli
   assegnati a chi ha margine; (3) oppure quale bene rimettere nella massa. */
function sucConsigli(s, d){
  const out = [];
  if(s.modo!=='testamentaria' || d.netto<=0) return out;
  const M = d.legati, resto = M.resto, MM = sucMinimi(s);
  const surplus = e => Math.max(0, e.ricevuto - e.riserva*d.netto);
  const usati = new Set(), lesiKeys = new Set(d.lesi.map(l=>l.key));
  d.lesi.forEach(l=>{
    const manca = l.mancaEuro;
    let risolto = false;
    /* (1) alzare la quota del resto, se i minimi sono compatibili fra loro */
    if(resto > 0 && MM.fattibile){
      const servePct = sucArr2((l.riserva*d.netto - l.legati)/resto*100);
      const altriMin = d.eredi.filter(e=>e.key!==l.key).reduce((t,e)=>t + (MM.min[e.key]||0), 0);
      if(servePct <= 100 - altriMin + 0.004){
        out.push(`<b>${esc(l.nome)}</b>: porta la sua quota del resto ad almeno <b>${sucPctNum(servePct)}</b> (ora ${sucPctNum(sucPos(s.quote[l.key]))}): così riceve i ${simEuro(manca)} che mancano.`);
        risolto = true;
      }
    }
    /* (2) spostare su di lui un bene assegnato a chi ha margine sopra la propria riserva */
    if(!risolto){
      const spostabili = M.righe.filter(r=>r.a!==l.key && !usati.has(r.id) && !lesiKeys.has(r.a))
        .map(r=>{ const chi = d.eredi.find(e=>e.key===r.a); return chi ? {...r, chiNome:chi.nome, ok: surplus(chi) >= r.valore - 0.5} : null; })
        .filter(Boolean);
      const buoni = spostabili.filter(r=>r.ok).sort((a,b)=>a.valore-b.valore);
      const copre = buoni.find(r=>r.valore >= manca - 0.5);
      if(copre){
        usati.add(copre.id);
        out.push(`<b>${esc(l.nome)}</b>: assegna «${esc(copre.nome)}» (${simEuro(copre.valore)}) a ${esc(l.nome)} invece che a ${esc(copre.chiNome)}: basta da solo, e ${esc(copre.chiNome)} resta sopra la sua riserva.`);
        risolto = true;
      } else if(buoni.length){
        const parz = buoni[buoni.length-1];
        usati.add(parz.id);
        out.push(`<b>${esc(l.nome)}</b>: assegna «${esc(parz.nome)}» (${simEuro(parz.valore)}) a ${esc(l.nome)} invece che a ${esc(parz.chiNome)}: copre ${simEuro(parz.valore)} dei ${simEuro(manca)} che mancano.`);
      }
    }
  });
  /* (3) se resta qualcuno sotto: il bene più grande in mano a chi ha margine torna nella massa */
  if(d.lesi.length && out.length < d.lesi.length + 1){
    const cand = M.righe.filter(r=>!usati.has(r.id) && !lesiKeys.has(r.a))
      .map(r=>{ const chi = d.eredi.find(e=>e.key===r.a); return chi && surplus(chi)>0 ? {...r, chiNome:chi.nome} : null; })
      .filter(Boolean).sort((a,b)=>b.valore-a.valore);
    if(cand.length){
      const g = cand[0];
      out.push(`Oppure rimetti nella massa «${esc(g.nome)}» (${simEuro(g.valore)}, ora a ${esc(g.chiNome)}): torna a dividersi secondo le quote e alza la parte di chi è sotto.`);
    }
  }
  if(!out.length && d.lesi.length) out.push('Riduci i beni assegnati agli eredi non legittimari, o rimettili nella massa, finché ogni legittimario torna sopra la sua riserva.');
  if(!out.length) out.push('Alza le quote dei legittimari sotto la riserva riducendo quelle degli altri beneficiari.');
  return out;
}

/* ---------- interazioni ---------- */
let _sucRaf = 0;

function sucLeggiInput(){

  if(a) sucStato.ascendenti = parseInt(a.value,10)||0;

/* Se un erede sparisce, i beni che gli erano assegnati tornano nella massa */
function sucPulisciAssegnazioni(){
  const keys = new Set(sucEredi().map(e=>e.key));
  SUC_LISTE_BENI.forEach(L=>(sucStato[L.k]||[]).forEach(b=>{ if(b.a && !keys.has(b.a)) b.a = ''; }));
  Object.keys(sucStato.disabili).forEach(k=>{ if(!keys.has(k)) delete sucStato.disabili[k]; });
}
/* Cambia la struttura familiare: ripulisce assegnazioni e riallinea le quote */

  sucPulisciAssegnazioni();

function sucBeneAggiungi(k){
  const L = sucLista(k);
  if(k==='immobili') sucStato.immobili.push({id:'im'+nuovoId(), tipo:'appartamento', nome:'', indirizzo:'', valore:150000, primaCasa:false, a:''});
  else sucStato[k].push({id:'bn'+nuovoId(), tipo:L.tipi[0].k, nota:'', valore:0, kw:null, a:'', ...(k==='altriBeni' ? {forfait:!!L.tipi[0].forfait} : {})});
  sucApriSez(L.sez);
  if(k==='immobili') sucRenderImmobili(); else sucRenderBeniListe();
  sucAggiorna();
}
function sucBeneRimuovi(k, id){
  sucStato[k] = sucStato[k].filter(b=>b.id!==id);
  if(k==='immobili') sucRenderImmobili(); else sucRenderBeniListe();
  sucDopoBeni();
}
function sucBeneTesto(k, id, campo, valore){
  const b = (sucStato[k]||[]).find(x=>x.id===id); if(!b) return;
  b[campo] = valore;
  if(k==='beniMobili' && campo==='tipo'){ sucRenderBeniListe(); sucAggiorna(); return; }
  if(k==='altriBeni' && campo==='tipo'){ b.forfait = !!sucTipoValore(valore).forfait; sucRenderBeniListe(); sucAggiorna(); return; }
  sucAggiornaSoft();
}
function sucBeneKw(id, valore){
  const b = (sucStato.beniMobili||[]).find(x=>x.id===id); if(!b) return;
  b.kw = Math.max(0, parseFloat(valore)||0) || null;
  sucAggiornaSoft();
}
function sucBeneValore(k, id, valore){
  const b = (sucStato[k]||[]).find(x=>x.id===id); if(!b) return;
  b.valore = Math.max(0, numIT(valore)||0);
  /* se il bene è assegnato a qualcuno cambiano i minimi delle quote: le riallineo
     senza ridisegnare il pannello, per non perdere il cursore */
  if(sucStato.modo==='testamentaria' && b.a){ sucRiconciliaQuote(sucStato); sucAggiornaQuoteCampi(); }
  sucAggiornaSoft();
}
function sucBeneAssegna(k, id, erede){
  const b = (sucStato[k]||[]).find(x=>x.id===id); if(!b) return;
  b.a = erede || '';
  sucDopoBeni();
}
function sucDopoBeni(){
  if(sucStato.modo==='testamentaria'){ sucRiconciliaQuote(sucStato); sucAggiornaQuoteCampi(); }
  sucAggiorna();
}

function sucAltroCampo(id, campo, valore){

    if(sucStato.opzioni.disabili) sucRenderDisabili();
    sucAggiornaNomiTendine();
    sucAggiornaSoft();
  } else sucAggiorna();
}
/* il nome scritto per un «altro erede» compare subito nelle tendine «A chi va» e nelle quote */
function sucAggiornaNomiTendine(){
  const eredi = sucEredi();
  document.querySelectorAll('select.suc-achi').forEach(sel=>{
    Array.from(sel.options).forEach(o=>{
      const e = eredi.find(x=>x.key===o.value);
      if(e) o.textContent = e.nome + (e.gruppo==='altri' && e.rapporto ? ' ('+e.rapporto+')' : '');
    });
  });
  eredi.forEach(e=>{
    const box = document.getElementById('sucQuotaInp_'+e.key);
    if(!box) return;
    const nome = box.closest('.suc-quota-riga') && box.closest('.suc-quota-riga').querySelector('.suc-quota-nome');
    if(nome && nome.firstChild) nome.firstChild.nodeValue = e.nome;
  });
}
/* quote del testamento: anteprima mentre scrivi, riequilibrio alla conferma */
function sucQuotaCampo(key, valore){
  sucStato.quote[key] = Math.max(0, Math.min(100, parseFloat(valore)||0));
  const a = sucQuotaAnteprima(sucStato, key, sucStato.quote[key]);
  const box = document.getElementById('sucQuotaBox_'+key), hint = document.getElementById('sucQuotaHint_'+key);
  if(box){ box.classList.remove('errore','avviso'); if(a.cls) box.classList.add(a.cls); }
  if(hint){ hint.className = 'suc-quota-hint' + (a.cls ? ' '+a.cls : ''); hint.textContent = a.testo; }
  sucAggiornaSoft();
}
function sucQuotaCommit(key, valore){
  const eredi = sucEredi();
  const r = sucQuotaConfermaCalc(sucStato, key, valore!=null ? valore : sucStato.quote[key]);
  sucAggiornaQuoteCampi();
  const hint = document.getElementById('sucQuotaHint_'+key);
  const nomi = r.ridotti.filter(k=>k!==key).map(k=>sucNomeErede(k, eredi)).filter(Boolean);
  if(hint){
    if(r.limitato==='max'){ hint.className = 'suc-quota-hint errore'; hint.textContent = `Fermata al massimo consentito: ${sucPctNum(r.v)}`; }
    else if(r.limitato==='min'){ hint.className = 'suc-quota-hint errore'; hint.textContent = `Riportata al minimo di legge: ${sucPctNum(r.v)}`; }
    else if(nomi.length){ hint.className = 'suc-quota-hint'; hint.textContent = `Ridotte in proporzione le quote di ${nomi.join(', ')}: il totale torna a 100%.`; }
  }
  if(r.limitato==='max') toast('Massimo assegnabile ' + sucPctNum(r.v) + ': la legittima degli altri non si può toccare');
  else if(r.limitato==='min') toast('Riportata alla riserva di legge: ' + sucPctNum(r.v));
  else if(nomi.length) toast(nomi.length===1 ? 'Ridotta la quota di ' + nomi[0] + ' per fare spazio'
    : 'Ridotte in proporzione le quote di ' + nomi.slice(0,-1).join(', ') + ' e ' + nomi[nomi.length-1]);
  sucAggiorna();
}
/* riscrive i campi delle quote (senza toccare quello che si sta digitando) */
function sucAggiornaQuoteCampi(){
  if(sucStato.modo!=='testamentaria') return;
  const attivo = document.activeElement;
  sucEredi().forEach(e=>{
    const inp = document.getElementById('sucQuotaInp_'+e.key); if(!inp) return;
    if(inp!==attivo) inp.value = sucArr2(sucStato.quote[e.key]||0);
    const box = document.getElementById('sucQuotaBox_'+e.key); if(box) box.classList.remove('errore','avviso');
    const hint = document.getElementById('sucQuotaHint_'+e.key);
    if(hint && inp!==attivo){ hint.className = 'suc-quota-hint'; hint.textContent = sucQuotaMargineTesto(sucLimitiQuote(sucStato, e.key)); }
  });
}
/* messaggio sotto ogni quota quando non si sta scrivendo */
function sucAggiornaValidazioneQuote(){
  if(sucStato.modo!=='testamentaria') return;
  const attivo = document.activeElement;
  sucEredi().forEach(e=>{
    const inp = document.getElementById('sucQuotaInp_'+e.key), hint = document.getElementById('sucQuotaHint_'+e.key);
    if(!inp || !hint || inp===attivo) return;
    const a = sucQuotaAnteprima(sucStato, e.key, sucStato.quote[e.key]);
    const box = document.getElementById('sucQuotaBox_'+e.key);
    if(box){ box.classList.remove('errore','avviso'); if(a.cls) box.classList.add(a.cls); }
    hint.className = 'suc-quota-hint' + (a.cls ? ' '+a.cls : '');
    hint.textContent = a.testo;
  });
}
function sucQuoteDaLegge(){
  sucRipartiPerLegge(sucStato);
  sucAggiornaQuoteCampi();
  sucAggiorna();
  toast('Quote riportate a quelle di legge');
}
/* polizze e previdenza */
function sucProdToggle(k, on){ sucStato[k].attiva = !!on; sucRenderProdotto(k); sucAggiorna(); }
function sucProdCampo(k, campo, valore){ sucStato[k][campo] = Math.max(0, numIT(valore)||0); sucAggiornaSoft(); }
function sucProdDesignazione(k, d){
  const st = sucStato[k];
  st.designazione = d;
  if(d==='nominativi' && !st.beneficiari.length) st.beneficiari = [{id:'b'+nuovoId(), nome:'', quota:100}];
  sucRenderProdotto(k); sucAggiorna();
}
function sucProdBenAggiungi(k){
  const st = sucStato[k];
  const tot = st.beneficiari.reduce((a,b)=>a + (Number(b.quota)||0), 0);
  st.beneficiari.push({id:'b'+nuovoId(), nome:'', quota: st.beneficiari.length ? Math.max(0, sucArr2(100-tot)) : 100});
  sucRenderProdotto(k); sucAggiorna();
}
function sucProdBenRimuovi(k, id){ sucStato[k].beneficiari = sucStato[k].beneficiari.filter(b=>b.id!==id); sucRenderProdotto(k); sucAggiorna(); }
function sucProdBenCampo(k, id, campo, valore){
  const b = sucStato[k].beneficiari.find(x=>x.id===id); if(!b) return;
  b[campo] = campo==='quota' ? Math.max(0, Math.min(100, parseFloat(valore)||0)) : valore;
  sucAggiornaSoft();
}
/* voci facoltative */
function sucAggiungiVoce(k){
  sucStato.opzioni[k] = true;
  if(k==='beniMobili' || k==='altriBeni'){
    if(!Array.isArray(sucStato[k])) sucStato[k] = [];
    if(!sucStato[k].length) sucStato[k].push({id:'bn'+nuovoId(), tipo:sucLista(k).tipi[0].k, nota:'', valore:0, a:'', ...(k==='altriBeni' ? {forfait:!!sucLista(k).tipi[0].forfait} : {})});
    sucSezioni[sucLista(k).sez] = true;
    sucRenderBeniListe(); sucRenderBeniOpz();
  } else if(k==='passivita' || k==='disabili'){
    sucSezioni[k==='passivita'?'pass':'dis'] = true;
    sucRenderOpzionali();
  }
  sucAggiorna();
}
function sucRimuoviVoce(k){
  sucStato.opzioni[k] = false;
  if(k==='beniMobili' || k==='altriBeni'){ sucStato[k] = []; sucRenderBeniListe(); sucRenderBeniOpz(); }
  else if(k==='passivita'){ sucStato.mutui = 0; sucStato.altrePassivita = 0; sucRenderOpzionali(); }
  else { sucStato.disabili = {}; sucRenderOpzionali(); }
  if(sucStato.modo==='testamentaria'){ sucRiconciliaQuote(sucStato); sucAggiornaQuoteCampi(); }
  sucAggiorna();
}
function sucCampoNum(k, v){ sucStato[k] = Math.max(0, numIT(v)||0); sucAggiornaSoft(); }
/* scenario di confronto */
function sucBloccaScenario(){
  const d = sucCalcola(), s = sucStato;
  const desc = `${simEuro(d.netto)} · ${s.modo==='legittima'?'senza testamento':'con testamento'} · imposte ${simEuro(d.impostaTotale)}`;
  sucScenario = { stato:JSON.parse(JSON.stringify(sucStato)), netto:d.netto, lordo:d.lordo, passivita:d.passivita,
    impostaSuccessione:d.impostaSuccessione, impostaImmobili:d.impostaImmobili, impostaVoltura:d.impostaVoltura, impostaTotale:d.impostaTotale,
    nettoEredi:d.nettoEredi, nEredi:d.nEredi, lesione:d.lesione, fuori:d.fuori, legati:d.legati.totale, integrazione:d.integrazione, modo:s.modo, testo:desc };
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('successione');
  sucAggiorna();
  toast('Scenario bloccato: muovi i parametri per confrontare');
}
function sucTogliScenario(){
  sucScenario = null;
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('successione');
  sucAggiorna();
}

/* ---------- aggiornamento della dashboard ---------- */
function sucAggiorna(){
  if(simPagina!=='successione' || !document.getElementById('sucChart')) return;
  const s = sucStato, d = sucCalcola(), el = id => document.getElementById(id);
  const set = (id, html) => { const x = el(id); if(x) x.innerHTML = html; };
  const E = d.eredi, test = s.modo==='testamentaria', perLegge = !test;
  const g = {coniuge:0, figli:0, ascendenti:0, fratelli:0, altri:0};
  E.forEach(e=>{ g[e.gruppo] += e.quota; });

  /* pannello: conteggi, percentuali per gruppo, note */
  if(el('sucFigliVal')) el('sucFigliVal').textContent = s.figli;
  if(el('sucAscendentiVal')) el('sucAscendentiVal').textContent = s.ascendenti;
  if(el('sucFratelliVal')) el('sucFratelliVal').textContent = s.fratelli;
  set('sucModoDesc', perLegge
    ? 'Le quote sono ripartite dal codice civile fra coniuge, figli, ascendenti e fratelli.'
    : 'Assegni tu i singoli beni e le quote del resto: il simulatore controlla che la legittima sia rispettata e, se non lo è, dice come sistemare.');
  const badge = (id, presente, quota) => {
    const e = el(id); if(!e) return;
    e.textContent = presente ? sucPct(quota) : '—';
    e.className = 'suc-quota' + (presente && quota>0 ? ' attiva' : '');
  };
  badge('sucQConiuge', s.coniuge, g.coniuge);
  badge('sucQFigli', s.figli>0, g.figli);
  badge('sucQAscendenti', s.ascendenti>0, g.ascendenti);
  badge('sucQFratelli', s.fratelli>0, g.fratelli);
  const ciascuno = (n, quota) => n>1 ? ' · ' + sucPct(quota/n) + ' a testa' : '';
  const ecoGruppo = (gr, n) => {
    if(!n) return '';
    const nota = perLegge ? d.legge.note[gr] : null;
    if(nota) return nota;
    return simEuro(g[gr]*d.netto) + ciascuno(n, g[gr]);
  };
  if(el('sucFigliEco')) el('sucFigliEco').textContent = s.figli>0 ? ecoGruppo('figli', s.figli) : 'Nessun figlio';
  if(el('sucAscEco')) el('sucAscEco').textContent = s.ascendenti===0 ? 'Nessun ascendente in vita' : ecoGruppo('ascendenti', s.ascendenti);
  if(el('sucFraEco')) el('sucFraEco').textContent = s.fratelli===0 ? 'Nessun fratello o sorella'
    : (perLegge && g.fratelli===0 && !d.legge.note.fratelli ? 'Esclusi: ereditano coniuge e ascendenti' : ecoGruppo('fratelli', s.fratelli));
  s.altri.forEach(a=>{
    const e = E.find(x=>x.key===a.id); if(!e) return;
    const cl = SUC_CLASSI[e.classe] || SUC_CLASSI.altri;
    set('sucEcoAltro_'+a.id, `${cl.breve}: aliquota ${sucPct(cl.aliq)}, franchigia ${cl.franchigia?simEuro(cl.franchigia):'nessuna'}`
      + (e.quota>0 ? ` · riceve <b>${sucPct(e.quota)}</b> = ${simEuro(e.ricevuto)}` : (perLegge && d.legge.note.altri ? ' · non eredita senza testamento' : '')));
  });
  const plus = (v, inv) => {
    if(inv<=0) return '';
    const dlt = v - inv;
    return dlt>=0 ? 'Plusvalenza latente: +' + simEuro(dlt) : 'Minusvalenza latente: −' + simEuro(-dlt);
  };
  if(el('sucTitoliEco')) el('sucTitoliEco').textContent = plus(s.titoli, s.titoliInvestito);
  if(el('sucTitoliStatoEco')) el('sucTitoliStatoEco').textContent = (plus(s.titoliStato, s.titoliStatoInvestito) + ' · Esenti da imposta di successione').replace(/^ · /,'');
  d.immobili.forEach(i=> set('sucEcoImm_'+i.id, `Ipotecaria ${simEuro(i.ipo)} + catastale ${simEuro(i.cat)} = <b>${simEuro(i.totale)}</b>${i.a ? ' · a carico di '+esc(i.aNome) : ''}`));
  d.veicoli.forEach(v=> set('sucEcoBmob_'+v.id, (v.esente
      ? `<b>Esente</b> da imposta di successione · IPT voltura al PRA <b>${simEuro2(v.voltura)}</b>${v.kwStimati ? ' (stima su '+v.kwUsati+' kW: inserisci i kW reali)' : ' ('+v.kwUsati+' kW)'}`
      : `<b>Imponibile</b> per l'imposta di successione · trascrizione nel registro ${v.registro==='RID' ? 'RID' : (v.registro==='navale' ? 'navale' : (v.registro==='aeronautico' ? 'aeronautico' : 'competente'))} circa <b>${simEuro(v.voltura)}</b>`)
    + (v.a ? ' · a carico di '+esc(v.aNome) : '')));
  const prevEco = el('sucProdEco_previdenza');
  if(prevEco){
    const st = s.previdenza, dlt = st.capitale - st.versato;
    prevEco.textContent = st.versato>0 ? (dlt>=0 ? 'Rendimento maturato: +' + simEuro(dlt) : 'Perdita: −' + simEuro(-dlt)) : '';
  }
  sucAggiornaValidazioneQuote();
  if(test){
    set('sucQuoteIntro', d.legati.totale>0
      ? `I beni assegnati a una persona (${simEuro(d.legati.totale)}) escono dalla massa: queste quote dividono il <b>resto, ${simEuro(d.legati.resto)}</b>.`
      : 'Nessun bene assegnato a una persona: queste quote dividono tutto l\'asse. Con «A chi va» puoi assegnare un immobile o un bene a qualcuno.');
    E.forEach(e=>{
      let sotto = `${e.gruppo==='altri' && e.rapporto ? e.rapporto+' · ' : ''}per legge ${sucPct(e.quotaLegge)}${e.riserva>0 ? ' · riserva '+sucPct(e.riserva) : ''}`;
      if(e.legati>0) sotto += ` · riceve in tutto ${sucPct(e.quota)}: beni ${simEuro(e.legati)} + ${sucPct(e.pctResto)} del resto`;
      set('sucQSotto_'+e.key, sotto);
    });
    const qEco = el('sucQuoteEco');
    if(qEco) qEco.innerHTML = `Totale assegnato <b>${sucPctNum(d.sommaQuote)}</b>` +
      (d.oltre>0.004 ? ' · oltre il 100% di ' + sucPctNum(d.oltre)
        : (d.nonAss>0.00004 ? ' · quota non assegnata ' + sucPct(d.nonAss) + ' = ' + simEuro(d.legati.resto*d.nonAss) : ' · tutto assegnato'));
  }
  /* totali nelle intestazioni delle sezioni richiudibili */
  const sezVal = (k, testo) => { const e = el('sucSezVal_'+k); if(e) e.textContent = testo; };
  sezVal('altri', s.altri.length ? s.altri.length + (s.altri.length===1?' persona':' persone') : 'nessuno');
  sezVal('patr', simEuro(d.comp.liquidita + d.comp.titoli + d.comp.titoliStato + d.comp.partecipazioni + d.comp.crediti));
  sezVal('imm', s.immobili.length ? s.immobili.length + ' · ' + simEuro(d.comp.immobili) : 'nessuno');
  if(s.opzioni.beniMobili) sezVal('bmob', s.beniMobili.length ? s.beniMobili.length + ' · ' + simEuro(d.comp.beniMobili) + (d.beniMobiliEsenti>0 ? ' (esenti ' + simEuro(d.beniMobiliEsenti) + ')' : '') : 'nessuno');
  if(s.opzioni.altriBeni) sezVal('bval', s.altriBeni.length ? s.altriBeni.length + ' · ' + simEuro(d.comp.altriBeni) : 'nessuno');
  sezVal('forf', (d.integrazione>0 ? '+ ' + simEuro(d.integrazione) : (s.inventario ? 'da inventario' : 'coperti')));
  set('sucForfaitEco', s.inventario
    ? (d.integrazione>0 ? `Alla base imponibile si aggiungono <b>${simEuro(d.integrazione)}</b> da inventario` : 'Nessuna presunzione: vale il valore che risulta dall\'inventario')
    : (d.forfaitDichiarato>0
        ? (d.integrazione>0
            ? `Presunzione 10% = ${simEuro(d.presunto)}: i beni di uso personale elencati (${simEuro(d.forfaitDichiarato)}) ne coprono una parte, si integrano <b>${simEuro(d.integrazione)}</b>`
            : `I beni di uso personale elencati (${simEuro(d.forfaitDichiarato)}) superano il 10% presunto (${simEuro(d.presunto)}): vale il valore dichiarato`)
        : (d.presunto>0 ? `Presunzione 10%: <b>+ ${simEuro(d.integrazione)}</b> sulla base imponibile, ripartiti fra gli eredi in proporzione alle quote` : 'Inserisci il patrimonio: qui compare il 10% presunto')));
  sezVal('pol', d.fuori>0 ? simEuro(d.fuori) : 'nessuna');
  if(s.opzioni.passivita) sezVal('pass', '− ' + simEuro(d.passivita));
  if(s.opzioni.disabili){
    const nDis = Object.values(s.disabili).filter(Boolean).length;
    sezVal('dis', nDis ? nDis + (nDis===1?' persona':' persone') : 'nessuno');
  }

  /* hero */
  if(el('sucHeroTag')) el('sucHeroTag').textContent = (perLegge ? 'Senza testamento' : 'Con testamento') + ' · ' + d.nEredi + (d.nEredi===1?' erede':' eredi');
  if(el('sucRisEt')) el('sucRisEt').textContent = 'Totale imposte della successione';
  animaCifra(el('sucRisCifra'), d.impostaTotale, simEuro);
  risBarAggiorna('Totale imposte', simEuro(d.impostaTotale), 'var(--teal-txt)');
  let nota;
  if(d.netto<=0) nota = 'Inserisci il patrimonio nel pannello: qui compaiono quote, imposte e netto agli eredi.';
  else {
    nota = `Su un asse ereditario di <b>${simEuro(d.netto)}</b> le imposte stimate sono <b>${simEuro(d.impostaTotale)}</b>, cioè il <b>${sucPct(d.incidenza)}</b>. `;
    const voltTxt = d.impostaVoltura>0 ? ' e voltura dei veicoli ' + simEuro(d.impostaVoltura) : '';
    if(d.impostaSuccessione<=0 && (d.impostaImmobili>0 || d.impostaVoltura>0)) nota += `L'imposta di successione è <b>zero</b>: ogni erede resta sotto la sua franchigia. Restano ${d.impostaImmobili>0 ? 'ipotecaria e catastale sugli immobili (' + simEuro(d.impostaImmobili) + ')' : ''}${d.impostaImmobili>0 && d.impostaVoltura>0 ? ' e ' : ''}${d.impostaVoltura>0 ? 'la voltura dei veicoli (' + simEuro(d.impostaVoltura) + ')' : ''}. `;
    else if(d.impostaSuccessione<=0) nota += `L'imposta di successione è <b>zero</b>: ogni erede resta sotto la sua franchigia. `;
    else nota += `Imposta di successione <b>${simEuro(d.impostaSuccessione)}</b>${d.impostaImmobili>0 ? ' più ipotecaria e catastale ' + simEuro(d.impostaImmobili) : ''}${voltTxt}. `;
    if(d.beniMobiliEsenti>0) nota += `Auto, moto e camper (${simEuro(d.beniMobiliEsenti)}) sono esenti dall'imposta di successione. `;
    if(d.integrazione>0) nota += s.inventario
      ? `Denaro, gioielli e mobilia da inventario (${simEuro(d.integrazione)}) si aggiungono alla base imponibile. `
      : `Per denaro, gioielli e mobilia il fisco presume un <b>10% in più</b> (${simEuro(d.integrazione)}) sulla base imponibile. `;
    nota += `Agli eredi restano <b>${simEuro(d.nettoEredi)}</b>`;
    if(d.fuori>0) nota += `, più <b>${simEuro(d.fuori)}</b> fuori successione (polizze e previdenza), esenti`;
    nota += '.';
    if(d.legati.totale>0) nota += ` Beni assegnati a persone: <b>${simEuro(d.legati.totale)}</b>, resto da dividere ${simEuro(d.legati.resto)}.`;
    if(d.lesione) nota += ' <b>Attenzione: la legittima è lesa.</b>';
  }
  set('sucRisNota', nota);

  /* avvisi */
  set('sucAvvisi', d.avvisi.map(a=>`<div class="suc-avviso ${a.t}">${a.txt}</div>`).join(''));

  /* chip */
  animaCifra(el('sucChipAsse'), d.netto, simEuro);
  animaCifra(el('sucChipSucc'), d.impostaSuccessione, simEuro);
  animaCifra(el('sucChipImm'), d.impostaImmobili, simEuro);
  if(el('sucChipVoltBox')) el('sucChipVoltBox').style.display = d.impostaVoltura>0 ? '' : 'none';
  animaCifra(el('sucChipVolt'), d.impostaVoltura, simEuro);
  animaCifra(el('sucChipNetto'), d.nettoEredi, simEuro);
  if(el('sucChipFuoriBox')) el('sucChipFuoriBox').style.display = d.fuori>0 ? '' : 'none';
  if(d.fuori>0) animaCifra(el('sucChipFuori'), d.fuori, simEuro);

  /* riepilogo delle percentuali per gruppo, sopra il grafico */
  const gruppi = [
    {eti:'Coniuge',    n:s.coniuge?1:0,    q:g.coniuge,    col:'var(--teal)'},
    {eti:'Figli',      n:s.figli,          q:g.figli,      col:'var(--accento)'},
    {eti:'Ascendenti', n:s.ascendenti,     q:g.ascendenti, col:'var(--viola)'},
    {eti:'Fratelli',   n:s.fratelli,       q:g.fratelli,   col:'var(--arancio)'},
    {eti:'Altri',      n:s.altri.length,   q:g.altri,      col:'var(--muto)'}
  ].filter(x=>x.n>0);
  const nonAssegnato = Math.max(0, 1 - E.reduce((t,e)=>t + e.quota, 0));
  set('sucGruppiBox', gruppi.length ? `
    <div class="uni-comp">${gruppi.filter(x=>x.q>0).map(x=>`<span style="width:${(x.q*100).toFixed(2)}%;background:${x.col}"></span>`).join('')}${nonAssegnato>0.0001?`<span style="width:${(nonAssegnato*100).toFixed(2)}%;background:var(--fill-forte)"></span>`:''}</div>
    <div class="suc-gruppi">${gruppi.map(x=>`<div class="suc-gruppo">
        <span class="pallino" style="background:${x.col}"></span>
        <span class="eti">${x.eti}${x.n>1?' <span class="muto">×'+x.n+'</span>':''}</span>
        <span class="pct">${sucPct(x.q)}</span>
        <span class="imp">${simEuro(x.q*d.netto)}</span>
      </div>`).join('') + (nonAssegnato>0.0001 ? `<div class="suc-gruppo">
        <span class="pallino" style="background:var(--fill-forte)"></span>
        <span class="eti muto">Non assegnato</span>
        <span class="pct">${sucPct(nonAssegnato)}</span>
        <span class="imp">${simEuro(nonAssegnato*d.netto)}</span>
      </div>` : '')}</div>` : '');

  /* quote ereditarie, erede per erede */
  const visibili = E.filter(e=>e.quota>0.000001);
  set('sucQuoteRighe', visibili.length
    ? visibili.map(e=>{
        const fr = sucFrazione(e.quota);
        return `<tr><td>${esc(e.nome)}${e.disabile?' <span class="suc-badge">L. 104</span>':''}
            <div class="suc-sotto">${e.classeBreve}${e.legati>0 ? ' · beni ' + simEuro(e.legati) + ' + resto ' + simEuro(e.dalResto) : ''}</div></td>
          <td>${sucPct(e.quota)}${fr?' <span class="muto">('+fr+')</span>':''}</td>
          <td>${simEuro(e.ricevuto)}</td>
          <td>${e.imposta>0?simEuro(e.imposta):'<span class="conf-diff-muto">esente</span>'}</td>
          <td>${e.altreImposte>0?simEuro(e.altreImposte):'<span class="conf-diff-muto">—</span>'}</td>
          <td><b>${simEuro(e.netto)}</b></td></tr>`;
      }).join('')
      + (nonAssegnato>0.0001 ? `<tr><td class="muto">Quota non assegnata</td><td>${sucPct(nonAssegnato)}</td><td>${simEuro(nonAssegnato*d.netto)}</td><td>—</td><td>—</td><td>—</td></tr>` : '')
      + `<tr class="forte"><td><b>Totale</b></td><td>${sucPct(E.reduce((t,e)=>t+e.quota,0))}</td><td><b>${simEuro(d.netto - nonAssegnato*d.netto)}</b></td><td>${simEuro(d.impostaSuccessione)}</td><td>${simEuro(d.impostaImmobili + d.impostaVoltura)}</td><td><b>${simEuro(d.nettoEredi)}</b></td></tr>`
    : '<tr><td colspan="6" class="muto">Nessun erede indicato</td></tr>');

  /* verifica della legittima */
  set('sucLegEsito', d.haLegittimari
    ? (d.lesione ? '<span style="color:var(--rosso);font-weight:700">Lesa</span>' : '<span style="color:var(--verde-txt);font-weight:700">Rispettata</span>')
    : '');
  const boxL = el('sucLegittimaBox');
  if(boxL){
    if(!d.haLegittimari){
      boxL.innerHTML = `<p class="suc-nota" style="margin-top:0">Non ci sono legittimari (coniuge, figli o, in loro mancanza, ascendenti): il testatore può disporre liberamente dell'intero patrimonio. Fratelli e sorelle non sono legittimari e non hanno una quota riservata.</p>`;
    } else {
      const righe = d.verifiche.map(v=>{
        const sotto = v.persone.filter(p=>p.riserva>0 && d.netto*(p.riserva - p.quota) > 0.5);
        const ok = !v.leso && !sotto.length;
        const dett = v.persone.length>1
          ? '<div class="suc-sotto">' + v.persone.map(p=>`${esc(p.nome)}: ${sucPct(p.quota)} su riserva ${sucPct(p.riserva)}${d.netto*(p.riserva-p.quota)>0.5?' <span style="color:var(--rosso)">sotto</span>':''}`).join(' · ') + '</div>'
          : '';
        const esito = ok ? '<span class="conf-diff-verde">Rispettata</span>'
          : (v.leso ? '<span class="conf-diff-rosso">Lesa di '+simEuro(v.importoMancante)+'</span>'
                    : '<span class="conf-diff-rosso">Lesa per '+sotto.map(p=>esc(p.nome)).join(', ')+'</span>');
        return `<tr${ok?'':' class="forte"'}>
          <td>${v.eti}${dett}</td>
          <td>${sucPct(v.riservato)}${sucFrazione(v.riservato)?' <span class="muto">('+sucFrazione(v.riservato)+')</span>':''} · ${simEuro(v.riservato*d.netto)}</td>
          <td>${sucPct(v.assegnato)} · ${simEuro(v.assegnato*d.netto)}</td>
          <td>${esito}</td></tr>`;
      }).join('');
      boxL.innerHTML = `<div class="conf-scroll">
          <table class="conf-tab suc-tab">
            <thead><tr><th>Legittimario</th><th>Riservato per legge</th><th>Assegnato</th><th>Esito</th></tr></thead>
            <tbody>${righe}
              <tr><td>Quota disponibile</td><td>${sucPct(d.disponibile)}${sucFrazione(d.disponibile)?' <span class="muto">('+sucFrazione(d.disponibile)+')</span>':''} · ${simEuro(d.disponibile*d.netto)}</td><td colspan="2" class="muto">Di cui il testatore può disporre liberamente</td></tr>
            </tbody>
          </table>
        </div>
        <p class="suc-nota">${d.lesione
          ? 'La quota ricevuta da uno o più legittimari è inferiore alla riserva di legge: il testamento è valido ma impugnabile con l\'azione di riduzione entro 10 anni dall\'apertura della successione.'
          : (test
            ? 'La legittima si misura su tutto quello che ciascuno riceve: beni assegnati più quota del resto. Al coniuge spettano inoltre il diritto di abitazione sulla casa familiare e l\'uso dei mobili (art. 540 c.c.), qui non valorizzati.'
            : 'Senza testamento le quote di legge rispettano sempre la legittima. Al coniuge spettano inoltre il diritto di abitazione sulla casa familiare e l\'uso dei mobili che la corredano (art. 540 c.c.), qui non valorizzati.')}</p>`;
    }
  }
  const boxC = el('sucConsigliBox');
  if(boxC) boxC.innerHTML = d.consigli.length
    ? `<div class="suc-consigli"><div class="suc-consigli-tit">Come sistemare</div><ol>${d.consigli.map(c=>`<li>${c}</li>`).join('')}</ol></div>`
    : '';

  /* beni assegnati per testamento */
  const cardLeg = el('sucCardLegati');
  if(cardLeg){
    const mostra = test && d.legati.righe.length>0;
    cardLeg.style.display = mostra ? '' : 'none';
    if(mostra){
      set('sucLegatiTot', `<span class="muto">${simEuro(d.legati.totale)} assegnati · resto ${simEuro(d.legati.resto)}</span>`);
      set('sucLegatiRighe', d.legati.righe.map(r=>`<tr>
          <td><b>${esc(r.nome)}</b><div class="suc-sotto">${r.listaNome}</div></td>
          <td>${esc(r.aNome)}</td>
          <td>${simEuro(r.valore)}</td>
          <td class="muto">${d.netto>0?sucPct(r.valore/d.netto):'—'}</td></tr>`).join('')
        + `<tr class="forte"><td><b>Totale assegnato</b></td><td></td><td><b>${simEuro(d.legati.totale)}</b></td><td class="muto">${d.netto>0?sucPct(d.legati.totale/d.netto):'—'}</td></tr>`);
      set('sucLegatiNota', `Chi riceve un bene lo prende per intero (legato) e ne paga le imposte: per gli immobili assegnati ipotecaria e catastale sono a carico di chi li riceve. Il resto (${simEuro(d.legati.resto)}) si divide secondo le quote del testamento.`);
    }
  }

  /* composizione del patrimonio */
  const tot = d.lordo || 1;
  set('sucComp', SUC_CAT.filter(c=>d.comp[c.k]>0).map(c=>`<span style="width:${(d.comp[c.k]/tot*100).toFixed(2)}%;background:${c.colore}"></span>`).join(''));
  set('sucLeg', SUC_CAT.filter(c=>d.comp[c.k]>0).map(c=>`<div class="r"><span class="pallino" style="background:${c.colore}"></span>${c.nome}<span class="imp">${simEuro(d.comp[c.k])}</span><span class="pct">${(d.comp[c.k]/tot*100).toFixed(0)}%</span></div>`).join('')
    || '<div class="r muto">Nessun bene inserito</div>');
  const righeMassa = d.passivita>0
    ? [['Patrimonio lordo', simEuro(d.lordo), false],
       ['Mutui ancora da pagare', '− ' + simEuro(s.mutui), false],
       ['Altre passività', '− ' + simEuro(s.altrePassivita), false],
       ['Asse ereditario netto', simEuro(d.netto), true]]
    : [['Asse ereditario', simEuro(d.netto), true]];
  const righeFisco = [[d.passivita>0 ? 'Asse ereditario netto' : 'Asse ereditario', simEuro(d.netto), false]];
  if(d.esente>0) righeFisco.push(['Beni esenti (titoli di Stato, auto, partecipazioni)', '− ' + simEuro(d.esente), false]);
  righeFisco.push([s.inventario
      ? 'Denaro, gioielli e mobilia da inventario'
      : (d.forfaitDichiarato>0 && d.integrazione<=0 ? 'Denaro, gioielli e mobilia: i beni elencati superano il 10%' : 'Denaro, gioielli e mobilia presunti al 10%' + (d.forfaitDichiarato>0 ? ' (oltre ai beni elencati)' : '')),
    '+ ' + simEuro(d.integrazione), false]);
  righeFisco.push(["Base imponibile per l'imposta di successione", simEuro(d.imponibileFiscale), true]);
  set('sucMassaBox', `<div class="suc-massa">${righeMassa.map(r=>`<div class="riga-massa${r[2]?' forte':''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>` +
    `<div class="suc-massa"><div class="suc-mini-eti" style="margin:0 0 4px">Per il fisco</div>${righeFisco.map(r=>`<div class="riga-massa${r[2]?' forte':''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>` +
    (d.investito>0 ? `<p class="suc-nota">Sul portafoglio titoli sono stati investiti ${simEuro(d.investito)} e il montante alla data del decesso è ${simEuro(d.comp.titoli + d.comp.titoliStato)}: ${d.plusvalenza>=0 ? 'una plusvalenza latente di ' + simEuro(d.plusvalenza) : 'una minusvalenza di ' + simEuro(-d.plusvalenza)}. Nell'asse ereditario entra il montante.</p>` : ''));

  /* polizze e previdenza: a chi vanno */
  const cardF = el('sucCardFuori');
  if(cardF){
    if(!d.prodottiAttivi.length){ cardF.style.display = 'none'; }
    else {
      cardF.style.display = '';
      set('sucFuoriBox', d.prodottiAttivi.map(p=>{
        const dz = (SUC_DESIGNAZIONI.find(x=>x.k===p.designazione)||{}).nome || '';
        const righe = p.voci.length
          ? p.voci.map(v=>`<tr><td>${esc(v.nome)}</td><td>${sucPct(v.quota)}</td><td><b>${simEuro(v.importo)}</b></td></tr>`).join('')
          : `<tr><td colspan="3" class="muto">Nessun beneficiario determinato</td></tr>`;
        return `<div class="suc-prod-blocco">
          <div class="suc-prod-riga"><span class="suc-prod-nome">${p.nome}</span><span class="suc-badge teal">${dz}</span><b>${simEuro(p.capitale)}</b></div>
          ${p.versato ? `<div class="suc-nota" style="margin:0 0 9px">Capitale versato ${simEuro(p.versatoVal)} · montante ${simEuro(p.capitale)}</div>` : ''}
          <div class="conf-scroll">
            <table class="conf-tab suc-tab suc-tab-stretta">
              <thead><tr><th>Beneficiario</th><th>Quota</th><th>Importo</th></tr></thead>
              <tbody>${righe}</tbody>
            </table>
          </div>
        </div>`;
      }).join('') +
      `<div class="suc-massa"><div class="riga-massa forte"><span>Totale fuori successione</span><b>${simEuro(d.fuori)}</b></div></div>
       <p class="suc-nota">Capitali liquidati ai beneficiari designati per diritto proprio: non concorrono all'asse ereditario, non rilevano per le quote di legittima e sono esenti dall'imposta di successione. Se però la designazione è fatta in frode ai legittimari, i premi versati possono essere aggrediti con l'azione di riduzione.</p>`);
    }
  }

  /* immobili */
  const cardImm = el('sucCardImmobili');
  if(cardImm){
    if(!d.immobili.length){ cardImm.style.display = 'none'; }
    else {
      cardImm.style.display = '';
      set('sucImmobiliRighe', d.immobili.map(i=>`<tr>
          <td><b>${esc(sucEtichettaImmobile(i))}</b>${i.primaCasa?' <span class="suc-badge verde">prima casa</span>':''}
            <div class="suc-sotto">${esc(sucNomeTipoImmobile(i.tipo))}${i.indirizzo?' · '+esc(i.indirizzo):''}${i.a?' · assegnato a '+esc(i.aNome):''}</div></td>
          <td>${simEuro(i.valore)}</td>
          <td>${i.primaCasa ? simEuro2(SUC_FISSA_PRIMA_CASA) : simEuro(i.ipo)}</td>
          <td>${i.primaCasa ? simEuro2(SUC_FISSA_PRIMA_CASA) : simEuro(i.cat)}</td>
          <td><b>${simEuro(i.totale)}</b></td>
        </tr>`).join('') +
        `<tr class="forte"><td><b>Totale</b></td><td><b>${simEuro(d.comp.immobili)}</b></td><td colspan="2"></td><td><b>${simEuro(d.impostaImmobili)}</b></td></tr>`);
    }
  }

  /* beni mobili registrati */
  const cardVei = el('sucCardVeicoli');
  if(cardVei){
    if(!d.veicoli.length){ cardVei.style.display = 'none'; }
    else {
      cardVei.style.display = '';
      set('sucVeicoliRighe', d.veicoli.map(v=>`<tr>
          <td><b>${esc(sucBeneNome('beniMobili', v))}</b>
            <div class="suc-sotto">${esc(v.tipoNome)} · registro ${v.registro==='altro' ? 'competente' : v.registro}${v.a?' · assegnato a '+esc(v.aNome):''}</div></td>
          <td>${simEuro(v.valore)}</td>
          <td>${v.esente ? '<span class="suc-badge verde">esente</span>' : 'imponibile'}</td>
          <td><b>${v.registro==='PRA' ? simEuro2(v.voltura) : simEuro(v.voltura)}</b>${v.registro==='PRA' ? '<div class="suc-sotto">IPT · ' + v.kwUsati + ' kW' + (v.kwStimati ? ' stimati' : '') + '</div>' : ''}</td>
        </tr>`).join('') +
        `<tr class="forte"><td><b>Totale</b></td><td><b>${simEuro(d.comp.beniMobili)}</b></td><td>${d.beniMobiliEsenti>0 ? 'esenti ' + simEuro(d.beniMobiliEsenti) : ''}</td><td><b>${simEuro(d.impostaVoltura)}</b></td></tr>`);
      set('sucVeicoliNota', 'Auto, moto e camper sono esenti da imposta di successione ma soggetti all\'IPT per la voltura al PRA (tariffa base 150,81 € fino a 53 kW, poi 3,5119 €/kW, con la maggiorazione provinciale del 30%). Imbarcazioni, navi e aeromobili concorrono alla base imponibile e pagano la trascrizione nel rispettivo registro: qui un importo medio indicativo. I valori sono stime di mercato alla data del decesso: per una valutazione precisa servono listini ufficiali o un perito.');
    }
  }

  sucDisegnaGrafico(d);
  sucTabella(d);

  /* confronto con lo scenario bloccato */
  confAggiornaSblocca(!!sucScenario);
  const confBox = el('confBox');
  if(confBox){
    if(sucScenario){
      const b = sucScenario;
      const modoTxt = m => m==='legittima' ? 'Senza testamento' : 'Con testamento';
      const righe = [
        {eti:'Tipo di successione', blocco:modoTxt(b.modo), ora:modoTxt(s.modo), diff:confDiffTesto(b.modo, s.modo, 'cambiato')},
        {eti:'Patrimonio lordo', blocco:simEuro(b.lordo||b.netto), ora:simEuro(d.lordo), diff:confDiffNum(b.lordo||b.netto, d.lordo, simEuro)},
        {eti:'Passività', blocco:simEuro(b.passivita||0), ora:simEuro(d.passivita), diff:confDiffNum(b.passivita||0, d.passivita, simEuro, 'giu')},
        {eti:'Asse ereditario netto', blocco:simEuro(b.netto), ora:simEuro(d.netto), diff:confDiffNum(b.netto, d.netto, simEuro)},
        {eti:'Numero di eredi', blocco:String(b.nEredi), ora:String(d.nEredi), diff:confDiffNum(b.nEredi, d.nEredi, v=>String(Math.round(v)))},
        {eti:'Beni assegnati a persone', blocco:simEuro(b.legati||0), ora:simEuro(d.legati.totale), diff:confDiffNum(b.legati||0, d.legati.totale, simEuro)},
        {eti:'Denaro, gioielli e mobilia (fisco)', blocco:simEuro(b.integrazione||0), ora:simEuro(d.integrazione), diff:confDiffNum(b.integrazione||0, d.integrazione, simEuro, 'giu')},
        {eti:'Imposta di successione', blocco:simEuro(b.impostaSuccessione), ora:simEuro(d.impostaSuccessione), diff:confDiffNum(b.impostaSuccessione, d.impostaSuccessione, simEuro, 'giu')},
        {eti:'Ipotecaria e catastale', blocco:simEuro(b.impostaImmobili), ora:simEuro(d.impostaImmobili), diff:confDiffNum(b.impostaImmobili, d.impostaImmobili, simEuro, 'giu')},
        {eti:'Voltura veicoli (IPT)', blocco:simEuro(b.impostaVoltura||0), ora:simEuro(d.impostaVoltura), diff:confDiffNum(b.impostaVoltura||0, d.impostaVoltura, simEuro, 'giu')},
        {eti:'Polizze e previdenza', blocco:simEuro(b.fuori||0), ora:simEuro(d.fuori), diff:confDiffNum(b.fuori||0, d.fuori, simEuro, 'su')},
        {eti:'Legittima', blocco:b.lesione?'Lesa':'Rispettata', ora:d.lesione?'Lesa':'Rispettata', diff:confDiffTesto(b.lesione, d.lesione, 'cambiata')},
        {eti:'Totale imposte', forte:true, blocco:simEuro(b.impostaTotale), ora:simEuro(d.impostaTotale), diff:confDiffNum(b.impostaTotale, d.impostaTotale, simEuro, 'giu')},
        {eti:'Netto agli eredi', forte:true, blocco:simEuro(b.nettoEredi), ora:simEuro(d.nettoEredi), diff:confDiffNum(b.nettoEredi, d.nettoEredi, simEuro, 'su')}
      ];
      confBox.innerHTML = confCardHtml('successione', righe);
    } else confBox.innerHTML = '';
  }
}

/* Grafico a barre: per ogni erede il valore ricevuto, con la parte di imposte in rosso */
function sucDisegnaGrafico(d){
  const W=760, H=330, padL=76, padR=16, padT=26, padB=42;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const dati = d.eredi.filter(e=>e.ricevuto>0);
  if(!dati.length){
    document.getElementById('sucChart').innerHTML =
      `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="15" fill="var(--muto)">Nessuna quota da rappresentare</text>`;
    return;
  }
  const maxVal = Math.max(...dati.map(e=>e.ricevuto))*1.14 || 1;
  const passo = simPassoBello(maxVal/5);
  const yTicks = [];
  for(let v=0; v<=maxVal; v+=passo) yTicks.push(v);
  if(yTicks[yTicks.length-1] < maxVal) yTicks.push(yTicks[yTicks.length-1] + passo);
  const yMax = yTicks[yTicks.length-1] || 1;
  const yPerV = v => padT + (1 - v/yMax)*innerH;
  let svg = '';
  yTicks.forEach(v=>{
    const y = yPerV(v).toFixed(1);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bordo)" stroke-width="1"/>`;
    svg += `<text x="${padL-10}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="13" fill="var(--muto)">€ ${simCompatto(v)}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  const n = dati.length, slot = innerW/n, barW = Math.min(70, slot*0.62), etichette = n<=9;
  dati.forEach((e,idx)=>{
    const x = padL + slot*idx + (slot-barW)/2;
    const yTop = yPerV(e.ricevuto), yImposta = yPerV(Math.max(0, e.netto));
    const hNetto = Math.max(1, (H-padB) - yImposta), hImposta = Math.max(0, yImposta - yTop);
    svg += `<rect x="${x.toFixed(1)}" y="${yImposta.toFixed(1)}" width="${barW.toFixed(1)}" height="${hNetto.toFixed(1)}" rx="6" fill="var(--teal)" opacity="0.92"/>`;
    if(hImposta > 0.8) svg += `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${hImposta.toFixed(1)}" rx="4" fill="var(--rosso)" opacity="0.9"/>`;
    if(etichette) svg += `<text x="${(x+barW/2).toFixed(1)}" y="${(yTop-8).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="650" fill="var(--muto)">€ ${simCompatto(e.ricevuto)}</text>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-24}" text-anchor="middle" font-size="12.5" fill="var(--muto)">${esc(n>6 ? e.breve : e.nome)}</text>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--testo-3)">${sucPct(e.quota)}</text>`;
  });
  document.getElementById('sucChart').innerHTML = svg;
}

function sucTabella(d){
  if(tabellaRimandata(d, sucTabella)) return;
  const corpo = document.getElementById('sucTabRighe'); if(!corpo) return;
  const righe = d.eredi.filter(e=>e.quota>0.000001);
  corpo.innerHTML = righe.length ? righe.map(e=>`<tr>
      <td>${esc(e.nome)}${e.disabile?' <span class="suc-badge">L. 104</span>':''}</td>
      <td>${e.classeBreve}</td>
      <td>${sucPct(e.quota)}</td>
      <td>${simEuro(e.ricevuto)}</td>
      <td>${simEuro(e.parteEsente)}</td>
      <td>${e.presuntoQuota>0 ? '+ ' + simEuro(e.presuntoQuota) : '—'}</td>
      <td>${simEuro(e.franchigia)}</td>
      <td>${simEuro(e.base)}</td>
      <td>${sucPct(e.aliquota)}</td>

    </tr>`).join('') + `<tr><td><b>Totale</b></td><td colspan="8"></td><td><b>${simEuro(d.impostaSuccessione)}</b></td></tr>`
   : '<tr><td colspan="10" class="muto">Nessun beneficiario</td></tr>';
}

/* Riporta uno stato salvato (anche in formato precedente) alla struttura corrente. */
function sucNormalizzaStato(d){
  d = d || {};
  const prodotto = (vecchioImporto, nuovo, versato) => {
    if(nuovo && typeof nuovo==='object'){
      return {attiva:!!nuovo.attiva, capitale:sucPos(nuovo.capitale), versato:sucPos(nuovo.versato),
        designazione: SUC_DESIGNAZIONI.some(x=>x.k===nuovo.designazione) ? nuovo.designazione : 'legittimi',
        beneficiari:(nuovo.beneficiari||[]).map(b=>({id:b.id||('b'+nuovoId()), nome:b.nome||'', quota:sucPos(b.quota)}))};
    }
    const imp = sucPos(vecchioImporto);
    return {attiva:imp>0, capitale:imp, versato:sucPos(versato), designazione:'legittimi', beneficiari:[]};
  };
  /* beni a elenco: fino alla v94 «beni mobili» e «altri beni» erano un solo importo */
  const listaBeni = (k) => {
    const L = sucLista(k), v = d[k];
    if(Array.isArray(v)) return v.map(b=>{
      const tipo = L.tipi.some(t=>t.k===b.tipo) ? b.tipo : 'altro';
      const out = {id:b.id||('bn'+nuovoId()), tipo, nota:String(b.nota||''), valore:sucPos(b.valore), kw: sucPos(b.kw)>0 ? sucPos(b.kw) : null, a: typeof b.a==='string' ? b.a : ''};
      if(k==='altriBeni') out.forfait = typeof b.forfait==='boolean' ? b.forfait : !!sucTipoValore(tipo).forfait;
      return out;
    });
    if(sucPos(v) > 0) return [{id:'bn'+nuovoId(), tipo:'altro', nota:'', valore:sucPos(v), a:''}];
    return [];
  };
  const beniMobili = listaBeni('beniMobili'), altriBeni = listaBeni('altriBeni');
  /* «altri eredi»: fino alla v94 avevano la classe fiscale, ora il rapporto con il defunto */
  const altri = (d.altri||[]).map(a=>{
    let rapporto = SUC_RAPPORTI.some(r=>r.k===a.rapporto) ? a.rapporto : null;
    if(!rapporto){
      const cl = a.classe || 'altri';
      rapporto = cl==='retta' ? 'nipoteRetta' : (cl==='fratelli' ? 'fratello' : (cl==='parenti4' ? 'parente' : 'amico'));
    }
    return {id:a.id||('al'+nuovoId()), nome:a.nome||'', rapporto};
  });
  return {
    liquidita:sucPos(d.liquidita),
    titoliInvestito:sucPos(d.titoliInvestito), titoli:sucPos(d.titoli),
    titoliStatoInvestito:sucPos(d.titoliStatoInvestito), titoliStato:sucPos(d.titoliStato),
    partecipazioni:sucPos(d.partecipazioni), partEsenti:!!d.partEsenti,
    crediti:sucPos(d.crediti),
    mutui:sucPos(d.mutui != null ? d.mutui : d.debiti), altrePassivita:sucPos(d.altrePassivita),
    inventario:!!d.inventario, inventarioValore:sucPos(d.inventarioValore),
    opzioni:{
      beniMobili: d.opzioni ? (!!d.opzioni.beniMobili || beniMobili.length>0) : beniMobili.length>0,
      altriBeni:  d.opzioni ? (!!d.opzioni.altriBeni  || altriBeni.length>0)  : altriBeni.length>0,
      passivita:  d.opzioni ? !!d.opzioni.passivita  : ((sucPos(d.mutui)+sucPos(d.altrePassivita)+sucPos(d.debiti))>0),
      disabili:   d.opzioni ? !!d.opzioni.disabili   : Object.values(d.disabili||{}).some(Boolean)
    },
    immobili:(d.immobili||[]).map(i=>({id:i.id||('im'+nuovoId()), tipo: SUC_TIPI_IMMOBILE.some(t=>t.k===i.tipo)?i.tipo:'appartamento',
      nome:i.nome||'', indirizzo:i.indirizzo||'', valore:sucPos(i.valore), primaCasa:!!i.primaCasa,
      a: typeof i.a==='string' ? i.a : ''})),
    beniMobili, altriBeni,
    polizza:    prodotto(d.polizze, d.polizza),
    tcm:        prodotto(0, d.tcm),
    previdenza: prodotto(d.fondoPensione, d.previdenza),
    coniuge:!!d.coniuge, figli:Number(d.figli)||0, ascendenti:Number(d.ascendenti)||0, fratelli:Number(d.fratelli)||0,
    altri, disabili:{...(d.disabili||{})},
    modo:d.modo==='testamentaria' ? 'testamentaria' : 'legittima', quote:{...(d.quote||{})}
  };
}
</script>
