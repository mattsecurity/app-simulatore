function mutLeggiInput(){
  const v = id => document.getElementById(id);
  if(v('mutImporto')) mutStato.importo = Math.max(0, numIT(v('mutImporto').value) || 0);
  if(v('mutTasso')) mutStato.tasso = Math.max(0, parseFloat(v('mutTasso').value) || 0);
  if(v('mutAnni')) mutStato.anni = parseInt(v('mutAnni').value, 10) || 10;
  if(v('mutInizio')) mutStato.inizio = v('mutInizio').value || '';
}
function mutCambiaFreq(k){
  mutStato.freq = k;
  pillAttiva('mutFreq', v=>Number(v)===k);
  mutAggiorna();
}
function mutBloccaScenario(){
  const d = mutCalcola(), s = mutStato;
  mutScenario = { stato:{...mutStato}, rata:d.rata, interessi:d.totaleInteressi, totale:d.totaleRimborso, freq:s.freq,
    testo:`${simEuro(s.importo)} · ${simPct(s.tasso)}% · ${simAnniTesto(s.anni)} · ${SIM_FREQ_NOMI[s.freq].toLowerCase()}` };
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('mutuo');
  mutAggiorna();
  toast('Scenario bloccato: muovi i parametri per confrontare');
}
function mutTogliScenario(){
  mutScenario = null;
  const r = document.getElementById('simScenarioRiga'); if(r) r.innerHTML = simScenarioHtml('mutuo');
  mutAggiorna();
}
function mutRata(P, i, N){ if(N<=0) return 0; return i===0 ? P/N : P*i/(1-Math.pow(1+i, -N)); }
function mutCalcola(){ const s = mutStato; return mutPiano(s.importo, s.tasso, s.anni, s.freq); }
/* Piano di ammortamento con numeri passati da fuori: serve anche alle simulazioni salvate,
   che si ricalcolano "a oggi" quando le riapri. */
function mutPiano(importo, tassoPct, durataAnni, freq){
  const P = Math.max(0, importo||0), k = freq||12, n = Math.max(0, durataAnni||0), i = ((tassoPct||0)/100)/k, N = n*k;
  const rata = Math.round(mutRata(P, i, N) * 100) / 100;   // rata arrotondata al centesimo, come nelle rate reali
  let saldo = P;
  const periodi = [{t:0, saldo:P}], pag = [];
  for(let p=1; p<=N; p++){
    const interesse = saldo*i;
    let quota = rata - interesse;
    if(p===N) quota = saldo;                 // l'ultima rata azzera il residuo (arrotondamenti)
    saldo = Math.max(0, saldo - quota);
    pag.push({interesse, quota, saldo});
    periodi.push({t:p/k, saldo});
  }
  const anni = [];
  for(let y=1; y<=n; y++){
    const from = (y-1)*k, to = y*k;
    let inter = 0, cap = 0;
    for(let p=from+1; p<=to; p++){ inter += pag[p-1].interesse; cap += pag[p-1].quota; }
    anni.push({y, inizio:periodi[from].saldo, fine:periodi[to].saldo, interessi:inter, capitale:cap, rate:inter+cap});
  }
  const totaleInteressi = anni.reduce((a,b)=>a+b.interessi, 0);
  return {importo:P, k, n, i, N, rata, periodi, pag, anni, totaleInteressi, totaleRimborso:P+totaleInteressi};
}
/* ---- Mutuo già partito: a che punto sei oggi ----
   La data di partenza è l'erogazione: la prima rata si paga un periodo dopo, quindi le rate
   pagate sono i periodi interi trascorsi. "Da pagare" = somma delle rate future; "residuo" =
   capitale ancora da restituire se estingui oggi (due numeri diversi). */
function mutAggiungiMesi(d0, mesi){
  const d = new Date(d0.getFullYear(), d0.getMonth() + Math.round(mesi), 1);
  const ultimo = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(d0.getDate(), ultimo));       // 31 gennaio + 1 mese = 28/29 febbraio
  return d;
}
function mutMesiTrascorsi(d0, d1){
  let mesi = (d1.getFullYear()-d0.getFullYear())*12 + (d1.getMonth()-d0.getMonth());
  if(mutAggiungiMesi(d0, mesi) > d1) mesi -= 1;    // stessa regola di fine mese usata per le scadenze
  return mesi;
}
function mutDataTesto(d){ return d instanceof Date && !isNaN(d) ? d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'; }
/* Riepilogo a oggi. Torna null se non c'è (o non è valida) la data di partenza. */
function mutAdOggi(d, inizioISO, oggi){
  if(!inizioISO) return null;
  const d0 = new Date(inizioISO + 'T00:00:00');
  if(isNaN(d0)) return null;
  const oggiD = oggi || new Date();
  const mesiPeriodo = 12 / d.k;
  const mesi = mutMesiTrascorsi(d0, oggiD);
  const pagate = Math.max(0, Math.min(d.N, Math.floor(Math.max(0, mesi) / mesiPeriodo)));
  let interessiPagati = 0, capitalePagato = 0;
  for(let x=0; x<pagate; x++){ interessiPagati += d.pag[x].interesse; capitalePagato += d.pag[x].quota; }
  const pagato = interessiPagati + capitalePagato;
  const residuo = d.periodi[pagate] ? d.periodi[pagate].saldo : 0;
  return {
    inizio: d0,
    futuro: mesi < 0,                                 // parte più avanti: non è ancora iniziato
    finito: pagate >= d.N && d.N > 0,
    pagate, restanti: Math.max(0, d.N - pagate),
    interessiPagati, capitalePagato, pagato,
    residuo,                                          // capitale ancora da restituire (estinzione)
    daPagare: Math.max(0, d.totaleRimborso - pagato), // somma delle rate che mancano
    interessiRestanti: Math.max(0, d.totaleInteressi - interessiPagati),
    fine: mutAggiungiMesi(d0, d.N * mesiPeriodo),
    prossima: pagate < d.N ? mutAggiungiMesi(d0, (pagate+1) * mesiPeriodo) : null,
    pct: d.N ? pagate/d.N*100 : 0
  };
}
/* Riquadro "A che punto sei oggi": compare solo se è stata inserita la data di partenza. */
function mutRiquadroOggi(d){
  const box = document.getElementById('mutOggiBox'); if(!box) return;
  const o = mutAdOggi(d, mutStato.inizio);
  if(!o){ box.style.display = 'none'; return; }
  box.style.display = '';
  const el = id => document.getElementById(id);
  const ogni = mutStato.freq===1 ? "all'anno" : 'al ' + SIM_FREQ_PAROLA[mutStato.freq];
  let nota;
  if(o.futuro) nota = `Questo mutuo parte il <b>${mutDataTesto(o.inizio)}</b>: a oggi non hai ancora pagato nessuna rata. L'ultima sarà il <b>${mutDataTesto(o.fine)}</b>.`;
  else if(o.finito) nota = `Mutuo partito il <b>${mutDataTesto(o.inizio)}</b> e già finito: l'ultima rata era il <b>${mutDataTesto(o.fine)}</b>. Non resta più niente da pagare.`;
  else nota = `Partito il <b>${mutDataTesto(o.inizio)}</b>: a oggi hai pagato <b>${o.pagate}</b> rate su ${d.N} e te ne restano <b>${o.restanti}</b> da ${simEuro2(d.rata)} ${ogni}, cioè <b>${simEuro(o.daPagare)}</b> in tutto (di cui ${simEuro(o.interessiRestanti)} di interessi). Se lo estinguessi oggi, il capitale ancora da restituire sarebbe <b>${simEuro(o.residuo)}</b>. Ultima rata il <b>${mutDataTesto(o.fine)}</b>.`;
  el('mutOggiNota').innerHTML = nota;
  el('mutOggiBarra').innerHTML =
      `<span style="width:${o.pct.toFixed(2)}%;background:var(--accento)"></span>`
    + `<span style="width:${(100-o.pct).toFixed(2)}%;background:var(--arancio)"></span>`;
  const leg = el('mutOggiLeg');
  if(leg) leg.innerHTML =
      `<div class="r"><span class="pallino" style="background:var(--accento)"></span>Rate pagate<span class="imp">${o.pagate}</span><span class="pct">${o.pct.toFixed(0)}%</span></div>`
    + `<div class="r"><span class="pallino" style="background:var(--arancio)"></span>Rate da pagare<span class="imp">${o.restanti}</span><span class="pct">${(100-o.pct).toFixed(0)}%</span></div>`;
  el('mutOggiDaPagare').textContent = simEuro(o.daPagare);
  el('mutOggiResiduo').textContent = simEuro(o.residuo);
  el('mutOggiRate').textContent = `${o.pagate} su ${d.N}`;
  el('mutOggiPagato').textContent = simEuro(o.pagato);
  el('mutOggiInteressi').textContent = simEuro(o.interessiPagati);
  el('mutOggiFine').textContent = mutDataTesto(o.fine);
}
function mutAggiorna(){
  if(simPagina!=='mutuo' || !document.getElementById('mutImporto')) return;
  const s = mutStato, d = mutCalcola(), el = id => document.getElementById(id);
  el('mutAnniVal').textContent = simAnniTesto(s.anni);
  const impEco = el('mutImportoEco'); if(impEco) impEco.textContent = '';
  el('mutHeroTag').textContent = simAnniTesto(s.anni) + ' · ' + SIM_FREQ_NOMI[s.freq];
  el('mutRisEt').textContent = 'Rata ' + MUT_FREQ_AGG[s.freq];
  animaCifra(el('mutRisCifra'), d.rata, simEuro2);
  risBarAggiorna('Rata ' + MUT_FREQ_AGG[s.freq], simEuro2(d.rata), 'var(--arancio-txt)');
  const ogni = s.freq===1 ? 'ogni anno' : 'ogni ' + SIM_FREQ_PAROLA[s.freq];
  el('mutRisNota').innerHTML = `Per un mutuo di <b>${simEuro(s.importo)}</b> al <b>${simPct(s.tasso)}%</b> annuo (TAN) in <b>${simAnniTesto(s.anni)}</b> paghi <b>${simEuro2(d.rata)}</b> ${ogni}. In tutto restituisci <b>${simEuro(d.totaleRimborso)}</b>, di cui <b>${simEuro(d.totaleInteressi)}</b> di interessi.`;
  animaCifra(el('mutChipImporto'), s.importo, simEuro);
  animaCifra(el('mutChipInteressi'), d.totaleInteressi, simEuro);
  animaCifra(el('mutChipTotale'), d.totaleRimborso, simEuro);
  mutRiquadroOggi(d);
  // confronto per durata: finestra di 5 durate a passi di 5 anni centrata su quella scelta (che può essere qualsiasi)
  let anniConf = [-10,-5,0,5,10].map(o=>s.anni+o).filter(a=>a>=5 && a<=40);
  while(anniConf.length<5){
    const mn = anniConf[0], mx = anniConf[anniConf.length-1];
    if(mx+5<=40) anniConf.push(mx+5); else anniConf.unshift(mn-5);
  }
  const durate = anniConf.map(dd=>{
    const pp = mutPiano(s.importo, s.tasso, dd, s.freq);   // stesso arrotondamento dei riquadri
    return {anni:dd, rata:pp.rata, interessi:pp.totaleInteressi, sel:dd===s.anni};
  });
  // confronto con lo scenario bloccato: tabella Bloccato / Adesso / Differenza
  confAggiornaSblocca(!!mutScenario);
  const confBox = document.getElementById('confBox');
  if(confBox){
    if(mutScenario && mutScenario.stato){
      const b = mutScenario, bs = b.stato;
      const stessaFreq = bs.freq === s.freq;
      const righe = [
        {eti:'Importo del mutuo', blocco:simEuro(bs.importo), ora:simEuro(s.importo), diff:confDiffNum(bs.importo, s.importo, simEuro)},
        {eti:'Tasso annuo (TAN)', blocco:confPct(bs.tasso), ora:confPct(s.tasso), diff:confDiffNum(bs.tasso, s.tasso, confPct)},
        {eti:'Durata', blocco:simAnniTesto(bs.anni), ora:simAnniTesto(s.anni), diff:confDiffNum(bs.anni, s.anni, v=>simAnniTesto(Math.round(v)))},
        {eti:'Frequenza pagamenti', blocco:SIM_FREQ_NOMI[bs.freq], ora:SIM_FREQ_NOMI[s.freq], diff:confDiffTesto(bs.freq, s.freq, 'cambiata')},
        {eti: stessaFreq ? 'Rata ' + MUT_FREQ_AGG[s.freq] : 'Rata', forte:true, blocco:simEuro2(b.rata), ora:simEuro2(d.rata),
          diff: stessaFreq ? confDiffNum(b.rata, d.rata, simEuro2, 'giu') : confNonConfrontabile('frequenze diverse')},
        {eti:'Totale interessi', blocco:simEuro(b.interessi), ora:simEuro(d.totaleInteressi), diff:confDiffNum(b.interessi, d.totaleInteressi, simEuro, 'giu')},
        {eti:'Totale da restituire', blocco:simEuro(b.totale), ora:simEuro(d.totaleRimborso), diff:confDiffNum(b.totale, d.totaleRimborso, simEuro, 'giu')}
      ];
      confBox.innerHTML = confCardHtml('mutuo', righe);
    } else confBox.innerHTML = '';
  }
  const thd = durate.map(x=>`<th class="${x.sel?'sel':''}">${x.anni} anni</th>`).join('');
  const rRata = durate.map(x=>`<td class="${x.sel?'sel':''}">${simEuro2(x.rata)}</td>`).join('');
  const rInt = durate.map(x=>`<td class="${x.sel?'sel':''}">${simEuro(x.interessi)}</td>`).join('');
  el('mutConf').innerHTML = `<table class="mut-conf"><thead><tr><th>Durata</th>${thd}</tr></thead><tbody><tr><td>Rata ${MUT_FREQ_AGG[s.freq]}</td>${rRata}</tr><tr><td>Interessi totali</td>${rInt}</tr></tbody></table>`;
  mutDisegnaBarre(durate);
  // composizione capitale / interessi
  const tot = d.totaleRimborso || 1;
  el('mutComp').innerHTML = `<span style="width:${(d.importo/tot*100).toFixed(2)}%;background:var(--accento)"></span><span style="width:${(d.totaleInteressi/tot*100).toFixed(2)}%;background:var(--arancio)"></span>`;
  el('mutLeg').innerHTML =
    `<div class="r"><span class="pallino" style="background:var(--accento)"></span>Capitale (importo)<span class="imp">${simEuro(d.importo)}</span><span class="pct">${(d.importo/tot*100).toFixed(0)}%</span></div>`
  + `<div class="r"><span class="pallino" style="background:var(--arancio)"></span>Interessi<span class="imp">${simEuro(d.totaleInteressi)}</span><span class="pct">${(d.totaleInteressi/tot*100).toFixed(0)}%</span></div>`;
  mutTabella(d);
}
function mutDisegnaBarre(durate){
  const svgEl = document.getElementById('mutBarre'); if(!svgEl) return;
  const W=760, H=300, padL=70, padR=16, padT=24, padB=38;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const maxVal = Math.max(...durate.map(x=>x.rata))*1.16 || 1;
  const passo = simPassoBello(maxVal/5);
  const yTicks = [];
  for(let v=0; v<=maxVal; v+=passo) yTicks.push(v);
  if(yTicks[yTicks.length-1] < maxVal) yTicks.push(yTicks[yTicks.length-1] + passo);
  const yMax = yTicks[yTicks.length-1] || 1;
  const yPerV = v => padT + (1 - v/yMax)*innerH;
  let svg = '';
  yTicks.forEach(v=>{
    const y = yPerV(v).toFixed(1);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bordo)" stroke-width="1"/>`;
    svg += `<text x="${padL-10}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="13" fill="var(--muto)">€ ${simCompatto(v)}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  const n = durate.length, slot = innerW/n, barW = Math.min(70, slot*0.6);
  durate.forEach((x,idx)=>{
    const px = padL + slot*idx + (slot-barW)/2, y = yPerV(x.rata);
    svg += `<rect x="${px.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1, H-padB-y).toFixed(1)}" rx="6" fill="var(--arancio)" opacity="${x.sel?'0.95':'0.4'}"/>`;
    svg += `<text x="${(px+barW/2).toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="${x.sel?'700':'600'}" fill="${x.sel?'var(--arancio-txt)':'var(--muto)'}">${simEuro(x.rata)}</text>`;
    svg += `<text x="${(px+barW/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="12.5" font-weight="${x.sel?'700':'400'}" fill="var(--muto)">${x.anni} anni</text>`;
  });
  svgEl.innerHTML = svg;
}

/* ---------- SALVA / RIAPRI LE SIMULAZIONI (localStorage) ---------- */
function fotografiaSimulazione(tipo){
  if(tipo==='accumulo'){
    const s = simStato, d = simCalcola();
    const finale = d.periodi.length ? d.periodi[d.periodi.length-1].saldo : 0;
    return {tipo, dati:{ modo:s.modo, freq:s.freq, capitale:s.capitale, obiettivo:s.obiettivo, anni:s.anni, tasso:s.tasso, rata:s.rata, fiscale:s.fiscale, inflazione:s.inflazione,
      risultato: s.modo==='pic' ? d.extra : (s.modo==='pac' ? d.rata : finale), extra:d.extra, finale, v2:true,
      versato: s.modo==='pic' ? 0 : d.rata*(d.periodi.length-1) }};
  }
  if(tipo==='universita'){
    const s = uniStato, d = uniCalcola();
    return {tipo, dati:{ studente:s.studente, tipoAteneo:s.tipoAteneo, isee:s.isee, retta:s.retta,
      indirizzo:s.indirizzo, corso:s.corso, fuoriCorso:s.fuoriCorso, anniMancanti:s.anniMancanti,
      sistemazione:s.sistemazione, citta:s.citta, vitto:s.vitto, km:s.km, mezzo:s.mezzo, inflazione:s.inflazione,
      totale:d.totale, totaleOggi:d.totaleOggi, annuoOggi:d.annuoOggi, anniTot:d.anniTot, tasseAnno:d.tasseAnno }};
  }
  if(tipo==='successione'){
    const s = sucStato, d = sucCalcola();
    return {tipo, dati:{ ...JSON.parse(JSON.stringify(s)),
      lordo:d.lordo, passivita:d.passivita, netto:d.netto,
      integrazione:d.integrazione, presunto:d.presunto, forfaitDichiarato:d.forfaitDichiarato, imponibileFiscale:d.imponibileFiscale,
      impostaSuccessione:d.impostaSuccessione, impostaImmobili:d.impostaImmobili, impostaVoltura:d.impostaVoltura,
      beniMobiliEsenti:d.beniMobiliEsenti, veicoli:d.veicoli.map(v=>({nome:sucBeneNome('beniMobili', v), tipo:v.tipoNome, valore:v.valore, esente:v.esente, voltura:v.voltura, a:v.aNome})),
      impostaTotale:d.impostaTotale, nettoEredi:d.nettoEredi, nEredi:d.nEredi, lesione:d.lesione,
      fuori:d.fuori, immobiliTot:d.immobiliTot, legatiTot:d.legati.totale, legatiResto:d.legati.resto,
      legatiRighe:d.legati.righe.map(r=>({nome:r.nome, categoria:r.listaNome, a:r.aNome, valore:r.valore})),
      eredi:d.eredi.filter(e=>e.quota>0.000001).map(e=>({nome:e.nome, quota:e.quota, ricevuto:e.ricevuto,
        imposta:e.imposta, ipocat:e.ipocatQuota, voltura:e.volturaQuota, netto:e.netto, legati:e.legati})),
      fuoriDettaglio:d.prodottiAttivi.map(p=>({nome:p.nome, capitale:p.capitale,
        voci:p.voci.map(v=>({nome:v.nome, quota:v.quota, importo:v.importo}))})) }};
  }
  if(tipo==='mutuo'){
    const s = mutStato, d = mutCalcola();
    return {tipo, dati:{ importo:s.importo, tasso:s.tasso, anni:s.anni, freq:s.freq, inizio:s.inizio||'',
      rata:d.rata, totaleInteressi:d.totaleInteressi, totaleRimborso:d.totaleRimborso }};
  }
  const s = decStato, d = decCalcola();
  return {tipo, dati:{ modo:s.modo, freq:s.freq, capitale:s.capitale, tasso:s.tasso, fiscale:s.fiscale,
    anni: s.modo==='orizzonte' ? s.anni : null,
    necessita: s.modo==='necessita' ? s.necessita : null,
    prelievoAnnuo:d.prelievoAnnuo, prelievoPeriodo:d.prelievoP, durataPeriodi:d.nPeriodi,
    perpetuo:d.perpetuo, oltre:d.oltre, totPrelevato:d.totPrelevato, interessi:d.interessi, saldoFinale:d.saldoFinale }};
}
/* Riassunto testuale della simulazione corrente (per condivisione e stampa) */
function testoRiepilogo(tipo){
  const f = fotografiaSimulazione(tipo), d = f.dati, righe = [];
  if(tipo==='accumulo'){
    righe.push('Simulazione Accumulo');
    if(d.modo==='pic'){
      righe.push(`Investimento unico oggi: ${simEuro(d.capitale + d.extra)} al ${simPct(d.tasso)}% annuo per ${simAnniTesto(d.anni)}`);
      righe.push(`Obiettivo: ${simEuro(d.obiettivo)} — capitale finale previsto: ${simEuro(d.finale)}`);
    } else {
      righe.push(`Versamento ${(SIM_FREQ_NOMI[d.freq]||'').toLowerCase()}: ${simEuro(d.modo==='pac' ? d.risultato : d.rata)} · capitale iniziale ${simEuro(d.capitale)} · ${simPct(d.tasso)}% annuo · ${simAnniTesto(d.anni)}`);
      if(d.obiettivo>0) righe.push(`Obiettivo: ${simEuro(d.obiettivo)}`);
      righe.push(`Totale versato: ${simEuro(d.capitale + d.versato)} (capitale iniziale ${simEuro(d.capitale)} + versamenti ${simEuro(d.versato)}) — capitale finale previsto: ${simEuro(d.finale)}`);
    }
    if(d.fiscale && d.fiscale!=='lordo') righe.push(`Regime fiscale considerato: ${FISC_NOMI[d.fiscale]}`);
  } else if(tipo==='decumulo'){
    righe.push('Simulazione Decumulo');
    righe.push(`Capitale esistente: ${simEuro(d.capitale)} al ${simPct(d.tasso)}% annuo, prelievi ${(SIM_FREQ_NOMI[d.freq]||'').toLowerCase()}`);
    if(d.modo==='orizzonte') righe.push(`Prelievo possibile: ${simEuro(d.prelievoAnnuo)} all'anno per ${simAnniTesto(d.anni)}`);
    else righe.push(`Necessità: ${simEuro(d.necessita)} all'anno — il capitale dura ${d.perpetuo ? 'per sempre' : (d.oltre ? 'oltre 100 anni' : decDurataTesto(d.durataPeriodi, d.freq))}`);
    righe.push(`Totale prelevato: ${simEuro(d.totPrelevato)} · interessi maturati: ${simEuro(d.interessi)}`);
  } else if(tipo==='universita'){
    righe.push('Simulazione Spese Universitarie' + (d.studente ? ' — ' + d.studente : ''));
    righe.push(`${uniNomeCorso(d.corso)}${d.fuoriCorso ? ' + ' + simAnniTesto(d.fuoriCorso) + ' fuori corso' : ''}, inizio ${d.anniMancanti===0 ? 'immediato' : 'tra ' + simAnniTesto(d.anniMancanti)}`);
    righe.push(`Costo annuo ai prezzi di oggi: ${simEuro(d.annuoOggi)} — spesa totale stimata (costi rivalutati al ${simPct(d.inflazione)}% annuo): ${simEuro(d.totale)}`);
  } else if(tipo==='successione'){
    righe.push('Simulazione Successione ereditaria');
    righe.push(`${d.modo==='legittima' ? 'Successione legittima (senza testamento)' : 'Successione testamentaria'} — ${d.nEredi} ${d.nEredi===1?'erede':'eredi'}`);
    righe.push(d.passivita>0
      ? `Patrimonio lordo: ${simEuro(d.lordo)} − passività ${simEuro(d.passivita)} = asse ereditario netto ${simEuro(d.netto)}`
      : `Asse ereditario: ${simEuro(d.netto)}`);
    if((d.integrazione||0)>0) righe.push(d.inventario
      ? `Denaro, gioielli e mobilia da inventario analitico: +${simEuro(d.integrazione)} sulla base imponibile (${simEuro(d.imponibileFiscale)})`
      : `Denaro, gioielli e mobilia presunti al 10% (art. 9 D.Lgs. 346/1990): +${simEuro(d.integrazione)} sulla base imponibile (${simEuro(d.imponibileFiscale)})`);
    if((d.legatiRighe||[]).length){
      righe.push(`Beni assegnati per testamento: ${simEuro(d.legatiTot||0)} — resto da dividere per quote ${simEuro(d.legatiResto||0)}`);
      (d.legatiRighe||[]).forEach(r=> righe.push(`  · ${r.nome} → ${r.a}: ${simEuro(r.valore)}`));
    }
    (d.eredi||[]).forEach(e=> righe.push(`  · ${e.nome}: ${sucPct(e.quota)} = ${simEuro(e.ricevuto)}${e.legati>0 ? ' (di cui beni assegnati '+simEuro(e.legati)+')' : ''}${e.imposta>0 ? ' — imposta '+simEuro(e.imposta) : ' — esente'}${e.ipocat>0 ? ' + ipotecaria e catastale '+simEuro(e.ipocat) : ''}${e.voltura>0 ? ' + voltura veicoli '+simEuro(e.voltura) : ''}, netto ${simEuro(e.netto!=null?e.netto:e.ricevuto-e.imposta)}`));
    if((d.veicoli||[]).length){
      righe.push(`Beni mobili registrati: ${(d.veicoli||[]).length}${d.beniMobiliEsenti>0 ? ' — auto, moto e camper esenti da imposta di successione per ' + simEuro(d.beniMobiliEsenti) : ''}`);
      (d.veicoli||[]).forEach(v=> righe.push(`  · ${v.nome} (${v.tipo}): ${simEuro(v.valore)} — ${v.esente ? 'esente' : 'imponibile'}, voltura ${simEuro(v.voltura)}${v.a ? ' a carico di ' + v.a : ''}`));
    }
    righe.push(`Imposta di successione: ${simEuro(d.impostaSuccessione)} · ipotecaria e catastale: ${simEuro(d.impostaImmobili)}${(d.impostaVoltura||0)>0 ? ' · voltura veicoli: ' + simEuro(d.impostaVoltura) : ''} · totale imposte: ${simEuro(d.impostaTotale)}`);
    righe.push(`Netto agli eredi: ${simEuro(d.nettoEredi)}`);
    (d.fuoriDettaglio||[]).forEach(p=>{
      righe.push(`${p.nome}: ${simEuro(p.capitale)} fuori successione`);
      (p.voci||[]).forEach(v=> righe.push(`  · ${v.nome}: ${sucPct(v.quota)} = ${simEuro(v.importo)}`));
    });
    if(d.lesione) righe.push('ATTENZIONE: le quote assegnate ledono la legittima (azione di riduzione entro 10 anni).');
  } else {
    righe.push('Simulazione Mutuo');
    righe.push(`Mutuo di ${simEuro(d.importo)} al ${simPct(d.tasso)}% (TAN) in ${simAnniTesto(d.anni)}`);
    righe.push(`Rata ${MUT_FREQ_AGG[d.freq]||'mensile'}: ${simEuro2(d.rata)} — totale da restituire: ${simEuro(d.totaleRimborso)} (di cui interessi ${simEuro(d.totaleInteressi)})`);
    if(d.inizio){
      const o = mutAdOggi(mutPiano(d.importo, d.tasso, d.anni, d.freq), d.inizio);
      if(o && o.futuro) righe.push(`Parte il ${mutDataTesto(o.inizio)}: non ancora iniziato`);
      else if(o && o.finito) righe.push(`Partito il ${mutDataTesto(o.inizio)}: già estinto`);
      else if(o) righe.push(`Partito il ${mutDataTesto(o.inizio)}: pagate ${o.pagate} rate, ne restano ${o.restanti} per ${simEuro(o.daPagare)}; capitale residuo ${simEuro(o.residuo)}, ultima rata il ${mutDataTesto(o.fine)}`);
    }
  }
  righe.push('Simulazione indicativa: non considera imposte non indicate, costi e commissioni e non costituisce consulenza finanziaria.');
  return righe.join('\n');
}

function confermaSalvaSim(){
  if(!simDaSalvare) return;
  const inp = document.getElementById('simNomeSalva');

  const nome = nomeEl || simRigaTitolo({tipo:simDaSalvare.tipo, dati:simDaSalvare.dati});
  const note = (noteEl && noteEl.value.trim()) || '';
  db.simulazioni.push({ id:nuovoId(), nome, note, tipo:simDaSalvare.tipo, creata:new Date().toISOString(), dati:simDaSalvare.dati });

    db.simulazioni.pop();
    toast('Impossibile salvare: memoria piena o navigazione privata');

}
function duplicaSimulazione(id){
  const orig = db.simulazioni.find(x=>x.id===id); if(!orig) return;
  const copia = JSON.parse(JSON.stringify(orig));
  copia.id = nuovoId();
  copia.nome = (orig.nome || simRigaTitolo(orig)) + ' (copia)';
  copia.creata = new Date().toISOString();
  db.simulazioni.push(copia);
  if(!salva()){ db.simulazioni.pop(); toast('Impossibile salvare: memoria piena o navigazione privata'); return; }
  rendi();
  toast('Simulazione duplicata ✓');
}

/* ---------- ELENCO SIMULAZIONI SALVATE ---------- */
function simDataTesto(iso){ const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function simTipoMeta(tipo){
  if(tipo==='accumulo') return {nome:'Accumulo', classe:'blu', ico:SIM_ICO_SU};
  if(tipo==='decumulo') return {nome:'Decumulo', classe:'verde', ico:SIM_ICO_GIU};
  if(tipo==='mutuo') return {nome:'Mutuo', classe:'arancio', ico:SIM_ICO_MUTUO};
  if(tipo==='successione') return {nome:'Successione', classe:'teal', ico:SUC_ICO};
  return {nome:'Spese Universitarie', classe:'viola', ico:SIM_ICO_CAP};
}
function uniNomeCorso(k){ const c = UNI_CORSI.find(x=>x.k===k); return c ? c.nome : ''; }
function simRigaTitolo(sim){
  const d = sim.dati||{};
  if(sim.tipo==='accumulo') return d.modo==='rata'
    ? `Accumulo — ${simEuro(d.rata)} ${(SIM_FREQ_NOMI[d.freq]||'').toLowerCase()} per ${simAnniTesto(d.anni)}`
    : `Accumulo — obiettivo ${simEuro(d.obiettivo)} in ${simAnniTesto(d.anni)}`;
  if(sim.tipo==='universita') return `Università${d.studente?' per '+d.studente:''} — ${simAnniTesto(d.anniTot||0)} di studi`;
  if(sim.tipo==='mutuo') return `Mutuo — ${simEuro(d.importo)} in ${simAnniTesto(d.anni)}`;
  if(sim.tipo==='successione') return `Successione — ${simEuro(d.netto)} fra ${d.nEredi||0} ${(d.nEredi===1?'erede':'eredi')}`;
  return d.modo==='orizzonte'
    ? `Decumulo — ${simEuro(d.capitale)} per ${simAnniTesto(d.anni)}`
    : `Decumulo — ${simEuro(d.capitale)}, necessità ${simEuro(d.necessita)} l'anno`;
}
function simRigaRisultato(sim){
  const d = sim.dati||{};
  if(sim.tipo==='accumulo'){
    if(d.modo==='pic'){
      const extra = d.v2 ? d.risultato : Math.max(0, (d.risultato||0) - (d.capitale||0));   // salvataggi vecchi: risultato = importo totale
      return {v:simEuro(extra), k: d.capitale>0 ? 'da aggiungere oggi' : 'da investire oggi'};
    }
    if(d.modo==='rata') return {v:simEuro(d.finale), k:'capitale finale'};
    return {v:simEuro(d.risultato), k:'al '+(SIM_FREQ_PAROLA[d.freq]||'mese')};
  }
  if(sim.tipo==='universita') return {v:simEuro(d.totale), k:'spesa totale stimata'};
  if(sim.tipo==='mutuo') return {v:simEuro2(d.rata), k:'rata al '+(SIM_FREQ_PAROLA[d.freq]||'mese')};
  if(sim.tipo==='successione') return {v:simEuro(d.impostaTotale), k:'totale imposte'};
  if(d.modo==='orizzonte') return {v:simEuro(d.prelievoAnnuo), k:"prelievo all'anno"};
  return {v: d.perpetuo ? 'Per sempre' : (d.oltre ? 'Oltre 100 anni' : decDurataTesto(d.durataPeriodi||0, d.freq||1)), k:'durata del capitale'};
}
function vistaSalvate(){

  let html = testata('Simulazioni salvate', 'Tocca una simulazione per rivederne i parametri, riaprirla nel simulatore o eliminarla');
  if(!sims.length){
    html += `<div class="card vuoto">
      <span class="vuoto-ico">${ico('save',34)}</span>
      <div class="vuoto-tit">Nessuna simulazione salvata</div>

      <button class="btn" onclick="vai('simulatore')">${icoTit('chart')} Vai ai simulatori</button></div>`;
    return html;
  }
  html += `<div class="card"><h2>${icoTit('save')} Simulazioni salvate <span class="muto" style="font-weight:400">(${sims.length})</span></h2>`;
  for(const s of sims){
    const d = s.dati||{}, r = simRigaRisultato(s), m = simTipoMeta(s.tipo);
    const parametro = s.tipo==='universita' ? 'inflazione '+simPct(d.inflazione||0)+'%'
      : s.tipo==='mutuo' ? 'TAN '+simPct(d.tasso||0)+'%'

<script>
/* ================= DATI DI MERCATO (London Strategic Edge via proxy Cloudflare) =================
   La chiave API NON sta qui: sta come segreto nel Worker su Cloudflare.
   Questa pagina chiama solo il proxy, che aggiunge la chiave e gira la richiesta all'API. */
const DATI_PROXY = 'https://app.m-sicurezza.workers.dev';
const DATI_CACHE_MIN = 30;   // minuti di validità della copia locale (localStorage)

const DATI_GRUPPI = [
  { titolo:'Rendimenti titoli di Stato — 10 anni', serie:[
    {sym:'IT10Y', nome:'Italia'},

];

/* dataset che si leggono come serie (data+valore in %); tutto il resto usa le candele */
const DATI_SERIE_DS = new Set(['economics','bonds','sovereign_yields','interest_rates','credit_indices','corporate_bonds']);
const DATI_DS_NOMI = {
  stocks:'Azione', etf:'ETF', crypto:'Cripto', fx:'Cambio', index:'Indice',
  economics:'Macro', bonds:'Rendimento', sovereign_yields:'Rendimento',

let cercaUltimi = [];

/* ---------- formattazione ---------- */
function datiISO(giorniFa){
  const d = new Date(Date.now() - giorniFa*86400000);
  return d.toISOString().slice(0,10);
}
function datiPct(n){ return n.toLocaleString('it-IT',{minimumFractionDigits:2, maximumFractionDigits:2}) + '%'; }
function datiDataIt(s){
  const [a,m,g] = String(s).slice(0,10).split('-');
  return `${g}/${m}/${a}`;
}
function fmtNum(n, dec){ return itNum(n, dec??2); }
function fmtValuta(n, cur){
  try{ return Number(n).toLocaleString('it-IT',{style:'currency', currency:cur||'USD', minimumFractionDigits:2, maximumFractionDigits:Math.abs(n)<10?4:2}); }
  catch(e){ return fmtNum(n) + ' ' + (cur||''); }
}
function fmtCompatto(n){
  try{ return Number(n).toLocaleString('it-IT',{notation:'compact', maximumFractionDigits:1}); }
  catch(e){ return fmtNum(n,0); }
}
function fmtMld(n, cur){
  if(n==null || !isFinite(n)) return '—';
  const s = cur==='EUR' ? '€' : cur==='USD' ? '$' : (cur||'');
  if(Math.abs(n)>=1e9) return fmtNum(n/1e9, Math.abs(n)>=1e11?0:1) + ' mld ' + s;
  return fmtNum(n/1e6, 0) + ' mln ' + s;
}
function titValutaAttiva(){ return titoloValuta || titoloCur; }
function titFmtVal(v){
  const t = titoloAperto;
  if(!t || DATI_SERIE_DS.has(t.dataset)) return datiPct(v);
  if(t.dataset==='stocks' || t.dataset==='etf') return fmtValuta(v, titValutaAttiva());
  return fmtNum(v, Math.abs(v)<10?4:2);
}

/* ---------- scarico dati con copia locale ---------- */
async function datiFetch(percorso){
  const k = 'simfin_dati_' + percorso;
  try{
    const c = JSON.parse(localStorage.getItem(k));
    if(c && Date.now() - c.t < DATI_CACHE_MIN*60000) return c.d;
  }catch(e){}
  let r = await fetch(DATI_PROXY + percorso);
  if(r.status===429){   // limite di chiamate al minuto: breve pausa e un secondo tentativo
    await new Promise(x=>setTimeout(x, 1500));
    r = await fetch(DATI_PROXY + percorso);
  }
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  try{
    const s = JSON.stringify({t:Date.now(), d});
    if(s.length < 300000) localStorage.setItem(k, s);   // le risposte enormi non si salvano
  }catch(e){}
  return d;
}
function datiSvuotaCache(){
  const via = [];
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith('simfin_dati_')) via.push(k); }
  via.forEach(k=>localStorage.removeItem(k));
}
function datiRicarica(){ datiSvuotaCache(); fxCache={}; rendi(); toast('Dati aggiornati dalla fonte'); }

/* ================= MOTORE GRAFICO INTERATTIVO =================
   Linee multiple o candele, griglia con valori, crosshair tratteggiato,
   pallino sul punto e tooltip con data e valore (mouse e tocco). */
let GRAF = {};   // stato per ogni grafico attivo, per l'interazione

function grafNiceStep(sp){
  const grezzo = sp/4, mag = Math.pow(10, Math.floor(Math.log10(grezzo)));
  for(const m of [1,2,2.5,5,10]){ if(grezzo <= m*mag) return m*mag; }
  return 10*mag;
}

function grafInterattivo(contId, cfg){
  /* cfg: { serie:[{nome, colore, pts:[{t,v}]}], candele:[{t,o,h,l,c}]|null,
            fmt(v), normalizzato:bool } */
  const w=760, h=360, padL=58, padR=12, padT=16, padB=34;
  const st = { ...cfg, w, h, padL, padR, padT, padB, contId };
  let vals = [], t0=Infinity, t1=-Infinity;
  if(cfg.candele && cfg.candele.length){
    cfg.candele.forEach(c=>{ vals.push(c.h, c.l); });
    t0 = 0; t1 = cfg.candele.length-1;
  } else {
    cfg.serie.forEach(s=>s.pts.forEach(p=>{ vals.push(p.v); if(p.t<t0)t0=p.t; if(p.t>t1)t1=p.t; }));
  }
  if(!vals.length){ document.getElementById(contId).innerHTML = '<div class="dati-err">Nessun dato</div>'; return; }
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ min-=1; max+=1; }
  const margine = (max-min)*0.04; min-=margine; max+=margine;
  const px = t => padL + (t1===t0 ? 0 : (t-t0)/(t1-t0)) * (w-padL-padR);
  const py = v => padT + (1-(v-min)/(max-min)) * (h-padT-padB);
  st.px=px; st.py=py; st.min=min; st.max=max; st.t0=t0; st.t1=t1;

  /* griglia orizzontale con valori */
  const passo = grafNiceStep(max-min);
  let griglia = '';
  for(let v = Math.ceil(min/passo)*passo; v <= max; v += passo){
    const y = py(v);
    griglia += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--bordo)" stroke-width="1" opacity="0.55"/>
      <text x="${padL-7}" y="${y+4}" font-size="11" fill="var(--testo-3)" text-anchor="end">${cfg.normalizzato ? (v>=100?'+':'')+fmtNum(v-100,0)+'%' : fmtCompatto(v)}</text>`;
  }

  let corpo = '';
  if(cfg.candele && cfg.candele.length){
    const n = cfg.candele.length;
    const lw = Math.max(2, (w-padL-padR)/n*0.62);
    corpo = cfg.candele.map((c,i)=>{
      const x = px(i), su = c.c>=c.o;
      const col = su ? 'var(--verde-txt)' : '#d64545';
      const yO=py(c.o), yC=py(c.c);
      return `<line x1="${x}" y1="${py(c.h)}" x2="${x}" y2="${py(c.l)}" stroke="${col}" stroke-width="1.2"/>
        <rect x="${x-lw/2}" y="${Math.min(yO,yC)}" width="${lw}" height="${Math.max(1.5,Math.abs(yO-yC))}" fill="${col}" rx="1"/>`;
    }).join('');
  } else {
    corpo = cfg.serie.map((s,si)=>{
      const linea = s.pts.map(p=>`${px(p.t).toFixed(1)},${py(p.v).toFixed(1)}`).join(' ');
      let area = '';
      if(cfg.serie.length===1){
        area = `<polygon points="${px(s.pts[0].t).toFixed(1)},${(h-padB).toFixed(1)} ${linea} ${px(s.pts[s.pts.length-1].t).toFixed(1)},${(h-padB).toFixed(1)}" fill="${s.colore}" opacity="0.08"/>`;
      }
      return area + `<polyline points="${linea}" fill="none" stroke="${s.colore}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }).join('');
  }

  const etiSx = cfg.candele ? datiDataIt(cfg.candele[0].d) : datiDataIt(new Date(t0).toISOString());
  const etiDx = cfg.candele ? datiDataIt(cfg.candele[cfg.candele.length-1].d) : datiDataIt(new Date(t1).toISOString());
  const nSerie = cfg.candele ? 1 : cfg.serie.length;
  let pallini = '';
  for(let i=0;i<nSerie;i++){
    const col = cfg.candele ? 'var(--accento)' : cfg.serie[i].colore;
    pallini += `<circle id="${contId}_dot${i}" r="4.5" fill="${col}" stroke="var(--carta)" stroke-width="2" style="display:none"/>`;
  }

  document.getElementById(contId).innerHTML = `
    <svg class="dati-chart" id="${contId}_svg" viewBox="0 0 ${w} ${h}" style="touch-action:pan-y">
      ${griglia}
      ${corpo}
      <line id="${contId}_cross" x1="0" y1="${padT}" x2="0" y2="${h-padB}" stroke="var(--testo-3)" stroke-width="1" stroke-dasharray="4 4" style="display:none"/>
      ${pallini}
      <text x="${padL}" y="${h-8}" font-size="11" fill="var(--testo-3)">${etiSx}</text>
      <text x="${w-padR}" y="${h-8}" font-size="11" fill="var(--testo-3)" text-anchor="end">${etiDx}</text>
    </svg>
    <div class="graf-tip" id="${contId}_tip"></div>`;

  GRAF[contId] = st;
  const svg = document.getElementById(contId+'_svg');
  const mossa = e => { const p = e.touches ? e.touches[0] : e; grafHover(contId, p.clientX); };
  svg.addEventListener('mousemove', mossa);
  svg.addEventListener('touchstart', mossa, {passive:true});
  svg.addEventListener('touchmove', mossa, {passive:true});
  svg.addEventListener('mouseleave', ()=>grafTipVia(contId));
}

function grafTipVia(id){
  const tip = document.getElementById(id+'_tip'); if(tip) tip.style.display='none';
  const cr = document.getElementById(id+'_cross'); if(cr) cr.style.display='none';
  const st = GRAF[id]; if(!st) return;
  const n = st.candele ? 1 : st.serie.length;
  for(let i=0;i<n;i++){ const d = document.getElementById(id+'_dot'+i); if(d) d.style.display='none'; }
}

function grafHover(id, clientX){
  const st = GRAF[id]; if(!st) return;
  const svg = document.getElementById(id+'_svg'); if(!svg) return;
  const r = svg.getBoundingClientRect();
  if(r.width < 10) return;
  const xv = (clientX - r.left)/r.width * st.w;
  const frac = Math.min(1, Math.max(0, (xv - st.padL)/(st.w - st.padL - st.padR)));
  const cross = document.getElementById(id+'_cross');
  const tip = document.getElementById(id+'_tip');
  let righe = [], xLinea;

  if(st.candele && st.candele.length){
    const i = Math.round(frac*(st.candele.length-1));
    const c = st.candele[i];
    xLinea = st.px(i);
    const dot = document.getElementById(id+'_dot0');
    dot.setAttribute('cx', xLinea); dot.setAttribute('cy', st.py(c.c)); dot.style.display='';
    righe.push(`<b>${datiDataIt(c.d)}</b>`);
    righe.push(`Apertura ${st.fmt(c.o)} · Chiusura <b>${st.fmt(c.c)}</b>`);
    righe.push(`Massimo ${st.fmt(c.h)} · Minimo ${st.fmt(c.l)}`);
  } else {
    const t = st.t0 + frac*(st.t1 - st.t0);
    xLinea = st.px(t);
    let dataRef = null;
    st.serie.forEach((s,si)=>{
      let lo=0, hi=s.pts.length-1;             // punto più vicino nel tempo
      while(hi-lo>1){ const m=(lo+hi)>>1; (s.pts[m].t<t) ? lo=m : hi=m; }
      const p = (Math.abs(s.pts[lo].t-t) <= Math.abs(s.pts[hi].t-t)) ? s.pts[lo] : s.pts[hi];
      const dot = document.getElementById(id+'_dot'+si);
      dot.setAttribute('cx', st.px(p.t)); dot.setAttribute('cy', st.py(p.v)); dot.style.display='';
      if(!dataRef) dataRef = p.t;
      const val = st.normalizzato ? (p.v>=100?'+':'')+fmtNum(p.v-100,1)+'%' : st.fmt(p.v);
      righe.push(st.serie.length>1
        ? `<span class="pallino-c" style="background:${s.colore}"></span>${esc(s.nome)}: <b>${val}</b>`
        : `<b>${val}</b>`);
    });
    if(dataRef) righe.unshift(`<b>${datiDataIt(new Date(dataRef).toISOString())}</b>`);
  }

  cross.setAttribute('x1', xLinea); cross.setAttribute('x2', xLinea); cross.style.display='';
  tip.innerHTML = righe.join('<br>');
  tip.style.display='block';
  const cont = document.getElementById(id);
  const bx = cont.getBoundingClientRect();
  const xPx = xLinea/st.w * bx.width;
  const aDestra = xPx < bx.width/2;
  tip.style.left = aDestra ? Math.min(bx.width-tip.offsetWidth-4, xPx+14)+'px' : '';
  tip.style.right = aDestra ? '' : Math.min(bx.width-tip.offsetWidth-4, bx.width-xPx+14)+'px';
  tip.style.top = '10px';
}

function datiSpark(vals){
  if(vals.length<2) return '';
  const w=200, h=38, min=Math.min(...vals), max=Math.max(...vals), sp=(max-min)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-min)/sp*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="dati-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accento)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* scarico di una serie storica: {d, v} + OHLC quando disponibile */
async function titoloPuntiRaw(sym, dataset, giorni){
  const eSerie = DATI_SERIE_DS.has(dataset);
  const base = eSerie ? '/series' : '/candles';
  const tf = eSerie ? '' : '&timeframe=1d';
  let percorso;
  if(giorni) percorso = `${base}?symbol=${encodeURIComponent(sym)}${tf}&start=${datiISO(giorni)}`;
  else percorso = `${base}?symbol=${encodeURIComponent(sym)}${tf}&order=desc&limit=5000`;
  let righe = await datiFetch(percorso);
  if(!giorni) righe = righe.slice().reverse();
  let pts = righe.map(r => eSerie
    ? {d:String(r.date).slice(0,10), v:r.value}
    : {d:String(r.ts).slice(0,10), v:r.close, o:r.open, h:r.high, l:r.low});
  if(!eSerie && pts.length>10){
    /* pulizia: elimina i tick sporchi (prezzi a zero o fuori scala rispetto alla mediana) */
    const ord = pts.map(p=>p.v).filter(v=>v>0).sort((a,b)=>a-b);
    const med = ord[Math.floor(ord.length/2)] || 1;
    pts = pts.filter(p=>p.v>med*0.1 && p.v<med*10);
    /* e i picchi di un solo giorno: valore che si stacca >35% da entrambi i vicini */
    pts = pts.filter((p,i)=>{
      if(i===0 || i===pts.length-1) return true;
      const m = (pts[i-1].v + pts[i+1].v)/2;
      return Math.abs(p.v-m) <= 0.35*m || Math.abs(pts[i-1].v-pts[i+1].v) > 0.3*m;
    });
  }
  return pts;
}

/* cambio storico tra due valute: prova la coppia diretta, poi inversa, poi passa dal dollaro */
async function serieCambio(da, a, giorni){
  const chiave = `${da}>${a}>${giorni||'max'}`;
  if(fxCache[chiave]) return fxCache[chiave];
  const prova = async (sym, inverti) => {
    const righe = await titoloPuntiRaw(sym, 'fx', giorni);
    if(!righe.length) throw new Error('vuota');
    return righe.map(r=>({d:r.d, v: inverti ? 1/r.v : r.v}));
  };
  let out = null;
  try{ out = await prova(`${da}/${a}`, false); }catch(e){}
  if(!out){ try{ out = await prova(`${a}/${da}`, true); }catch(e){} }
  if(!out && da!=='USD' && a!=='USD'){
    const [x, y] = await Promise.all([serieCambio(da,'USD',giorni), serieCambio('USD',a,giorni)]);
    const my = new Map(y.map(r=>[r.d, r.v]));
    let ult = null;
    out = x.map(r=>{ if(my.has(r.d)) ult = my.get(r.d); return ult!=null ? {d:r.d, v:r.v*ult} : null; }).filter(Boolean);
  }
  if(!out || !out.length) throw new Error('cambio non disponibile');
  fxCache[chiave] = out;
  return out;
}
function convertiPunti(punti, cambio){
  const mc = new Map(cambio.map(r=>[r.d, r.v]));
  let tasso = cambio[0].v;
  return punti.map(p=>{
    if(mc.has(p.d)) tasso = mc.get(p.d);
    const f = x => x==null ? undefined : x*tasso;
    return {d:p.d, v:f(p.v), o:f(p.o), h:f(p.h), l:f(p.l)};
  });
}

function aggregaCandele(pts, maxBarre){
  if(pts.length<=maxBarre) return pts.map(p=>({d:p.d, o:p.o, h:p.h, l:p.l, c:p.v}));
  const dim = Math.ceil(pts.length/maxBarre), out = [];
  for(let i=0;i<pts.length;i+=dim){
    const gr = pts.slice(i, i+dim);
    out.push({ d:gr[gr.length-1].d, o:gr[0].o, c:gr[gr.length-1].v,
      h:Math.max(...gr.map(p=>p.h??p.v)), l:Math.min(...gr.map(p=>p.l??p.v)) });
  }
  return out;
}

async function aggiornaGrafTitolo(){
  const t = titoloAperto; if(!t) return;
  const box = document.getElementById('titChartBox'); if(!box) return;
  const giorni = RANGE_GIORNI[titoloRange];
  const nota = document.getElementById('titNota');
  try{
    let punti = await titoloPuntiRaw(t.symbol, t.dataset, giorni);
    if(titoloAperto!==t) return;
    if(!punti.length){ box.innerHTML = '<div class="dati-err">Nessun dato per questo periodo</div>'; return; }

    /* conversione di valuta (solo azioni/ETF) */
    let convertito = false;
    if(titoloValuta && titoloValuta!==titoloCur && (t.dataset==='stocks'||t.dataset==='etf')){
      try{
        const cambio = await serieCambio(titoloCur, titoloValuta, giorni);
        punti = convertiPunti(punti, cambio);
        convertito = true;
      }catch(e){
        titoloValuta = null; aggiornaValutePills();
        toast('Cambio non disponibile per ' + titoloCur);
      }
    }
    if(nota) nota.textContent = convertito
      ? `Controvalore indicativo in ${titoloValuta} al cambio storico ${titoloCur}/${titoloValuta}`
      : '';

    const ult = punti[punti.length-1], primo = punti[0];
    const delta = ult.v - primo.v, deltaPct = primo.v ? delta/primo.v*100 : 0;
    const eSerie = DATI_SERIE_DS.has(t.dataset);
    const el = id => document.getElementById(id);
    el('titPrezzo').textContent = titFmtVal(ult.v);
    el('titVar').className = 'dati-delta ' + (delta>=0?'pos':'neg');
    el('titVar').textContent = (delta>=0?'+':'−') + (eSerie
      ? fmtNum(Math.abs(delta)) + ' punti'
      : fmtNum(Math.abs(delta)) + ' (' + fmtNum(Math.abs(deltaPct),1) + '%)') + ' nel periodo';
    el('titData').textContent = 'aggiornato al ' + datiDataIt(ult.d);

    /* confronto: tutte le serie normalizzate a 100 all'inizio del periodo */
    if(confronti.length){
      const altri = await Promise.allSettled(confronti.map(c=>titoloPuntiRaw(c.symbol, c.dataset, giorni)));
      if(titoloAperto!==t) return;
      const serie = [{nome:t.symbol, colore:CONF_COLORI[0], pts:punti}];
      altri.forEach((r,i)=>{ if(r.status==='fulfilled' && r.value.length) serie.push({nome:confronti[i].symbol, colore:CONF_COLORI[(i+1)%CONF_COLORI.length], pts:r.value}); });
      const inizio = Math.max(...serie.map(s=>Date.parse(s.pts[0].d)));
      const norm = serie.map(s=>{
        const pp = s.pts.filter(p=>Date.parse(p.d)>=inizio);
        const base = pp.length ? pp[0].v : 1;
        return {nome:s.nome, colore:s.colore, pts:pp.map(p=>({t:Date.parse(p.d), v:p.v/base*100}))};
      }).filter(s=>s.pts.length>1);
      grafInterattivo('titChartBox', {serie:norm, candele:null, fmt:v=>fmtNum(v,1), normalizzato:true});
      box.insertAdjacentHTML('beforeend', `<div class="graf-leg">${norm.map(s=>`<span><span class="pallino-c" style="background:${s.colore}"></span> ${esc(s.nome)}</span>`).join('')}</div>`);
      return;
    }

    if(titoloModo==='candele' && !eSerie && punti[0].o!=null){
      grafInterattivo('titChartBox', {serie:[], candele:aggregaCandele(punti, 90), fmt:titFmtVal});
    } else {
      grafInterattivo('titChartBox', {
        serie:[{nome:t.symbol, colore:'var(--accento)', pts:punti.map(p=>({t:Date.parse(p.d), v:p.v}))}],
        candele:null, fmt:titFmtVal});
    }
  }catch(e){
    box.innerHTML = '<div class="dati-err">Grafico non disponibile per questo strumento</div>';
  }
}

/* ---------- confronto ---------- */
function apriConfronto(){
  apriFinestra(`<h2 style="margin:0 0 10px">Confronta con…</h2>
    <div class="card cerca-box" style="margin-bottom:10px">
      <input id="confInput" placeholder="Cerca un titolo da aggiungere al grafico…"
        autocomplete="off" autocorrect="off" spellcheck="false" oninput="confDigita()">
    </div>
    <div id="confRisultati"></div>
    <div class="dati-data" style="margin-top:10px">Nel confronto le serie partono tutte da 100 all'inizio del periodo: le curve mostrano la performance percentuale, così valute diverse restano confrontabili.</div>`);
  setTimeout(()=>{ const i=document.getElementById('confInput'); if(i) i.focus(); }, 60);
}
let confTimer = null;
function confDigita(){
  clearTimeout(confTimer);
  const q = document.getElementById('confInput').value.trim();
  if(q.length<2){ document.getElementById('confRisultati').innerHTML=''; return; }
  confTimer = setTimeout(async ()=>{
    const box = document.getElementById('confRisultati');
    box.innerHTML = '<div class="cerca-voce muto">ricerca…</div>';
    try{
      const r = await fetch(DATI_PROXY + '/search?q=' + encodeURIComponent(q));
      const ris = (await r.json()).filter(x=>!DATI_SERIE_DS.has(x.dataset) || DATI_SERIE_DS.has(titoloAperto.dataset));
      confUltimi = ris;
      box.innerHTML = ris.length ? ris.map((x,i)=>`
        <button class="cerca-voce" onclick="confAggiungi(${i})">
          <b>${esc(x.symbol)}</b><span class="cerca-nome">${esc(x.name||'')}</span>
          <span class="cerca-tag">${esc(DATI_DS_NOMI[x.dataset]||x.dataset)}</span>
        </button>`).join('') : '<div class="cerca-voce muto">Nessun risultato</div>';
    }catch(e){ box.innerHTML = '<div class="cerca-voce muto">Ricerca non disponibile</div>'; }
  }, 280);
}
function confAggiungi(i){
  const x = confUltimi[i]; if(!x) return;
  if(confronti.length>=4){ toast('Massimo 4 titoli a confronto'); return; }
  if(x.symbol===titoloAperto.symbol || confronti.some(c=>c.symbol===x.symbol)){ toast('Già nel grafico'); return; }
  confronti.push(x);
  chiudiFinestra();
  aggiornaChips();
  aggiornaGrafTitolo();
}
function confRimuovi(i){
  confronti.splice(i,1);
  aggiornaChips();
  aggiornaGrafTitolo();
}
function aggiornaChips(){
  const el = document.getElementById('titChips'); if(!el) return;
  if(!confronti.length){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='flex';
  el.innerHTML = `<span class="tit-chip"><span class="pallino-c" style="background:${CONF_COLORI[0]}"></span>${esc(titoloAperto.symbol)}</span>` +
    confronti.map((c,i)=>`<span class="tit-chip"><span class="pallino-c" style="background:${CONF_COLORI[(i+1)%CONF_COLORI.length]}"></span>${esc(c.symbol)}<button onclick="confRimuovi(${i})" title="Togli dal confronto">✕</button></span>`).join('');
}

/* ---------- profilo, fondamentali e sezioni ---------- */
async function caricaProfilo(sym){
  const [pr, fr] = await Promise.allSettled([
    datiFetch('/ref/company_profiles?symbol=' + encodeURIComponent(sym)),
    datiFetch('/ref/stock_fundamentals?symbol=' + encodeURIComponent(sym))
  ]);
  const p = pr.status==='fulfilled' && pr.value[0] || null;
  const f = fr.status==='fulfilled' && fr.value[0] || null;
  if(!titoloAperto || titoloAperto.symbol!==sym) return;
  if(p){
    titoloCur = p.currency || titoloCur;
    const scuro = document.documentElement.getAttribute('data-theme')==='dark';
    const logo = scuro ? (p.image_url_dark||p.image_url_light) : (p.image_url_light||p.image_url_dark);
    if(logo){
      const im = document.getElementById('titLogo');
      if(im){ im.src = logo; im.style.display='block'; im.onerror = ()=>{ im.style.display='none'; }; }
    }
    const meta = document.getElementById('titMeta');
    if(meta) meta.textContent = [p.symbol, p.exchange, p.sector, p.industry, p.isin?'ISIN '+p.isin:null].filter(Boolean).join(' · ');
    if(p.description){
      const d = document.getElementById('titDesc');
      if(d) d.innerHTML = `<div class="card tit-sez"><div class="dati-gruppo-tit">Profilo società</div>
        <div class="tit-desc">${esc(p.description)}</div>
        ${p.ceo?`<div class="dati-data" style="margin-top:10px">CEO: ${esc(p.ceo)}${p.full_time_employees?' · Dipendenti: '+itNum(p.full_time_employees, 0):''}${p.website?` · <a href="${esc(p.website)}" target="_blank" rel="noopener">${esc(p.website.replace(/^https?:\/\//,''))}</a>`:''}</div>`:''}
      </div>`;
    }
  }
  if(f){
    titoloCur = f.currency || titoloCur;
    const cur = f.currency;
    const st = [
      ['Prezzo', f.current_price!=null ? fmtValuta(f.current_price, cur) : '—'],
      ['Capitalizzazione', fmtMld(f.market_cap, cur)],
      ['P/E', f.pe_ratio!=null ? fmtNum(f.pe_ratio,1) : '—'],
      ['Beta', f.beta!=null ? fmtNum(f.beta,2) : '—'],
      ['Rendimento dividendo', f.dividend_yield!=null ? fmtNum(f.dividend_yield*100,2)+'%' : '—'],
      ['Range 52 settimane', f.week_52_low!=null ? fmtValuta(f.week_52_low,cur)+' – '+fmtValuta(f.week_52_high,cur) : '—'],
      ['Ricavi (ultimi 12 mesi)', fmtMld(f.revenue_ttm, cur)],
      ['Margine netto', f.profit_margin!=null ? fmtNum(f.profit_margin*100,1)+'%' : '—']
    ];
    const s = document.getElementById('titStats');
    if(s) s.innerHTML = `<div class="dati-gruppo-tit" style="margin-top:22px">Dati principali</div>
      <div class="tit-stats">${st.map(x=>`<div class="card tit-stat"><div class="dati-nome">${x[0]}</div><div class="tit-stat-v">${x[1]}</div></div>`).join('')}</div>`;
  }
  aggiornaValutePills();
}

async function caricaSezioni(sym){
  const q = s => datiFetch(s);
  const [dv, ins, bil] = await Promise.allSettled([
    q(`/ref/dividends?symbol=${encodeURIComponent(sym)}&order=desc&limit=8`),
    q(`/ref/insider_trades?symbol=${encodeURIComponent(sym)}&order=desc&limit=8`),
    q(`/ref/financial_reports?symbol=${encodeURIComponent(sym)}&report_type=income&period=FY&order=desc&limit=4`)
  ]);
  if(!titoloAperto || titoloAperto.symbol!==sym) return;
  const sez = document.getElementById('titSezioni'); if(!sez) return;
  const parti = [];

  if(bil.status==='fulfilled' && bil.value.length){
    const righe = bil.value.map(r=>{
      let d = {}; try{ d = JSON.parse(r.data); }catch(e){}
      return { anno:r.fiscal_year, ricavi:d.revenue, utile:d.netIncome, eps:d.epsDiluted??d.eps };
    }).filter(r=>r.ricavi!=null);
    if(righe.length) parti.push(`<div class="card tit-sez"><div class="dati-gruppo-tit">Conto economico — esercizi annuali</div>
      <div style="overflow-x:auto"><table class="tit-tab"><tr><th>Anno</th><th>Ricavi</th><th>Utile netto</th><th>EPS</th><th>Margine</th></tr>
      ${righe.map(r=>`<tr><td><b>${esc(r.anno)}</b></td><td>${fmtMld(r.ricavi, titoloCur)}</td><td>${fmtMld(r.utile, titoloCur)}</td><td>${r.eps!=null?fmtNum(r.eps):'—'}</td><td>${r.ricavi?fmtNum(r.utile/r.ricavi*100,1)+'%':'—'}</td></tr>`).join('')}
      </table></div></div>`);
  }

  if(dv.status==='fulfilled' && dv.value.length){
    parti.push(`<div class="card tit-sez"><div class="dati-gruppo-tit">Ultimi dividendi</div>
      <div style="overflow-x:auto"><table class="tit-tab"><tr><th>Stacco</th><th>Pagamento</th><th>Importo</th></tr>
      ${dv.value.map(d=>`<tr><td>${datiDataIt(d.effective_date)}</td><td>${d.payment_date?datiDataIt(d.payment_date):'—'}</td><td><b>${fmtValuta(d.dividend_amount, d.currency||titoloCur)}</b></td></tr>`).join('')}
      </table></div></div>`);
  }

  if(ins.status==='fulfilled' && ins.value.length){
    parti.push(`<div class="card tit-sez"><div class="dati-gruppo-tit">Operazioni degli insider (SEC)</div>
      <div style="overflow-x:auto"><table class="tit-tab"><tr><th>Data</th><th>Chi</th><th>Operazione</th><th>Quantità</th><th>Prezzo</th></tr>
      ${ins.value.map(o=>{
        const vendita = String(o.acquisition_or_disposition||'').toUpperCase()==='D';
        return `<tr><td>${datiDataIt(o.transaction_date)}</td><td>${esc(o.reporting_name||'—')}</td>
        <td class="${vendita?'neg-t':'pos-t'}">${esc(o.transaction_type||'—')}</td>
        <td>${o.securities_transacted!=null?itNum(o.securities_transacted, 0):'—'}</td>
        <td>${o.price!=null&&o.price>0?fmtValuta(o.price, titoloCur):'—'}</td></tr>`;
      }).join('')}
      </table></div></div>`);
  }

  sez.innerHTML = parti.join('');
}

/* ---------- dettaglio delle schede della panoramica (finestra) ---------- */
async function datiDettaglio(sym, nome){
  apriFinestra(`<h2 style="margin:0 0 6px">${esc(nome)}</h2><div class="dati-data">caricamento dello storico…</div>`);
  try{
    const righe = await datiFetch(`/series?symbol=${encodeURIComponent(sym)}&start=2010-01-01`);
    if(!righe.length) throw new Error('vuoto');
    const ult = righe[righe.length-1];
    apriFinestra(`
      <h2 style="margin:0 0 2px">${esc(nome)}</h2>
      <div class="dati-data">dal ${datiDataIt(righe[0].date)} al ${datiDataIt(ult.date)} · fonte London Strategic Edge</div>
      <div class="dati-val" style="margin-top:10px">${datiPct(ult.value)}</div>
      <div id="finGraf" class="graf-box" style="margin-top:6px"></div>`);
    grafInterattivo('finGraf', {
      serie:[{nome:sym, colore:'var(--accento)', pts:righe.map(r=>({t:Date.parse(String(r.date).slice(0,10)), v:r.value}))}],
      candele:null, fmt:datiPct});
  }catch(e){
    apriFinestra(`<h2 style="margin:0 0 6px">${esc(nome)}</h2><div class="dati-err">Storico non disponibile al momento. Controlla la connessione e riprova.</div>`);
  }
}

<script>
/* ================= INTERAZIONE TOUCH E ANIMAZIONI (iPadOS 27) ================= */
const SL_ICO_MENO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>';
const SL_ICO_PIU  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>';
function slRiempi(inp){
  const mn = +inp.min || 0, mx = +inp.max || 100, v = +inp.value;
  inp.style.setProperty('--p', ((v-mn)/(mx-mn||1)*100).toFixed(2) + '%');
}
function slImposta(inp, v, batti){
  const mn = +inp.min || 0, mx = +inp.max || 100, st = +inp.step || 1;
  v = Math.min(mx, Math.max(mn, Math.round((v-mn)/st)*st + mn));
  v = +v.toFixed(4);
  if(+inp.value === v) return false;
  inp.value = v;
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  if(batti){
    const big = inp.closest('.sim-campo') && inp.closest('.sim-campo').querySelector('.sl-valore');
    const bersaglio = big || inp.closest('.sim-slider').querySelector('.val');
    if(bersaglio){ bersaglio.classList.remove('batti'); void bersaglio.offsetWidth; bersaglio.classList.add('batti'); setTimeout(()=>bersaglio.classList.remove('batti'), 180); }
  }
  return true;
}
function slPotenzia(inp){
  if(inp.dataset.sl) return; inp.dataset.sl = '1';
  const box = inp.closest('.sim-slider'); if(!box) return;
  if(inp.dataset.stepper) box.classList.add('sl-stepper');
  const campo = box.closest('.sim-campo');
  const val = box.querySelector('.val');
  const label = campo ? campo.querySelector(':scope > label') : null;
  const st = +inp.step || 1;
  /* intestazione: etichetta a sinistra, valore grande a destra */
  let big = null;
  if(label && val){
    const testa = document.createElement('div'); testa.className = 'sl-testa';
    label.parentNode.insertBefore(testa, label); testa.appendChild(label);
    big = document.createElement('span'); big.className = 'sl-valore'; big.setAttribute('aria-live','polite');
    testa.appendChild(big);
  } else if(val) val.style.display = 'inline';
  /* pulsanti − e + (tenendoli premuti il valore scorre) */
  const mkBtn = (dir)=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sl-passo'; b.innerHTML = dir<0 ? SL_ICO_MENO : SL_ICO_PIU;
    b.setAttribute('aria-label', (dir<0 ? 'Diminuisci ' : 'Aumenta ') + (label ? label.textContent : ''));
    let t1 = 0, t2 = 0, daPuntatore = false;
    const passo = ()=> slImposta(inp, +inp.value + dir*st, true);
    const ferma = ()=>{ clearTimeout(t1); clearInterval(t2); };
    b.addEventListener('pointerdown', e=>{
      daPuntatore = true; passo(); ferma();
      t1 = setTimeout(()=>{ t2 = setInterval(()=>{ if(!passo()) ferma(); }, 85); }, 380);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev, ferma));
    b.addEventListener('click', ()=>{ if(!daPuntatore) passo(); daPuntatore = false; });
    return b;
  };
  const meno = mkBtn(-1), piu = mkBtn(1);
  box.insertBefore(meno, inp); box.insertBefore(piu, inp.nextSibling);
  /* scelte rapide */
  let rapidi = null;
  if(inp.dataset.preset){
    const vals = inp.dataset.preset.split(',').map(Number);
    const eti = (inp.dataset.presetEti || inp.dataset.preset).split(',');
    rapidi = document.createElement('div'); rapidi.className = 'sl-rapidi seg';
    rapidi.innerHTML = vals.map((v,i)=>`<button type="button" class="sl-rapido" data-v="${v}" aria-label="Imposta ${eti[i]}">${eti[i]}</button>`).join('');
    rapidi.addEventListener('click', e=>{ const b = e.target.closest('.sl-rapido'); if(b) slImposta(inp, +b.dataset.v, true); });
    const mm = campo && campo.querySelector('.sim-minmax');
    (mm || box).insertAdjacentElement('afterend', rapidi);
  }
  const sync = ()=>{
    if(big && val) big.textContent = val.textContent;
    slRiempi(inp);
    meno.disabled = +inp.value <= +inp.min; piu.disabled = +inp.value >= +inp.max;
    if(rapidi) rapidi.querySelectorAll('.sl-rapido').forEach(b=>b.classList.toggle('on', +b.dataset.v === +inp.value));
  };
  if(val) new MutationObserver(sync).observe(val, {childList:true, characterData:true, subtree:true});
  inp.addEventListener('input', sync);
  sync();
  /* al tocco: un tap sul binario sposta subito il cursore, un trascinamento orizzontale lo segue */
  let x0 = 0, y0 = 0, trascina = false, attivo = false;
  const daX = x=>{
    const r = inp.getBoundingClientRect(), th = 34;
    const f = Math.min(1, Math.max(0, (x - r.left - th/2) / (r.width - th)));
    slImposta(inp, +inp.min + f*(+inp.max - +inp.min));
  };
  inp.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse') return;
    attivo = true; trascina = false; x0 = e.clientX; y0 = e.clientY;
  });
  inp.addEventListener('pointermove', e=>{
    if(!attivo) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if(!trascina && Math.abs(dx) > 5 && Math.abs(dx) > Math.abs(dy)){
      trascina = true; inp.classList.add('trascina');
      try{ inp.setPointerCapture(e.pointerId); }catch(_){}
    }
    if(trascina) daX(e.clientX);
  });
  const fine = e=>{
    if(!attivo) return; attivo = false;
    if(!trascina && e.type==='pointerup' && Math.abs(e.clientX-x0) < 8 && Math.abs(e.clientY-y0) < 8) daX(e.clientX);
    trascina = false; inp.classList.remove('trascina');
  };
  inp.addEventListener('pointerup', fine);
  inp.addEventListener('pointercancel', fine);
}
/* Controllo segmentato: un cursore che scivola sotto l'opzione scelta */
function segPotenzia(seg){
  if(seg.dataset.segjs) return;
  if(!seg.querySelector(':scope > button')) return;
  seg.dataset.segjs = '1'; seg.classList.add('seg-js');
  const cur = document.createElement('span'); cur.className = 'seg-cursore'; seg.insertBefore(cur, seg.firstChild);
  let primo = true;
  const posiziona = ()=>{
    const on = seg.querySelector(':scope > button.on');
    if(!on || !on.offsetWidth){ cur.style.opacity = '0'; return; }
    if(primo){ cur.style.transition = 'none'; }
    cur.style.opacity = '1';
    cur.style.width = on.offsetWidth + 'px';
    cur.style.transform = `translateX(${on.offsetLeft}px)`;
    if(primo){ void cur.offsetWidth; cur.style.transition = ''; primo = false; }
  };
  new MutationObserver(posiziona).observe(seg, {attributes:true, subtree:true, attributeFilter:['class']});
  if(window.ResizeObserver) new ResizeObserver(posiziona).observe(seg);
  posiziona();
}
function potenziaTutto(radice){
  (radice||document).querySelectorAll('.sim-slider input[type=range]').forEach(slPotenzia);
  (radice||document).querySelectorAll('.seg').forEach(segPotenzia);
}
/* grafici: la linea si disegna e l'area compare, solo alla prima apertura della pagina */
function animaGrafici(){
  document.querySelectorAll('#app svg path').forEach(p=>{
    const f = p.getAttribute('fill'), sw = p.getAttribute('stroke'), dash = p.getAttribute('stroke-dasharray');
    if(f==='none' && sw && !dash && typeof p.getTotalLength==='function'){
      const len = p.getTotalLength(); if(!len) return;
      p.style.setProperty('--len', len); p.classList.add('disegna');
    } else if(f && f.startsWith('url(')) p.classList.add('appare');
  });
}
(function(){
  const _rendi = rendi;
  rendi = function(){
    _rendi.apply(this, arguments);
    const app = document.getElementById('app');
    app.classList.remove('entra'); void app.offsetWidth; app.classList.add('entra');
    clearTimeout(rendi._t); rendi._t = setTimeout(()=>app.classList.remove('entra'), 1000);
    potenziaTutto(app);
    requestAnimationFrame(animaGrafici);
  };
  /* parti del pannello ricostruite senza passare da rendi() (es. successione) */
  new MutationObserver(()=>potenziaTutto(document.getElementById('app'))).observe(document.getElementById('app'), {childList:true, subtree:true});
  potenziaTutto(document);
})();

/* piccolo lampo quando confermi un importo; rivelazione morbida dei campi che ricompaiono */
document.addEventListener('change', e=>{
  const c = e.target && e.target.closest && e.target.closest('.sim-pannello .sim-campo');
  if(c && e.target.matches('input[data-migliaia], input[type=text], input[type=number]')){ c.classList.remove('lampo'); void c.offsetWidth; c.classList.add('lampo'); }
}, true);
new MutationObserver(ms=>ms.forEach(m=>{
  const el = m.target;
  if(el.classList && el.classList.contains('sim-campo') && !el.classList.contains('chiuso') && (m.oldValue||'').includes('chiuso')){
    el.classList.remove('appena-aperto'); void el.offsetWidth; el.classList.add('appena-aperto');
  }
})).observe(document.getElementById('app'), {attributes:true, subtree:true, attributeFilter:['class'], attributeOldValue:true});
</script>
