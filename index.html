  .suc-pannello .suc-eti-riga{margin:0; flex-direction:column; align-items:flex-start; gap:4px}
  .suc-pannello .suc-eti-riga label{flex:none!important}
  @media(min-width:1100px){ .sim-grid:has(> .suc-pannello){grid-template-columns:360px minmax(0,1fr)} }
  .suc-pannello .suc-eti-riga label{font-size:15.5px; font-weight:500}
  .suc-pannello .suc-quota{font-size:12px; padding:3px 9px}

  /* Coniuge: Sì / No sulla stessa riga */
  .suc-pannello > .sim-campo:has(> .seg){display:grid; grid-template-columns:minmax(0,1fr) 132px; align-items:center; gap:10px}
  .suc-pannello > .sim-campo:has(> .seg) .suc-eti-riga{flex-wrap:wrap; row-gap:4px}
  .suc-pannello > .sim-campo > .seg{padding:3px; border-radius:12px}
  .suc-pannello > .sim-campo > .seg button{min-height:36px; font-size:14px; border-radius:9px}
  .suc-pannello > .sim-campo > .seg .seg-cursore{top:3px; bottom:3px; border-radius:9px}

  /* Figli, ascendenti, fratelli: stepper − n + */
  .suc-pannello > .sim-campo:has(.sl-stepper){display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; column-gap:10px}
  .suc-pannello > .sim-campo:has(.sl-stepper) .suc-eti-riga{flex-wrap:wrap; row-gap:4px}
  .suc-pannello > .sim-campo:has(.sl-stepper) > .sim-eco{grid-column:1 / -1; margin-top:4px}
  .sim-slider.sl-stepper{margin:0; gap:0; background:rgba(118,118,128,.12); border-radius:999px; padding:3px}
  .sim-slider.sl-stepper input[type=range]{display:none}
  .sim-slider.sl-stepper .sl-passo{order:1; width:38px; height:38px; background:transparent}
  .sim-slider.sl-stepper .sl-passo:last-of-type{order:3}
  .sim-slider.sl-stepper .val{order:2; display:inline-block!important; min-width:34px; text-align:center; font-size:19px; font-weight:700;
    font-variant-numeric:tabular-nums; transition:transform .35s var(--molla)}
  .sim-slider.sl-stepper .val.batti{transform:scale(1.25); color:var(--accento)}
  .sim-slider.sl-stepper .sl-passo:active{background:var(--carta)}

  /* sezioni richiudibili come righe raggruppate */
  .suc-pannello .suc-sez{background:var(--riga); border:none; border-radius:18px; padding:15px 16px; margin-top:12px; min-height:54px;
    font-size:15.5px; font-weight:600; letter-spacing:-.2px; text-transform:none; color:var(--testo);
    transition:border-radius .3s var(--dolce), background .2s}
  .suc-pannello .suc-sez:active{background:var(--riga-attiva)}
  .suc-pannello .suc-sez.aperta{border-radius:18px 18px 0 0}
  .suc-pannello .suc-sez-val{font-size:14px; font-weight:600; color:var(--accento)}
  .suc-pannello .suc-sez-chev{color:var(--testo-3); transition:transform .4s var(--molla)}
  .suc-pannello .suc-sez-corpo.aperta{background:var(--riga); border-radius:0 0 18px 18px; padding:2px 0 14px; position:relative;
    animation:svela .4s var(--dolce)}
  .suc-pannello .suc-sez-corpo.aperta::before{content:""; position:absolute; top:0; left:16px; right:16px; height:.5px; background:var(--riga-sep)}
  .suc-sez-corpo > *:not(.sim-campo){margin-left:14px; margin-right:14px}
  .suc-sez-corpo > .sim-eco:first-child, .suc-sez-corpo > div > .sim-eco:first-child{margin-top:12px!important}
  .suc-sez-corpo > .sim-campo{padding:12px 16px}
  .suc-sez-corpo > .sim-campo > label{font-size:15px; font-weight:500}
  .suc-sez-corpo > .sim-campo:has(> .sim-inp){display:grid; grid-template-columns:minmax(0,1fr) minmax(120px,48%); align-items:center; column-gap:12px}
  .suc-sez-corpo > .sim-campo:has(> .sim-inp) > .sim-freq, .suc-sez-corpo > .sim-campo:has(> .sim-inp) > .sim-eco{grid-column:1 / -1}
  .suc-sez-corpo #sucForfaitBlocco > .sim-campo{padding:12px 16px 12px 2px}

  /* coppie Investito / Montante: righe compatte con importo a destra */
  .suc-pannello .suc-coppia{margin:6px 0 0; gap:10px}
  .suc-pannello .suc-coppia > .suc-mini-eti{width:auto; flex:1; font-size:14px; font-weight:500; color:var(--muto)}
  .suc-pannello .suc-coppia > .sim-inp{flex:0 0 58%; background:rgba(118,118,128,.10); min-height:42px; flex-direction:row-reverse; padding:0 12px}
  .suc-pannello .suc-coppia > .sim-inp input{text-align:right; font-size:17px; color:var(--accento)}
  .suc-pannello .suc-coppia > .sim-inp .pre{font-size:15px}
  .suc-pannello .sim-inp:focus-within{background:var(--accento-tenue)!important; box-shadow:none}

  /* schede ripetibili: immobili, veicoli, beneficiari, polizze */
  .suc-pannello .suc-bene, .suc-pannello .suc-prodotto{background:rgba(118,118,128,.07); border:none; border-radius:16px; padding:14px; margin:12px 0 0;
    animation:svela .4s var(--dolce)}
  .suc-pannello .suc-prodotto.spento{background:rgba(118,118,128,.07)}
  .suc-pannello .suc-bene .sim-inp, .suc-pannello .suc-prodotto .sim-inp{background:var(--riga); min-height:44px}
  .suc-pannello .suc-bene select, .suc-pannello .suc-bene .suc-bene-testo, .suc-pannello .suc-ben-riga > input[type=text]{background-color:var(--riga); border:none; font-size:15px}
  .suc-pannello .suc-bene-nome{font-size:16px; font-weight:650; border-bottom-color:var(--riga-sep)}
  .suc-pannello .suc-mini-eti{font-size:12.5px; color:var(--muto); margin:12px 0 6px}
  .suc-pannello .suc-prod-nome{font-size:15px}
  .suc-pannello .suc-seg-si-no{width:120px}
  .suc-pannello .suc-seg-si-no .seg-cursore{top:2px; bottom:2px}

  /* pulsanti di aggiunta */
  .suc-pannello .suc-btn-agg{background:rgba(0,122,255,.08); color:var(--accento); border-radius:14px; min-height:46px; margin-top:12px; box-shadow:none; font-weight:650}
  .suc-pannello .suc-add{border:none; background:var(--riga); color:var(--accento); box-shadow:var(--ombra); font-size:13.5px}
  .suc-pannello .suc-sez-corpo .suc-add{background:rgba(0,122,255,.08); box-shadow:none}
  .suc-pannello .suc-aggiungi{margin:12px 0 2px}
  .suc-pannello .suc-quota-riga{background:var(--riga); padding:10px 16px; margin:0; border-radius:0}
  .suc-pannello .sim-h2 + .sim-eco + .suc-quota-riga{border-radius:18px 18px 0 0}
  .suc-pannello .suc-quota-hint{background:var(--riga); margin:0; padding:0 16px 8px}
  @media(hover:hover){ .suc-pannello .suc-sez:hover{background:var(--riga-attiva)} .suc-pannello .suc-add:hover{background:var(--accento-tenue)} }
</style>

<script>
/* ================= BASE APP (stato, persistenza, helper) ================= */
let db = { simulazioni: [] };
try{
  const raw = localStorage.getItem('simfin_db');
  if(raw){ const o = JSON.parse(raw); if(o && Array.isArray(o.simulazioni)) db = o; }
}catch(e){}
function salva(){ try{ localStorage.setItem('simfin_db', JSON.stringify(db)); return true; }catch(e){ return false; } }
function nuovoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Campi numerici in euro (o in unità intere): si scrive 150000 e si vede 150.000.
   Il campo è type="text" con inputmode="numeric" (tastiera numerica) e l'attributo
   data-migliaia; la formattazione avviene mentre si scrive, il valore si rilegge con
   numIT(). fmtMigliaia() serve a scrivere il valore iniziale nel campo. */
function numIT(v){ if(typeof v==='number') return v; const s = String(v==null?'':v).replace(/\D/g,''); return s ? parseInt(s, 10) : NaN; }
/* Numero all'italiana con il punto delle migliaia SEMPRE: toLocaleString('it-IT') lo omette
   sotto le cinque cifre (5000 e non 5.000), qui invece 1.000 e 10.000. dec = decimali fissi. */
function itNum(n, dec){
  n = Number(n); if(!isFinite(n)) n = 0; dec = dec || 0;
  const [i, d] = Math.abs(n).toFixed(dec).split('.');
  const neg = n < 0 && Number(Math.abs(n).toFixed(dec)) > 0;
  return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (dec > 0 ? ',' + d : '');
}
function fmtMigliaia(n){ n = typeof n==='number' ? n : numIT(n); return isFinite(n) ? itNum(n, 0) : ''; }
document.addEventListener('focusin', e=>{ const el = e.target; if(el && el.matches && el.matches('input[data-migliaia]')) el.dataset.prev = el.value; }, true);
document.addEventListener('input', e=>{
  const el = e.target;
  if(!el || !el.matches || !el.matches('input[data-migliaia]')) return;
  let raw = el.value, caret = el.selectionStart!=null ? el.selectionStart : raw.length;
  const prev = el.dataset.prev != null ? el.dataset.prev : raw;
  const cifreDi = s => s.replace(/\D/g,'').length;
  /* cancellando un punto le cifre non cambiano e il punto ricomparirebbe: tolgo anche la cifra accanto */
  if(cifreDi(raw)===cifreDi(prev) && raw.length < prev.length){
    if(e.inputType==='deleteContentBackward' && caret>0){ raw = raw.slice(0, caret-1) + raw.slice(caret); caret--; }
    else if(e.inputType==='deleteContentForward' && caret < raw.length){ raw = raw.slice(0, caret) + raw.slice(caret+1); }
  }
  const cifrePrima = cifreDi(raw.slice(0, caret));
  const cifre = raw.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  const nuovo = cifre ? itNum(parseInt(cifre, 10), 0) : '';
  el.value = nuovo; el.dataset.prev = nuovo;
  let pos = 0, c = 0;
  while(pos < nuovo.length && c < cifrePrima){ if(/\d/.test(nuovo[pos])) c++; pos++; }
  try{ el.setSelectionRange(pos, pos); }catch(_){}
}, true);

let vistaCorrente = 'simulatore';
let clienteAperto = null;

function ico(name, size){
  size = size||18;
  const p = {
    check:'<path d="m5 12.5 4.5 4.5L19 6.5"/>',
    trash:'<path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.4h7a1.5 1.5 0 0 0 1.5-1.4L18 7"/>',
    chevron:'<path d="m9 6 6 6-6 6"/>',
    'chevron-left':'<path d="m15 6-6 6 6 6"/>',
    save:'<path d="M5 4.5h11l3 3V19a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6a1.5 1.5 0 0 1 1-1.5z"/><path d="M8 4.5v4h6v-4M8 20v-5h8v5"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.5 4.5l1.8 1.8M17.7 17.7l1.8 1.8M2.5 12H5M19 12h2.5M4.5 19.5l1.8-1.8M17.7 6.3l1.8-1.8"/>',
    moon:'<path d="M20 13.5A8 8 0 1 1 10.5 4a6.2 6.2 0 0 0 9.5 9.5z"/>',
    chart:'<path d="M4 4v15.5h16.5"/><path d="m7.5 14.5 4-4.5 3.2 2.8 5-6"/>',
    print:'<path d="M7 8V3.5h10V8"/><rect x="7" y="15" width="10" height="5.5" rx="1"/><path d="M7 17.5H4.5A1.5 1.5 0 0 1 3 16V9.5A1.5 1.5 0 0 1 4.5 8h15A1.5 1.5 0 0 1 21 9.5V16a1.5 1.5 0 0 1-1.5 1.5H17"/>',
    share:'<path d="M12 3.5v11M8.5 6.5 12 3l3.5 3.5"/><path d="M7 10.5H5.5A1.5 1.5 0 0 0 4 12v7a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 19v-7a1.5 1.5 0 0 0-1.5-1.5H17"/>',
    expand:'<path d="M9 4.5H4.5V9M15 4.5h4.5V9M9 19.5H4.5V15M15 19.5h4.5V15"/>',
    flag:'<path d="M5.5 21V4"/><path d="M5.5 4.5h11.5l-2.6 3.7 2.6 3.8H5.5"/>',
    pin:'<path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/>',
    undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
    copy:'<rect x="9" y="9" width="11.5" height="11.5" rx="2"/><path d="M5.5 15H4.8A1.8 1.8 0 0 1 3 13.2V4.8A1.8 1.8 0 0 1 4.8 3h8.4A1.8 1.8 0 0 1 15 4.8v.7"/>'
  }[name] || '';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;vertical-align:middle">${p}</svg>`;
}
function icoTit(name){ return ico(name, 18); }
function testata(titolo, sotto, azioni){
  return `<div class="testata">
    <div><h1>${titolo}</h1>${sotto?`<div class="sotto">${sotto}</div>`:''}</div>
    <span class="spazio"></span>${azioni||''}
  </div>`;
}
function apriFinestra(html){
  const f = document.getElementById('finestra');
  f.innerHTML = html;
  f.scrollTop = 0;
  document.getElementById('velo').classList.add('aperto');
}
function chiudiFinestra(){ document.getElementById('velo').classList.remove('aperto'); }
document.getElementById('velo').addEventListener('click', e=>{ if(e.target===document.getElementById('velo')) chiudiFinestra(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') chiudiFinestra(); });

let _toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('mostra');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove('mostra'), 2400);
}

/* ---- tema chiaro/scuro ---- */
function temaApplica(t){
  if(t==='scuro') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  const scuro = t==='scuro';
  const el = document.getElementById('temaIcoSole');
  if(el) el.outerHTML = ico(scuro?'sun':'moon',19).replace('<svg', '<svg id="temaIcoSole"');
  const tx = document.getElementById('temaTesto');
  if(tx) tx.textContent = scuro ? 'Tema chiaro' : 'Tema scuro';
}
function temaCorrente(){
  const s = localStorage.getItem('simfin_tema');
  if(s==='scuro' || s==='chiaro') return s;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'scuro' : 'chiaro';
}
function temaToggle(){
  const nuovo = temaCorrente()==='scuro' ? 'chiaro' : 'scuro';
  try{ localStorage.setItem('simfin_tema', nuovo); }catch(e){}
  temaApplica(nuovo);
}

/* ---- menu laterale comprimibile ---- */
function sidebarStato(){ return localStorage.getItem('simfin_sidebar')==='chiusa' ? 'chiusa' : 'aperta'; }
function sidebarApplica(s){ document.body.classList.toggle('sidebar-chiusa', s==='chiusa'); }
function sidebarToggle(){
  const nuovo = sidebarStato()==='chiusa' ? 'aperta' : 'chiusa';
  try{ localStorage.setItem('simfin_sidebar', nuovo); }catch(e){}
  sidebarApplica(nuovo);
}

/* ---- routing ---- */
function vai(vista){
  if(vista==='simulatore') simPagina = null;
  vistaCorrente = vista;
  rendi();
  window.scrollTo(0,0);
}
function aggiornaContatori(){
  const c = document.getElementById('cntSalvate');
  if(c) c.textContent = db.simulazioni.length || '';
}
function rendi(){
  document.getElementById('navSimulatore').classList.toggle('attiva', vistaCorrente==='simulatore');
  document.getElementById('navSalvate').classList.toggle('attiva', vistaCorrente==='salvate');
  document.getElementById('navDati').classList.toggle('attiva', vistaCorrente==='dati');
  const app = document.getElementById('app');
  if(vistaCorrente==='salvate'){ app.innerHTML = vistaSalvate(); }
  else if(vistaCorrente==='dati'){ app.innerHTML = vistaDati(); if(titoloAperto) initTitolo(); else initDati(); }
  else { app.innerHTML = vistaSimulatore(); initSimulatore(); }
  document.body.classList.toggle('sim-aperto', vistaCorrente==='simulatore' && !!simPagina);
  simSchedaApplica();
  if(vistaCorrente!=='simulatore' || !simPagina) document.body.classList.remove('presentazione');
  aggiornaContatori();
}
/* Schede «Parametri | Entrambi | Risultati»: contano solo a colonna singola (iPad portrait,
   Split View), dove le due colonne non stanno affiancate. In landscape il CSS le mostra
   entrambe. «Entrambi» le mette una sotto l'altra nella stessa pagina. */
let simSchedaCorrente = 'parametri';
function simScheda(s){
  simSchedaCorrente = (s==='risultati' || s==='entrambi') ? s : 'parametri';
  simSchedaApplica();

  const f = {accumulo:'simAggiorna', decumulo:'decAggiorna', universita:'uniAggiorna', mutuo:'mutAggiorna', successione:'sucAggiorna'}[simPagina];
  if(f && typeof window[f]==='function' && matchMedia('(max-width:860px)').matches) window[f]();

  window.scrollTo(0, 0);

function simSchedaApplica(){
  const c = simSchedaCorrente;

  [['schedaPar','parametri'], ['schedaTutto','entrambi'], ['schedaRis','risultati']].forEach(([id, k])=>{

/* Count-up: anima una cifra dal valore precedente al nuovo (~240ms) */
function animaCifra(el, valore, formatta){
  if(!el) return;
  if(!isFinite(valore)){ el.textContent = formatta(valore); return; }
  const da = parseFloat(el.dataset.v);
  el.dataset.v = valore;
  if(!isFinite(da) || da===valore){ el.textContent = formatta(valore); return; }
  const t0 = performance.now(), durata = 240;
  const passo = t => {
    const p = Math.min(1, (t - t0)/durata), e = 1 - Math.pow(1-p, 3);
    el.textContent = formatta(da + (valore-da)*e);
    if(p<1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function confPct(v){ return (isFinite(v)?v:0).toLocaleString('it-IT', {maximumFractionDigits:2}) + '%'; }
/* migliora: 'giu' = scendere è un miglioramento (verde), 'su' = salire lo è; assente = differenza neutra */
function confDiffNum(vecchio, nuovo, fmt, migliora){
  const dlt = nuovo - vecchio;
  const testo = fmt(Math.abs(dlt));
  if(dlt===0 || testo===fmt(0)) return `<span class="conf-diff-muto">uguale</span>`;
  const segno = dlt>0 ? '+ ' : '− ';
  if(!migliora) return `<span class="conf-diff-neutro">${segno}${testo}</span>`;
  const meglio = migliora==='giu' ? dlt<0 : dlt>0;
  return `<span class="${meglio ? 'conf-diff-verde' : 'conf-diff-rosso'}">${segno}${testo}</span>`;
}
function confDiffTesto(vecchio, nuovo, parola){
  if(String(vecchio)===String(nuovo)) return `<span class="conf-diff-muto">uguale</span>`;
  return `<span class="conf-diff-neutro">${parola||'cambiato'}</span>`;
}
function confNonConfrontabile(testo){ return `<span class="conf-diff-muto">${testo||'non confrontabile'}</span>`; }
/* Differenza fra due durate del decumulo ({perpetuo, oltre, nPeriodi, freq}): durare di più è verde */
function confDiffDurata(vecchio, nuovo){
  const anni = x => (x.perpetuo || x.oltre) ? Infinity : x.nPeriodi / x.freq;
  const a1 = anni(vecchio), a2 = anni(nuovo);
  if(a1===Infinity && a2===Infinity) return `<span class="conf-diff-muto">uguale</span>`;
  if(a2===Infinity) return `<span class="conf-diff-verde">migliora</span>`;
  if(a1===Infinity) return `<span class="conf-diff-rosso">peggiora</span>`;
  const mesi = Math.round((a2 - a1) * 12);
  if(mesi===0) return `<span class="conf-diff-muto">uguale</span>`;
  const abs = Math.abs(mesi), aa = Math.floor(abs/12), mm = abs%12;
  const pezzi = [];
  if(aa>0) pezzi.push(aa + (aa===1 ? ' anno' : ' anni'));
  if(mm>0) pezzi.push(mm + (mm===1 ? ' mese' : ' mesi'));
  const testo = (mesi>0 ? '+ ' : '− ') + pezzi.join(' e ');
  return `<span class="${mesi>0 ? 'conf-diff-verde' : 'conf-diff-rosso'}">${testo}</span>`;
}

function initSimulatore(){
  _tabPend = null;   // la tabella rimandata appartiene alla pagina precedente
  /* Un solo aggiornamento per frame (rAF): gli slider restano fluidi anche su iPad.
     'change' serve alle <select>: su Safari iOS < 15.4 l'evento 'input' non scatta. */
  let _raf = 0;
  const ascolta = (id, fn)=>{
    const el = document.getElementById(id); if(!el) return;
    const th = ()=>{ if(_raf) return; _raf = requestAnimationFrame(()=>{ _raf = 0; if(document.getElementById(id)) fn(); }); };
    el.addEventListener('input', th);
    if(el.tagName==='SELECT' || el.type==='date') el.addEventListener('change', th);
  };
  if(simPagina==='accumulo'){
    ['simCapitale','simObiettivo','simRata','simAnni','simTasso','simInfl'].forEach(id=>ascolta(id, ()=>{ simLeggiInput(); simAggiorna(); }));
    simWireChart();
    simAggiorna();
  } else if(simPagina==='decumulo'){
    ['decCapitale','decNecessita','decAnni','decTasso'].forEach(id=>ascolta(id, ()=>{ decLeggiInput(); decAggiorna(); }));
    simWireChart();
    decAggiorna();
  } else if(simPagina==='universita'){
    ['uniStudente','uniIsee','uniRetta','uniIndirizzo','uniCorso','uniAnniMancanti','uniCitta','uniKm','uniInflazione']
      .forEach(id=>ascolta(id, ()=>{ uniLeggiInput(); uniAggiorna(); }));
    uniAggiorna();
  } else if(simPagina==='mutuo'){
    ['mutImporto','mutTasso','mutAnni','mutInizio'].forEach(id=>ascolta(id, ()=>{ mutLeggiInput(); mutAggiorna(); }));
    mutAggiorna();
  } else if(simPagina==='successione'){
    ['sucLiquidita','sucTitoliInvestito','sucTitoli','sucTitoliStatoInvestito','sucTitoliStato',
     'sucPartecipazioni','sucCrediti']
      .forEach(id=>ascolta(id, ()=>{ sucLeggiInput(); sucAggiorna(); }));
    ['sucFigli','sucAscendenti','sucFratelli'].forEach(id=>ascolta(id, sucCambiaFamiglia));
    sucRenderPannello();
    sucAggiorna();
  }
}
function simWireChart(){
  const box = document.getElementById('simChartBox');
  if(!box) return;
  box.addEventListener('mousemove', e=>simHover(e.clientX));
  box.addEventListener('mouseleave', simNascondiTip);
  box.addEventListener('touchmove', e=>{ if(e.touches[0]) simHover(e.touches[0].clientX); }, {passive:true});
  box.addEventListener('touchstart', e=>{ if(e.touches[0]) simHover(e.touches[0].clientX); }, {passive:true});
  box.addEventListener('touchend', ()=>setTimeout(simNascondiTip, 3000));
}

/* Matematica: PIC = valore attuale dell'obiettivo; PAC = rata da formula della rendita,
   con tasso periodico i = (1+r)^(1/k)-1 coerente con la capitalizzazione annua.
   Se il regime NON è lordo, l'obiettivo è inteso al NETTO: si calcola l'importo/la rata
   lordi in modo che, tolta l'imposta sui guadagni (aliq), il montante netto = obiettivo.
   Netto = montante − aliq·(montante − versato). Imponendo Netto = obiettivo si ricava
   il fattore di "lordizzazione" (1−aliq) sui guadagni. In modalità «rata» non c'è obiettivo
   da centrare, quindi nessuna lordizzazione (aliq=0 nel calcolo). */
function simCalcola(){
  const s = simStato;
  const r = s.tasso/100;
  const aliq = s.modo==='rata' ? 0 : (FISC_ALIQ[s.fiscale] || 0);
  const g = Math.pow(1+r, s.anni);
  // PIC: lump U con U·[g·(1−aliq)+aliq] = obiettivo  →  al netto dell'imposta il montante = obiettivo
  const fatPic = g*(1-aliq) + aliq;
  const unica = fatPic===0 ? s.obiettivo : s.obiettivo / fatPic;
  const extra = Math.max(0, unica - s.capitale);
  let rata = 0, periodi = [];
  if(s.modo==='pic'){
    const investito = s.capitale + extra;
    for(let a=0; a<=s.anni; a++) periodi.push({t:a, saldo:investito*Math.pow(1+r, a)});
  } else {
    const k = s.freq, i = Math.pow(1+r, 1/k)-1, n = s.anni*k;
    if(s.modo==='rata') rata = s.rata;              // la rata la sceglie l'utente; calcoliamo il capitale finale
    else {
      // netto = [C·A + rata·B]·(1−aliq) + aliq·[C + rata·n] = obiettivo, con A=(1+i)^n, B=(A−1)/i
      const A = Math.pow(1+i, n), B = (i===0 ? n : (A-1)/i);
      const den = B*(1-aliq) + aliq*n;
      rata = den===0 ? 0 : Math.max(0, (s.obiettivo - s.capitale*(A*(1-aliq)+aliq)) / den);
    }
    let saldo = s.capitale;
    periodi.push({t:0, saldo});
    for(let p=1; p<=n; p++){
      const interesse = saldo*i;
      saldo += interesse + rata;
      periodi.push({t:p/k, saldo, versamento:rata, interesse, indice:p});
    }
  }
  return {unica, extra, rata, periodi, anni:s.anni, obiettivo:s.obiettivo, capitale:s.capitale, aliq};
}
function simAggiorna(){
  if(simPagina!=='accumulo' || !document.getElementById('simChart')) return;
  const s = simStato;
  document.getElementById('simAnniVal').textContent = simAnniTesto(s.anni);
  document.getElementById('simTassoVal').textContent = simPct(s.tasso)+'%';
  const inflVal = document.getElementById('simInflVal'); if(inflVal) inflVal.textContent = simPct(s.inflazione ?? 2)+'%';
  document.getElementById('simCapitaleEco').textContent = '';
  document.getElementById('simObiettivoEco').textContent = '';
  const rataEco = document.getElementById('simRataEco');
  if(rataEco) rataEco.textContent = 'a ' + SIM_FREQ_PAROLA[s.freq];
  const obLab = document.getElementById('simObiettivoLabel');
  const aliqLab = FISC_ALIQ[s.fiscale] || 0;
  if(obLab) obLab.textContent = s.modo==='rata' ? 'Obiettivo (facoltativo)' : (aliqLab>0 ? 'Obiettivo futuro (netto)' : 'Obiettivo futuro');
  const strDesc = document.getElementById('simStrategiaDesc');
  if(strDesc) strDesc.textContent = s.modo==='pic'
    ? 'Investi una cifra sola oggi e la lasci crescere fino all’obiettivo.'
    : s.modo==='pac'
      ? 'Scegli l’obiettivo: calcolo quanto versare a ogni scadenza per raggiungerlo.'
      : 'Scegli tu la rata: calcolo il capitale che avrai alla fine.';
  document.getElementById('simHeroTag').textContent = s.modo==='pic' ? 'Unica soluzione' : "Piano d'accumulo · " + SIM_FREQ_NOMI[s.freq];
  const d = simCalcola();
  const finale = d.periodi[d.periodi.length-1].saldo;
  const traAnni = 'tra ' + simAnniTesto(s.anni);
  const versato = s.modo==='pic' ? 0 : d.rata * (d.periodi.length-1);
  const investito = s.modo==='pic' ? s.capitale + d.extra : s.capitale + versato;
  let risEt = '', risVal = 0, nota = '';
  if(s.modo==='pic'){
    if(d.extra===0 && s.capitale>0){
      risEt = 'Non serve investire altro'; risVal = 0;
      nota = `Il capitale che hai oggi (<b>${simEuro(s.capitale)}</b>) è già sufficiente: lasciato investito al ${simPct(s.tasso)}% annuo arriva a <b>${simEuro(finale)}</b> ${traAnni}, raggiungendo l'obiettivo di <b>${simEuro(s.obiettivo)}</b>.`;
    } else {
      risEt = s.capitale>0 ? "Devi aggiungere oggi, in un'unica soluzione" : "Devi investire oggi, in un'unica soluzione";
      risVal = s.capitale>0 ? d.extra : d.unica;
      nota = s.capitale>0
        ? `Ai <b>${simEuro(s.capitale)}</b> che hai già aggiungi oggi <b>${simEuro(d.extra)}</b>: in tutto investi <b>${simEuro(d.unica)}</b>, che al ${simPct(s.tasso)}% annuo diventano <b>${simEuro(s.obiettivo)}</b> ${traAnni}.`
        : `Versando questa cifra oggi e lasciandola investita al ${simPct(s.tasso)}% annuo, raggiungi <b>${simEuro(s.obiettivo)}</b> ${traAnni}.`;
    }
    document.getElementById('simChipVersatoEt').textContent = 'Versamenti aggiuntivi';
  } else if(s.modo==='pac'){
    if(d.rata===0 && s.capitale>0){
      risEt = 'Non servono versamenti'; risVal = 0;
      nota = `Partendo da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, raggiungi <b>${simEuro(s.obiettivo)}</b> ${traAnni} senza versamenti aggiuntivi: il capitale cresce da solo fino a <b>${simEuro(finale)}</b>.`;
    } else {
      risEt = 'Devi versare ogni ' + SIM_FREQ_PAROLA[s.freq]; risVal = d.rata;
      nota = s.capitale>0
        ? `Partendo da <b>${simEuro(s.capitale)}</b> già investiti, con un versamento ${SIM_FREQ_NOMI[s.freq].toLowerCase()} di questa entità raggiungi <b>${simEuro(s.obiettivo)}</b> ${traAnni} al ${simPct(s.tasso)}% annuo.`
        : `Versando questa cifra ogni ${SIM_FREQ_PAROLA[s.freq]} (${SIM_FREQ_NOMI[s.freq].toLowerCase()}), senza capitale iniziale, raggiungi <b>${simEuro(s.obiettivo)}</b> ${traAnni}.`;
    }
    document.getElementById('simChipVersatoEt').textContent = 'Totale versato';
  } else {
    risEt = 'Il capitale che avrai ' + traAnni; risVal = finale;
    nota = s.rata>0
      ? `Versando <b>${simEuro(s.rata)}</b> ${SIM_FREQ_NOMI[s.freq].toLowerCase()}${s.capitale>0?` e partendo da <b>${simEuro(s.capitale)}</b>`:''} al ${simPct(s.tasso)}% annuo, ${traAnni} avrai <b>${simEuro(finale)}</b>.`
      : `Senza versamenti, il solo capitale di <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo ${traAnni} diventa <b>${simEuro(finale)}</b>.`;
    if(s.obiettivo>0) nota += finale>=s.obiettivo
      ? ` ✓ Superi l’obiettivo di <b>${simEuro(s.obiettivo)}</b> (${simEuro(finale-s.obiettivo)} in più).`
      : ` Ti fermi <b>${simEuro(s.obiettivo-finale)}</b> sotto l’obiettivo di <b>${simEuro(s.obiettivo)}</b>.`;
    document.getElementById('simChipVersatoEt').textContent = 'Totale versato';
  }
  /* imposta stimata sul guadagno a scadenza (semplificata) */
  const aliq = FISC_ALIQ[s.fiscale] || 0;
  const interessiLordi = Math.max(0, finale - investito);
  const imposta = interessiLordi * aliq;
  if(aliq>0){
    if(s.modo==='rata')
      nota += ` Al netto dell'imposta del ${simPct(aliq*100)}% sui guadagni (<b>−${simEuro(imposta)}</b>), il capitale finale equivale a <b>${simEuro(finale - imposta)}</b>.`;
    else
      nota += ` L'importo qui sopra è già calcolato al netto del fisco: il saldo lordo arriva a <b>${simEuro(finale)}</b>, l'imposta del ${simPct(aliq*100)}% sui guadagni (<b>−${simEuro(imposta)}</b>) lo riporta a <b>${simEuro(finale - imposta)}</b>, cioè il tuo obiettivo netto.`;
  }
  document.getElementById('simRisEt').textContent = risEt;
  animaCifra(document.getElementById('simRisCifra'), risVal, simEuro);
  document.getElementById('simRisNota').innerHTML = nota;
  /* Totale versato = TUTTO il denaro messo da te: capitale iniziale + versamenti (o importo unico) */
  const nVers = s.modo==='pic' ? 0 : d.periodi.length-1;
  const interessi = finale - investito;
  const setTxt = (id, t)=>{ const el = document.getElementById(id); if(el) el.innerHTML = t; };
  document.getElementById('simChipVersatoEt').textContent = s.modo==='pic' ? 'Totale investito' : 'Totale versato';
  animaCifra(document.getElementById('simChipVersato'), investito, simEuro);
  if(s.modo==='pic'){
    setTxt('simChipVersatoSub', d.extra>0 && s.capitale>0
      ? `${simEuro(s.capitale)} che hai già + ${simEuro(d.extra)} da aggiungere oggi`
      : (d.extra>0 ? 'versati tutti oggi, in un’unica soluzione' : 'il capitale che hai già, nessuna aggiunta'));
  } else {
    setTxt('simChipVersatoSub', nVers>0 && d.rata>0
      ? `${s.capitale>0 ? simEuro(s.capitale)+' oggi + ' : ''}${itNum(nVers,0)} versamenti da ${simEuro2(d.rata).replace(',00','')}`
      : (s.capitale>0 ? 'solo il capitale iniziale, nessun versamento' : 'nessun versamento'));
  }
  animaCifra(document.getElementById('simChipInteressi'), interessi, simEuro);
  setTxt('simChipInteressiSub', investito>0 ? `+${simPct(interessi/investito*100)}% su quanto versato` : '');
  document.getElementById('simChipFinaleEt').textContent = aliq>0 ? 'Capitale finale lordo' : 'Capitale finale';
  animaCifra(document.getElementById('simChipFinale'), finale, simEuro);
  setTxt('simChipFinaleSub', 'tra ' + simAnniTesto(s.anni));
  const fiscBox = document.getElementById('simChipFiscBox');
  if(fiscBox){
    fiscBox.style.display = aliq>0 ? '' : 'none';
    if(aliq>0){
      animaCifra(document.getElementById('simChipFisc'), imposta, simEuro);
      setTxt('simChipFiscSub', `netto: <b>${simEuro(finale - imposta)}</b>`);
    }
  }
  /* composizione del capitale finale: capitale iniziale / versamenti / interessi netti / imposta */
  const capIniz = s.modo==='pic' ? investito : s.capitale;
  const versPer = s.modo==='pic' ? 0 : d.rata * nVers;
  const parti = [
    {n: s.modo==='pic' ? 'Capitale che hai già' : 'Capitale iniziale', v: s.modo==='pic' ? Math.min(s.capitale, capIniz) : capIniz, c:'var(--accento)'},
    {n: s.modo==='pic' ? 'Aggiunto oggi' : 'Versamenti periodici', v: s.modo==='pic' ? d.extra : versPer, c:'#5ac8fa'},
    {n: aliq>0 ? 'Interessi netti' : 'Interessi maturati', v:Math.max(0, interessi - imposta), c:'var(--verde)'},
    {n:'Imposta sui guadagni', v:imposta, c:'var(--arancio)'}
  ].filter(x=>x.v>0.5);
  const totComp = parti.reduce((a,x)=>a+x.v, 0) || 1;
  const compEl = document.getElementById('simComp');
  if(compEl) compEl.innerHTML = parti.map(x=>`<span style="width:${(x.v/totComp*100).toFixed(2)}%;background:${x.c}"></span>`).join('');
  const legEl = document.getElementById('simCompLeg');
  if(legEl) legEl.innerHTML = parti.map(x=>`<div class="r"><i class="pallino" style="background:${x.c}"></i><span>${x.n}</span><span class="imp">${simEuro(x.v)}</span><span class="pct">${simPct(x.v/totComp*100)}%</span></div>`).join('');
  /* punti chiave */
  const punti = [];
  if(investito>0 && finale>0) punti.push(['Ogni euro versato diventa', `${itNum(finale/investito, 2)} €`, aliq>0 ? `al lordo; al netto dell’imposta ${itNum((finale-imposta)/investito, 2)} €` : `in ${simAnniTesto(s.anni)} al ${simPct(s.tasso)}% annuo`]);
  const infl = (s.inflazione ?? 2)/100;
  if(finale>0){
    const netto = finale - imposta;
    const reale = netto / Math.pow(1+infl, s.anni);
    punti.push(['Potere d’acquisto a oggi', simEuro(reale), infl>0 ? `${simEuro(netto)}${aliq>0?' netti':''} tra ${simAnniTesto(s.anni)} valgono come ${simEuro(reale)} di oggi (inflazione ${simPct(infl*100)}% annuo)` : 'inflazione impostata a zero']);
  }
  if(s.modo!=='pic' && nVers>0){
    /* primo anno in cui gli interessi dell'anno superano i versamenti dell'anno */
    const k = s.freq; let annoSorpasso = 0;
    for(let a=1; a<=s.anni; a++){
      let intA = 0; for(let p=(a-1)*k+1; p<=a*k; p++) intA += d.periodi[p].interesse;
      if(intA > d.rata*k){ annoSorpasso = a; break; }
    }
    punti.push(['Quando il rendimento lavora più di te', annoSorpasso ? `Anno ${annoSorpasso}` : 'Non nell’orizzonte scelto',
      annoSorpasso ? 'da quell’anno gli interessi annui superano i versamenti annui' : `gli interessi annui restano sotto i ${simEuro(d.rata*k)} versati ogni anno`]);
  }
  if(s.obiettivo>0){
    const nettoDi = p => p.saldo - aliq*Math.max(0, p.saldo - (s.modo==='pic' ? investito : s.capitale + d.rata*(p.indice||0)));
    const hit = d.periodi.find(p=>nettoDi(p) >= s.obiettivo - 0.5);
    if(hit){
      let aa = Math.floor(hit.t + 1e-9), mm = Math.round((hit.t - aa)*12); if(mm===12){ aa++; mm=0; }
      const quando = hit.t===0 ? 'Già oggi' : [aa ? simAnniTesto(aa) : '', mm ? mm + (mm===1?' mese':' mesi') : ''].filter(Boolean).join(' e ');
      punti.push(['Obiettivo raggiunto', quando, `soglia di ${simEuro(s.obiettivo)}${aliq>0?' netti':''}`]);
    } else if(s.modo==='rata'){
      const k = s.freq, r = s.tasso/100, i = Math.pow(1+r, 1/k)-1, n = s.anni*k;
      const A = Math.pow(1+i, n), B = i===0 ? n : (A-1)/i, al = FISC_ALIQ[s.fiscale]||0;
      const serve = Math.max(0, (s.obiettivo - s.capitale*(A*(1-al)+al)) / (B*(1-al) + al*n));
      punti.push(['Per centrare l’obiettivo', `${simEuro(Math.ceil(serve))} a ${SIM_FREQ_PAROLA[s.freq]}`, `invece di ${simEuro(s.rata)}: ${simEuro(Math.max(0, Math.ceil(serve) - s.rata))} in più a ogni versamento`]);
    }
  }
  const puntiEl = document.getElementById('simPunti');
  if(puntiEl) puntiEl.innerHTML = punti.map(([k,v,n])=>`<div class="sim-punto"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('');
  risBarAggiorna(risEt, simEuro(risVal), 'var(--accento)');
  /* confronto con lo scenario bloccato: linea tratteggiata sul grafico + tabella Bloccato/Adesso/Differenza */
  d.confronto = simScenario ? simScenario.periodi : null;
  const leg = document.getElementById('simLegConfronto');
  if(leg) leg.style.display = simScenario ? '' : 'none';
  confAggiornaSblocca(!!simScenario);
  const confBox = document.getElementById('confBox');
  if(confBox){
    if(simScenario && simScenario.stato){
      const b = simScenario, bs = b.stato;
      const MODI = {pic:'Unica soluzione', pac:'Con obiettivo', rata:'Con rata'};
      const righe = [
        {eti:'Strategia', blocco:MODI[bs.modo], ora:MODI[s.modo], diff:confDiffTesto(bs.modo, s.modo, 'cambiata')}
      ];
      if(bs.modo!=='pic' || s.modo!=='pic'){
        const fq = x => x.modo==='pic' ? '—' : SIM_FREQ_NOMI[x.freq];
        righe.push({eti:'Frequenza versamenti', blocco:fq(bs), ora:fq(s), diff:confDiffTesto(fq(bs), fq(s), 'cambiata')});
      }
      righe.push({eti:'Capitale che hai oggi', blocco:simEuro(bs.capitale), ora:simEuro(s.capitale), diff:confDiffNum(bs.capitale, s.capitale, simEuro)});
      righe.push({eti:'Obiettivo', blocco:bs.obiettivo>0?simEuro(bs.obiettivo):'—', ora:s.obiettivo>0?simEuro(s.obiettivo):'—', diff:confDiffNum(bs.obiettivo, s.obiettivo, simEuro)});
      if(bs.modo==='rata' && s.modo==='rata')
        righe.push({eti:'Versamento scelto', blocco:simEuro(bs.rata), ora:simEuro(s.rata), diff:confDiffNum(bs.rata, s.rata, simEuro)});
      righe.push({eti:'Orizzonte', blocco:simAnniTesto(bs.anni), ora:simAnniTesto(s.anni), diff:confDiffNum(bs.anni, s.anni, v=>simAnniTesto(Math.round(v)))});
      righe.push({eti:'Rendimento atteso', blocco:confPct(bs.tasso), ora:confPct(s.tasso), diff:confDiffNum(bs.tasso, s.tasso, confPct)});
      righe.push({eti:'Regime fiscale', blocco:FISC_NOMI[bs.fiscale], ora:FISC_NOMI[s.fiscale], diff:confDiffTesto(bs.fiscale, s.fiscale, 'cambiato')});
      if(bs.modo==='pic' && s.modo==='pic')
        righe.push({eti:'Da versare oggi', forte:true, blocco:simEuro(b.extra), ora:simEuro(d.extra), diff:confDiffNum(b.extra, d.extra, simEuro, 'giu')});
      if(bs.modo==='pac' && s.modo==='pac')
        righe.push({eti:'Versamento richiesto', forte:true,
          blocco:`${simEuro(b.rataCalc)} ${SIM_FREQ_NOMI[bs.freq].toLowerCase()}`,
          ora:`${simEuro(d.rata)} ${SIM_FREQ_NOMI[s.freq].toLowerCase()}`,
          diff: bs.freq===s.freq ? confDiffNum(b.rataCalc, d.rata, simEuro, 'giu') : confNonConfrontabile('frequenze diverse')});
      righe.push({eti:'Capitale finale', forte:true, blocco:simEuro(b.finale), ora:simEuro(finale), diff:confDiffNum(b.finale, finale, simEuro, 'su')});
      righe.push({eti:'Totale investito', blocco:simEuro(b.investito), ora:simEuro(investito), diff:confDiffNum(b.investito, investito, simEuro)});
      righe.push({eti:'Interessi maturati', blocco:simEuro(b.finale - b.investito), ora:simEuro(finale - investito), diff:confDiffNum(b.finale - b.investito, finale - investito, simEuro, 'su')});
      confBox.innerHTML = confCardHtml('accumulo', righe);
    } else confBox.innerHTML = '';
  }
  simDisegnaGrafico(d);
  simTabella(d);
}
function simPassoBello(grezzo){
  if(grezzo<=0) return 1;
  const esp = Math.floor(Math.log10(grezzo));
  const fraz = grezzo / Math.pow(10, esp);
  const bello = fraz<=1 ? 1 : fraz<=2 ? 2 : fraz<=5 ? 5 : 10;
  return bello * Math.pow(10, esp);
}
function simCompatto(v){
  if(v>=1000000) return (v/1000000).toLocaleString('it-IT', {maximumFractionDigits:1})+'M';
  if(v>=1000) return Math.round(v/1000)+'k';
  return String(Math.round(v));
}
function simDisegnaGrafico(d){
  const W=760, H=330, padL=70, padR=16, padT=18, padB=38;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const conf = (d.confronto||[]).filter(p=>p.t<=d.anni+1e-9);
  const maxSaldo = Math.max(...d.periodi.map(p=>p.saldo), ...(conf.length ? conf.map(p=>p.saldo) : [0]));
  const maxVal = Math.max(d.obiettivo, maxSaldo)*1.08 || 1;
  const passo = simPassoBello(maxVal/5);
  const yTicks = [];
  for(let v=0; v<=maxVal; v+=passo) yTicks.push(v);
  if(yTicks[yTicks.length-1] < maxVal) yTicks.push(yTicks[yTicks.length-1] + passo);   // la scala copre sempre il valore più alto
  const yMax = yTicks[yTicks.length-1] || 1;
  const xPerT = t => padL + (d.anni===0 ? 0 : (t/d.anni)*innerW);
  const yPerV = v => padT + (1 - v/yMax)*innerH;
  let svg = '';
  yTicks.forEach(v=>{
    const y = yPerV(v).toFixed(1);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bordo)" stroke-width="1"/>`;
    svg += `<text x="${padL-10}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="13" fill="var(--muto)">€ ${simCompatto(v)}</text>`;
  });
  const passoX = d.anni<=10 ? 1 : Math.ceil(d.anni/10);
  const xTicks = [];
  for(let a=0; a<=d.anni+1e-9; a+=passoX) xTicks.push(a);
  if(d.anni - xTicks[xTicks.length-1] > passoX*0.35) xTicks.push(d.anni);
  const etichettaX = a => a===0 ? 'Oggi' : (Math.abs(a-Math.round(a))<0.05 ? Math.round(a)+'a' : a.toFixed(1).replace('.',',')+'a');
  xTicks.forEach(a=>{ svg += `<text x="${xPerT(a).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="13" fill="var(--muto)">${etichettaX(a)}</text>`; });
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  if(d.obiettivo>0){
    const yOb = yPerV(d.obiettivo).toFixed(1);
    svg += `<line x1="${padL}" y1="${yOb}" x2="${W-padR}" y2="${yOb}" stroke="var(--arancio)" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.9"/>`;
    svg += `<text x="${W-padR}" y="${(parseFloat(yOb)-7).toFixed(1)}" text-anchor="end" font-size="12.5" font-weight="650" fill="var(--arancio-txt)">Obiettivo € ${simCompatto(d.obiettivo)}</text>`;
  }
  const colore = d.colore || 'var(--accento)';
  if(conf.length>1){
    const lineaConf = conf.map((p,i)=>`${i===0?'M':'L'} ${xPerT(p.t).toFixed(2)} ${yPerV(p.saldo).toFixed(2)}`).join(' ');
    svg += `<path d="${lineaConf}" fill="none" stroke="var(--muto)" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>`;
  }
  const linea = d.periodi.map((p,i)=>`${i===0?'M':'L'} ${xPerT(p.t).toFixed(2)} ${yPerV(p.saldo).toFixed(2)}`).join(' ');
  const area = linea + ` L ${xPerT(d.periodi[d.periodi.length-1].t).toFixed(2)} ${H-padB} L ${xPerT(0).toFixed(2)} ${H-padB} Z`;
  svg += `<defs><linearGradient id="simGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${colore}" stop-opacity="0.16"/><stop offset="100%" stop-color="${colore}" stop-opacity="0"/></linearGradient></defs>`;
  svg += `<path d="${area}" fill="url(#simGrad)"/>`;
  svg += `<path d="${linea}" fill="none" stroke="${colore}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  const ultimo = d.periodi[d.periodi.length-1];
  svg += `<circle cx="${xPerT(ultimo.t).toFixed(2)}" cy="${yPerV(ultimo.saldo).toFixed(2)}" r="4" fill="${colore}" stroke="var(--carta)" stroke-width="1.6"/>`;
  svg += `<g id="simGuida" style="opacity:0;transition:opacity .12s ease"><line id="simGuidaLinea" x1="0" x2="0" y1="${padT}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1" stroke-dasharray="3 3"/><circle id="simGuidaPunto" r="4.5" fill="${colore}" stroke="var(--carta)" stroke-width="1.8"/></g>`;
  document.getElementById('simChart').innerHTML = svg;
  simChartInfo = {d, W, H, padL, innerW, xPerT, yPerV};
}
function simHover(clientX){
  if(!simChartInfo || !document.getElementById('simChart')) return;
  const box = document.getElementById('simChartBox');
  const rect = box.getBoundingClientRect();
  const d = simChartInfo.d;
  const svgX = (clientX - rect.left) * (simChartInfo.W / rect.width);
  const t = Math.max(0, Math.min(d.anni, ((svgX - simChartInfo.padL) / simChartInfo.innerW) * d.anni));
  let vicino = d.periodi[0], migliore = Infinity;
  for(const p of d.periodi){ const diff = Math.abs(p.t - t); if(diff < migliore){ migliore = diff; vicino = p; } }
  const px = simChartInfo.xPerT(vicino.t), py = simChartInfo.yPerV(vicino.saldo);
  const guida = document.getElementById('simGuida');
  if(guida){
    guida.style.opacity = '1';
    const gl = document.getElementById('simGuidaLinea'); gl.setAttribute('x1', px.toFixed(2)); gl.setAttribute('x2', px.toFixed(2));
    const gp = document.getElementById('simGuidaPunto'); gp.setAttribute('cx', px.toFixed(2)); gp.setAttribute('cy', py.toFixed(2));
  }
  const tip = document.getElementById('simTip');
  tip.style.left = (px / simChartInfo.W) * rect.width + 'px';
  tip.style.top = Math.max(0, (py / simChartInfo.H) * rect.height - 74) + 'px';
  tip.style.opacity = '1';
  let anni = Math.floor(vicino.t), mesi = Math.round((vicino.t - anni) * 12);
  if(mesi===12){ anni++; mesi = 0; }
  document.getElementById('simTipTit').textContent = vicino.t===0 ? 'Oggi' : (mesi===0 ? 'Anno '+anni : 'Anno '+anni+' · mese '+mesi);
  document.getElementById('simTipVal').textContent = simEuro(vicino.saldo);
}
function simTabella(d){
  if(tabellaRimandata(d, simTabella)) return;
  const s = simStato;
  let righe = [];
  if(s.modo==='pic'){
    document.getElementById('simThPeriodo').textContent = 'Anno';
    const investito = s.capitale + d.extra;
    righe = d.periodi.map((p,i)=>{
      const interesse = i===0 ? 0 : p.saldo - d.periodi[i-1].saldo;
      return `<tr><td>${i===0?'Oggi':'Anno '+p.t}</td><td>${i===0?simEuro(investito):'—'}</td><td>${simEuro(interesse)}</td><td>${simEuro(p.saldo)}</td></tr>`;
    });
  } else {
    document.getElementById('simThPeriodo').textContent = 'Periodo';
    righe = d.periodi.filter(p=>p.indice!==undefined).map(p=>{
      const anno = Math.floor((p.indice-1)/s.freq)+1, dentro = ((p.indice-1)%s.freq)+1;
      return `<tr><td>Anno ${anno} · n.${dentro}</td><td>${simEuro(p.versamento)}</td><td>${simEuro(p.interesse)}</td><td>${simEuro(p.saldo)}</td></tr>`;
    });
    righe.unshift(`<tr><td>Oggi</td><td>—</td><td>—</td><td>${simEuro(s.capitale)}</td></tr>`);
  }
  document.getElementById('simRighe').innerHTML = righe.join('');
}
</script>

        <div class="sim-eco" id="decNecessitaEco"></div>

        <div class="sim-minmax"><span>0%</span><span>12%</span></div>

      <div class="sim-freq" id="decFreq">
        ${[12,6,4,2,1].map(k=>`<button type="button" class="pill-scelta${s.freq===k?' attiva':''}" data-k="${k}" aria-pressed="${s.freq===k}" onclick="decCambiaFreq(${k})">${SIM_FREQ_NOMI[k]}</button>`).join('')}
      </div>
      <div class="sim-campo" style="margin-top:16px">

          ${['lordo','n26','n125'].map(k=>`<button type="button" class="pill-scelta${s.fiscale===k?' attiva':''}" data-k="${k}" aria-pressed="${s.fiscale===k}" onclick="decCambiaFisc('${k}')">${FISC_NOMI[k]}</button>`).join('')}

        </button>
        <div class="sim-tab-corpo" id="simTabCorpo">
          <div class="sim-tab-scroll">
            <table class="sim-tabella">

              <tbody id="simRighe"></tbody>
            </table>
          </div>

    </div>
  </div>`;
}
function decLeggiInput(){
  decStato.capitale = Math.max(0, numIT(document.getElementById('decCapitale').value) || 0);
  const nec = document.getElementById('decNecessita'); if(nec) decStato.necessita = Math.max(0, numIT(nec.value) || 0);
  const an = document.getElementById('decAnni'); if(an) decStato.anni = parseInt(an.value, 10);

    ? `${simEuro(s.capitale)} · ${simPct(s.tasso)}% · ${simAnniTesto(s.anni)}`

  decAggiorna();

function decCalcola(){
  const s = decStato;
  const r = s.tasso/100, k = s.freq;
  const i = r===0 ? 0 : Math.pow(1+r, 1/k)-1;
  const C = s.capitale;
  let P = 0, perpetuo = false, necessitaZero = false;
  if(s.modo==='orizzonte'){
    const n = Math.max(1, Math.round(s.anni*k));
    if(C<=0) P = 0;
    else if(i===0) P = C/n;
    else P = C*i/(1-Math.pow(1+i, -n));
  } else {
    if(s.necessita<=0) necessitaZero = true;
    P = Math.max(0, s.necessita)/k;
    perpetuo = C>0 && P>0 && i>0 && P <= C*i + 1e-9;
  }
  const periodi = [{t:0, saldo:C}];
  let saldo = C, totPrelevato = 0, interessi = 0, p = 0, oltre = false;
  if(C>0 && P>0){
    const maxP = 100*k;
    const limite = perpetuo ? 40*k : (s.modo==='orizzonte' ? Math.max(1, Math.round(s.anni*k)) : maxP);
    while(p < limite){
      p++;
      const interesse = saldo*i;
      let prelievo = P;
      if(!perpetuo && saldo + interesse - P < 0.005) prelievo = saldo + interesse;   // ultimo prelievo: svuota il conto
      saldo = saldo + interesse - prelievo;
      totPrelevato += prelievo; interessi += interesse;
      periodi.push({t:p/k, saldo:Math.max(0,saldo), prelievo, interesse, indice:p});
      if(!perpetuo && saldo <= 0.005){ saldo = 0; break; }
    }
    oltre = !perpetuo && s.modo==='necessita' && p>=maxP && saldo>0;
  }
  return {periodi, nPeriodi:p, perpetuo, oltre, necessitaZero,
    prelievoP:P, prelievoAnnuo:P*k, totPrelevato, interessi, saldoFinale:saldo};
}
function decDurataTesto(nPeriodi, k){
  const tot = nPeriodi/k;
  let anni = Math.floor(tot + 1e-9), mesi = Math.round((tot - anni)*12);
  if(mesi===12){ anni++; mesi = 0; }
  const pAnni = anni + (anni===1 ? ' anno' : ' anni');
  const pMesi = mesi + (mesi===1 ? ' mese' : ' mesi');
  if(anni<=0) return pMesi;
  if(mesi===0) return pAnni;
  return pAnni + ' e ' + pMesi;
}
function decAggiorna(){
  if(simPagina!=='decumulo' || !document.getElementById('simChart')) return;
  const s = decStato;
  const anVal = document.getElementById('decAnniVal'); if(anVal) anVal.textContent = simAnniTesto(s.anni);
  document.getElementById('decTassoVal').textContent = simPct(s.tasso)+'%';
  document.getElementById('decCapitaleEco').textContent = '';
  const necEco = document.getElementById('decNecessitaEco'); if(necEco) necEco.textContent = "all'anno";
  document.getElementById('decHeroTag').textContent = 'Prelievi ' + {12:'mensili',6:'bimestrali',4:'trimestrali',2:'semestrali',1:'annuali'}[s.freq];
  const d = decCalcola();
  const et = document.getElementById('decRisEt'), cifra = document.getElementById('decRisCifra'), nota = document.getElementById('decRisNota');
  cifra.classList.remove('testo');
  const perParola = SIM_FREQ_PAROLA[s.freq];
  const aliq = FISC_ALIQ[s.fiscale] || 0;
  const imposta = Math.max(0, d.interessi) * aliq;
  let risTesto = '—', animaPrelievo = false;
  if(s.capitale<=0){
    et.textContent = 'Manca il capitale di partenza';
    cifra.textContent = '—';
    nota.textContent = 'Inserisci il capitale esistente (il montante) per vedere la simulazione.';
  } else if(s.modo==='orizzonte'){
    et.textContent = 'Puoi prelevare ogni anno';
    animaPrelievo = true; risTesto = simEuro(d.prelievoAnnuo);
    nota.innerHTML = (s.freq===1 ? '' : `Pari a <b>${simEuro(d.prelievoP)}</b> al ${perParola}. `) +
      `Partendo da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale dura <b>${simAnniTesto(s.anni)}</b> e si esaurisce alla fine.`;
  } else if(d.necessitaZero){
    et.textContent = 'Indica la necessità annua';
    cifra.textContent = '—';
    nota.textContent = 'Scrivi quanto ti serve prelevare ogni anno: calcolo io per quanti anni basterà il capitale.';
  } else if(d.perpetuo){
    et.textContent = 'Il capitale non si esaurisce';
    cifra.textContent = risTesto = 'Per sempre'; cifra.classList.add('testo');
    nota.innerHTML = `I rendimenti coprono i prelievi: prelevando <b>${simEuro(s.necessita)}</b> all'anno da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale non scende mai. Dopo 40 anni ne avresti ancora <b>${simEuro(d.saldoFinale)}</b>.`;
  } else if(d.oltre){
    et.textContent = 'Il capitale ti dura';
    cifra.textContent = risTesto = 'Oltre 100 anni'; cifra.classList.add('testo');
    nota.innerHTML = `Prelevando <b>${simEuro(s.necessita)}</b> all'anno da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale dura più di 100 anni.`;
  } else {
    et.textContent = 'Il capitale ti dura';
    cifra.textContent = risTesto = decDurataTesto(d.nPeriodi, s.freq); cifra.classList.add('testo');
    nota.innerHTML = `Prelevando <b>${simEuro(s.necessita)}</b> all'anno${s.freq===1 ? '' : ` (<b>${simEuro(d.prelievoP)}</b> al ${perParola})`} da <b>${simEuro(s.capitale)}</b> al ${simPct(s.tasso)}% annuo, il capitale si esaurisce dopo <b>${decDurataTesto(d.nPeriodi, s.freq)}</b>.`;
  }
  if(animaPrelievo) animaCifra(cifra, d.prelievoAnnuo, simEuro); else delete cifra.dataset.v;
  if(s.capitale>0 && aliq>0 && imposta>0)
    nota.innerHTML += ` L'imposta del ${simPct(aliq*100)}% sulla quota di guadagno vale circa <b>−${simEuro(imposta)}</b> sull'intero periodo${animaPrelievo ? `: il prelievo annuo equivale in media a <b>${simEuro(Math.max(0, d.prelievoAnnuo - imposta/Math.max(1,(d.nPeriodi/s.freq))))}</b> netti` : ''}.`;
  animaCifra(document.getElementById('decChipIniziale'), s.capitale, simEuro);
  document.getElementById('decChipPrelevatoEt').textContent = d.perpetuo ? 'Prelevato in 40 anni' : 'Totale prelevato';
  animaCifra(document.getElementById('decChipPrelevato'), d.totPrelevato, simEuro);
  animaCifra(document.getElementById('decChipInteressi'), d.interessi, simEuro);
  const fiscBox = document.getElementById('decChipFiscBox');
  if(fiscBox){
    fiscBox.style.display = (aliq>0 && s.capitale>0) ? '' : 'none';
    if(aliq>0) animaCifra(document.getElementById('decChipFisc'), imposta, simEuro);
  }
  risBarAggiorna(et.textContent, risTesto, 'var(--verde-txt)');
  const fineT = d.periodi[d.periodi.length-1].t;
  const leg = document.getElementById('simLegConfronto');
  if(leg) leg.style.display = decScenario ? '' : 'none';
  confAggiornaSblocca(!!decScenario);
  const confBox = document.getElementById('confBox');
  if(confBox){
    if(decScenario && decScenario.stato){
      const b = decScenario, bs = b.stato;
      const MODI = {orizzonte:'Quanto prelevo', necessita:'Quanto dura'};
      const durTesto = x => x.perpetuo ? 'Per sempre' : (x.oltre ? 'Oltre 100 anni' : decDurataTesto(x.nPeriodi, x.freq));
      const righe = [
        {eti:'Cosa calcolo', blocco:MODI[bs.modo], ora:MODI[s.modo], diff:confDiffTesto(bs.modo, s.modo, 'cambiato')},
        {eti:'Capitale esistente', blocco:simEuro(bs.capitale), ora:simEuro(s.capitale), diff:confDiffNum(bs.capitale, s.capitale, simEuro)}
      ];
      if(bs.modo==='necessita' && s.modo==='necessita')
        righe.push({eti:'Necessità annua', blocco:simEuro(bs.necessita), ora:simEuro(s.necessita), diff:confDiffNum(bs.necessita, s.necessita, simEuro)});
      if(bs.modo==='orizzonte' && s.modo==='orizzonte')
        righe.push({eti:'Orizzonte', blocco:simAnniTesto(bs.anni), ora:simAnniTesto(s.anni), diff:confDiffNum(bs.anni, s.anni, v=>simAnniTesto(Math.round(v)))});
      righe.push({eti:'Rendimento atteso', blocco:confPct(bs.tasso), ora:confPct(s.tasso), diff:confDiffNum(bs.tasso, s.tasso, confPct)});
      righe.push({eti:'Frequenza prelievi', blocco:SIM_FREQ_NOMI[bs.freq], ora:SIM_FREQ_NOMI[s.freq], diff:confDiffTesto(bs.freq, s.freq, 'cambiata')});
      righe.push({eti:'Regime fiscale', blocco:FISC_NOMI[bs.fiscale], ora:FISC_NOMI[s.fiscale], diff:confDiffTesto(bs.fiscale, s.fiscale, 'cambiato')});
      if(bs.modo==='orizzonte' && s.modo==='orizzonte')
        righe.push({eti:'Prelievo annuo possibile', forte:true, blocco:simEuro(b.prelievoAnnuo), ora:simEuro(d.prelievoAnnuo), diff:confDiffNum(b.prelievoAnnuo, d.prelievoAnnuo, simEuro, 'su')});
      if(bs.modo==='necessita' && s.modo==='necessita'){
        const durB = {perpetuo:b.perpetuo, oltre:b.oltre, nPeriodi:b.nPeriodi, freq:b.freq};
        const durO = {perpetuo:d.perpetuo, oltre:d.oltre, nPeriodi:d.nPeriodi, freq:s.freq};
        righe.push({eti:'Durata del capitale', forte:true, blocco:durTesto(durB), ora:durTesto(durO), diff:confDiffDurata(durB, durO)});
      }
      righe.push({eti:'Totale prelevato', blocco:simEuro(b.totPrelevato), ora:simEuro(d.totPrelevato), diff:confDiffNum(b.totPrelevato, d.totPrelevato, simEuro)});
      righe.push({eti:'Interessi maturati', blocco:simEuro(b.interessi), ora:simEuro(d.interessi), diff:confDiffNum(b.interessi, d.interessi, simEuro, 'su')});
      confBox.innerHTML = confCardHtml('decumulo', righe);
    } else confBox.innerHTML = '';
  }
  simDisegnaGrafico({periodi:d.periodi, anni:Math.max(fineT, 1), obiettivo:0, capitale:s.capitale, colore:'var(--verde)', confronto: decScenario ? decScenario.periodi : null});
  decTabella(d);
}
function decTabella(d){
  if(tabellaRimandata(d, decTabella)) return;
  const righe = d.periodi.filter(p=>p.indice!==undefined).map(p=>{
    const anno = Math.floor((p.indice-1)/decStato.freq)+1, dentro = ((p.indice-1)%decStato.freq)+1;
    const eti = decStato.freq===1 ? 'Anno '+anno : `Anno ${anno} · n.${dentro}`;
    return `<tr><td>${eti}</td><td>${simEuro(p.prelievo)}</td><td>${simEuro(p.interesse)}</td><td>${simEuro(p.saldo)}</td></tr>`;
  });
  righe.unshift(`<tr><td>Oggi</td><td>—</td><td>—</td><td>${simEuro(decStato.capitale)}</td></tr>`);
  document.getElementById('simRighe').innerHTML = righe.join('');
}

function uniCalcola(){
  const s = uniStato;
  const citta = UNI_CITTA.find(c=>c.k===s.citta) || UNI_CITTA[0];
  const ind = UNI_INDIRIZZI.find(i=>i.k===s.indirizzo) || UNI_INDIRIZZI[0];
  const corso = UNI_CORSI.find(c=>c.k===s.corso) || UNI_CORSI[0];
  const anniTot = corso.anni + s.fuoriCorso;
  const tasse = s.tipoAteneo==='statale' ? uniTasseStatali(s.isee) : s.retta;
  let alloggio = 0, vitto = 0, trasporti = 0;
  if(s.sistemazione==='famiglia'){
    if(s.km>0) trasporti = s.mezzo==='pubblico'
      ? (25 + 0.85*s.km) * UNI_MESI                 // abbonamento mensile stimato dalla distanza
      : s.km*2*22*0.35 * UNI_MESI;                  // 0,35 €/km (costo pieno auto), 22 giorni al mese
  } else {
    alloggio = s.sistemazione==='affitto' ? citta.affitto*12 : citta.affitto*1.7*UNI_MESI;   // collegio: retta ~70% sopra l'affitto, 10 mensilità
    vitto = (s.vitto==='mensa' ? 160 : 280) * UNI_MESI;
    trasporti = 25*UNI_MESI + 400;                  // abbonamento urbano + rientri a casa
  }
  const materiale = ind.materiale;
  const annuoOggi = tasse + alloggio + vitto + trasporti + materiale;
  const infl = s.inflazione/100;
  const annoCorrente = new Date().getFullYear();
  const anni = [];
  let totale = 0;
  for(let j=0; j<anniTot; j++){
    const f = Math.pow(1+infl, s.anniMancanti + j);
    const a = { n:j+1, solare: annoCorrente + s.anniMancanti + j, fuoriCorso: j>=corso.anni,
      tasse:tasse*f, alloggio:alloggio*f, vitto:vitto*f, trasporti:trasporti*f, materiale:materiale*f };
    a.totale = a.tasse + a.alloggio + a.vitto + a.trasporti + a.materiale;
    totale += a.totale;
    anni.push(a);
  }
  const cat = {tasse:0, alloggio:0, vitto:0, trasporti:0, materiale:0};
  anni.forEach(a=>{ UNI_CAT.forEach(c=>{ cat[c.k] += a[c.k]; }); });
  return { anni, anniTot, totale, totaleOggi:annuoOggi*anniTot, annuoOggi, cat,
    tasseAnno:tasse, citta, ind, corso };
}

function uniDisegnaGrafico(d){
  const W=760, H=330, padL=70, padR=16, padT=26, padB=38;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const maxVal = Math.max(...d.anni.map(a=>a.totale))*1.12 || 1;
  const passo = simPassoBello(maxVal/5);
  const yTicks = [];
  for(let v=0; v<=maxVal; v+=passo) yTicks.push(v);
  if(yTicks[yTicks.length-1] < maxVal) yTicks.push(yTicks[yTicks.length-1] + passo);
  const yMax = yTicks[yTicks.length-1] || 1;
  const yPerV = v => padT + (1 - v/yMax)*innerH;
  let svg = '';
  yTicks.forEach(v=>{
    const y = yPerV(v).toFixed(1);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bordo)" stroke-width="1"/>`;
    svg += `<text x="${padL-10}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="13" fill="var(--muto)">€ ${simCompatto(v)}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--bordo-forte)" stroke-width="1"/>`;
  const n = d.anni.length;
  const slot = innerW/n;
  const barW = Math.min(64, slot*0.62);
  d.anni.forEach((a,idx)=>{
    const x = padL + slot*idx + (slot-barW)/2;
    const y = yPerV(a.totale);
    const colore = a.fuoriCorso ? 'var(--arancio)' : 'var(--viola)';
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,(H-padB-y)).toFixed(1)}" rx="6" fill="${colore}" opacity="0.9"/>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="650" fill="var(--muto)">€ ${simCompatto(a.totale)}</text>`;
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="12.5" fill="var(--muto)">${n>7 ? a.solare : a.n+'º · '+a.solare}</text>`;
  });
  document.getElementById('uniChart').innerHTML = svg;
}
function uniTabella(d){
  if(tabellaRimandata(d, uniTabella)) return;
  const righe = d.anni.map(a=>`<tr>
    <td>${a.n}º anno · ${a.solare}${a.fuoriCorso?' <span class="muto">(fuori corso)</span>':''}</td>
    <td>${simEuro(a.tasse)}</td><td>${simEuro(a.alloggio)}</td><td>${simEuro(a.vitto)}</td>
    <td>${simEuro(a.trasporti)}</td><td>${simEuro(a.materiale)}</td><td><b>${simEuro(a.totale)}</b></td>

  const totRiga = `<tr><td><b>Totale</b></td><td><b>${simEuro(d.cat.tasse)}</b></td><td><b>${simEuro(d.cat.alloggio)}</b></td><td><b>${simEuro(d.cat.vitto)}</b></td><td><b>${simEuro(d.cat.trasporti)}</b></td><td><b>${simEuro(d.cat.materiale)}</b></td><td><b>${simEuro(d.totale)}</b></td></tr>`;
  document.getElementById('uniRighe').innerHTML = righe + totRiga;
}

<script>
/* ================= SIMULATORE DI SUCCESSIONE EREDITARIA =================
   v97 — Denaro, gioielli e mobilia (art. 9 c. 2 D.Lgs. 346/1990): senza inventario
   analitico si presumono nell'attivo per il 10% del valore globale netto imponibile,
   anche se non dichiarati o dichiarati per meno; con l'inventario vale il valore che ne
   risulta. Solo per il fisco: le quote civili e la legittima non cambiano. Oro da
   investimento e preziosi a fini commerciali restano fuori dal forfait (valore reale).
   v96 — Beni mobili registrati: auto, moto e camper esenti da imposta di successione,
   IPT di voltura per veicolo; barche, navi e aeromobili imponibili con trascrizione.
   v95 — Quattro domande davanti al cliente: chi eredita e quanto, la legittima è
   rispettata, quante imposte si pagano, cosa va fuori successione.
   Immobili, beni mobili registrati e altri beni di valore sono ELENCHI (tipo, nota,
   valore) e, con testamento, ogni bene si può assegnare a UNA persona: quel bene esce
   dalla massa (legato), il resto si divide per quote, la legittima si verifica sul
   totale effettivo e, se lesa, arrivano i consigli su come sistemare.
   Riferimenti normativi: successione legittima artt. 565-586 c.c.; quote di legittima
   (riserva) artt. 536-542 c.c.; imposta di successione D.Lgs. 346/1990 con aliquote e
   franchigie in vigore nel 2026; imposte ipotecaria e catastale D.Lgs. 347/1990;
   polizze caso morte art. 1920 c.c. e art. 12 D.Lgs. 346/1990; previdenza complementare
   art. 14 D.Lgs. 252/2005. Tutti i calcoli restano in locale.
   Se cambiano le aliquote si toccano solo SUC_CLASSI e le costanti delle imposte immobiliari. */

const SUC_CLASSI = {
  retta:    {nome:'Coniuge e parenti in linea retta', breve:'Linea retta',   aliq:0.04, franchigia:1000000},
  fratelli: {nome:'Fratelli e sorelle',               breve:'Fratelli',      aliq:0.06, franchigia:100000},

};

   analitico (artt. 769 ss. c.p.c.) si presumono compresi nell'attivo per il 10% del
   valore globale netto imponibile, anche se non dichiarati o dichiarati per meno. */
const SUC_PRESUNZIONE = 0.10;
const SUC_CAT = [
  {k:'liquidita',      nome:'Conti correnti',           colore:'var(--accento)'},
  {k:'titoli',         nome:'Titoli e fondi',            colore:'var(--viola)'},
  {k:'titoliStato',    nome:'Titoli di Stato (esenti)',  colore:'var(--verde)'},

/* IPT (Imposta Provinciale di Trascrizione, D.Lgs. 446/1997 art. 56 e D.M. 435/1998) dovuta
   al PRA per la trascrizione dell'accettazione di eredità di auto, moto e camper:

const SUC_IPT = {fissa:150.81, kwSoglia:53, perKw:3.5119, motoFissa:25.82, motoKwSoglia:11, maggiorazione:1.30};
/* Imposte e diritti di trascrizione nei registri di barche, navi e aeromobili: importi

/* ---------- numeri e formattazione ---------- */
const sucN = v => { const n = typeof v==='number' ? v : parseFloat(v); return isFinite(n) ? n : 0; };
const sucPos = v => Math.max(0, sucN(v));
function sucArr2(x){ return Math.round((x||0)*100)/100; }
function sucPct(f){ return (isFinite(f)?f*100:0).toLocaleString('it-IT',{minimumFractionDigits:0, maximumFractionDigits:2}) + '%'; }
function sucPctNum(p){ return (Math.round((p||0)*100)/100).toLocaleString('it-IT',{maximumFractionDigits:2}) + '%'; }
function sucFrazione(f){
  const noti = [[1,'intero'],[1/2,'1/2'],[1/3,'1/3'],[2/3,'2/3'],[1/4,'1/4'],[3/4,'3/4'],[1/6,'1/6'],[1/12,'1/12'],[1/8,'1/8']];
  for(const [v,t] of noti) if(Math.abs(f-v)<0.0005) return t;
  return '';
}
function sucLista(k){ return SUC_LISTE_BENI.find(x=>x.k===k); }
function sucNomeTipo(lista, k){ const L = sucLista(lista); const t = L && L.tipi.find(x=>x.k===k); return t ? t.nome : '—'; }
function sucNomeTipoImmobile(k){ return sucNomeTipo('immobili', k); }

function sucBeneNome(lista, b){

  const t = sucNomeTipo(lista, b.tipo), n = (b.nota||'').trim();

}
